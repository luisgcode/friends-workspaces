      ex:["For example, a long ambient mix while auditing alt text across a whole product range."],
      why:["Because music without lyrics fills the silence without stealing attention."] },

    { id:"deep-work", q:"How do you get deep work done?", k:["deep work","focus time","concentrate","concentration","focus block","staying focused","productivity"],
      a:["I block a couple of hours, close chat, put the headphones on and work on one thing only.","One task, one window, no notifications. It sounds simple because it is, the hard part is sticking to it.","I save deep work for the morning when my head is clear and leave replies for later.","I protect long blocks in my calendar. Meetings scattered everywhere kill real work."],
      more:["I keep a scratch list next to me. If a random thought appears, I write it down and get back to the task.","Small tasks get batched into one slot so they do not leak into focus time."],
      ex:["For example, rewriting a whole product category's descriptions happens in one long block, not in ten small ones."],
      why:["Because switching tasks has a hidden cost, and it adds up fast."] },

    { id:"interruptions", q:"How do you handle interruptions?", k:["interruptions","interrupted","distractions","quick question","disturbing you","tap on the shoulder"],
      a:["If it is urgent, I stop. If it is not, I write it down and come back to it.","The famous quick question is rarely quick. I ask people to send it as a request so it does not get lost.","I am happy to help, just not in the middle of a sentence. Give me ten minutes and I am all yours.","Headphones on is the signal. Most people respect it, and I respect the truly urgent ones."],
      more:["I keep set times where I answer messages, so people know they will hear back soon.","Writing it down also means I can prioritize it properly instead of doing whatever arrived last."],
      ex:["For example, a request to change a button color can wait until after lunch. A broken contact form cannot."],
      why:["Because every interruption costs more than the minute it takes."] },

    { id:"favorite-part", q:"What is your favorite part of the job?", k:["favorite part","best part","enjoy most","love about","favourite part","most fun"],
      a:["Taking a messy page and making it clean, fast and clear. Very satisfying.","Launch moments. You press publish and something you built is suddenly live for everyone.","Fixing a problem nobody noticed and making the site a little better quietly.","Seeing a page load in under a second after we optimized it. Small joys."],
      more:["I also like the puzzle side: figuring out why a page is slow or why a product is not showing up.","And organizing things. A well structured catalog makes me unreasonably happy."],
      ex:["For example, shrinking a page from 8 MB to 1 MB without anyone noticing a visual difference."],
      why:["Because the web is one of the few places where small fixes reach a lot of people instantly."] },

    { id:"hardest-part", q:"What is the hardest part of the job?", k:["hardest part","most difficult","toughest","challenges","biggest challenge","worst part"],
      a:["Prioritizing. Everything is urgent to someone, and I have to choose.","Keeping things consistent when many people touch the same pages.","Data that arrives wrong. A typo upstream becomes a typo on every page.","Saying no, or not yet, in a friendly way."],
      more:["The technical stuff is usually solvable. The tricky part is agreeing on what we want.","Old content is hard too. Pages nobody owns quietly go out of date."],
      ex:["For example, three teams asking for the homepage banner on the same week."],
      why:["Because people problems do not come with an error message."] },

    { id:"how-websites-work", q:"How does a website actually work?", k:["how websites work","website works","how the internet works","behind a website","loading a website"],
      a:["You type an address, your browser asks where that site lives, a server sends back files, and your browser builds the page.","A website is files sitting on a computer called a server. Your browser asks for them and turns them into what you see.","Domain to find it, server to store it, browser to show it. That is the short version.","It is a conversation: your browser asks, the server answers, and the page appears in a blink, ideally."],
      more:["The files are mostly HTML for structure, CSS for looks and JavaScript for behavior, plus images and fonts.","Many sites build pages on the fly from a database, which is what a content management system does."],
      ex:["For example, opening a product page triggers dozens of small requests: the page, styles, scripts and every image."],
      why:["Because knowing the basics makes it easier to understand why something is slow or broken."] },

    { id:"domains", q:"What is a domain name?", k:["domain","domain name","domains","web address","register a domain","domain renewal"],
      a:["It is the human friendly address of a site, so you do not have to remember a string of numbers.","A domain is like a street address for a website. You rent it yearly, you never truly own it forever.","The name people type to find you. Short, clear and easy to spell is best.","It points visitors to the right server. Lose it and the site might as well not exist."],
      more:["Domains must be renewed. Letting one expire is a classic and very avoidable disaster.","Companies often own many domains: misspellings and old names that redirect to the main site."],
      ex:["For example, an old campaign domain can redirect to the current product page so old links still work."],
      why:["Because people remember names, not numbers."] },

    { id:"dns", q:"What is DNS?", k:["dns","domain name system","dns records","nameservers","dns propagation","a record"],
      a:["DNS is the phone book of the internet. It turns a domain name into the address of a server.","When you type a site name, DNS looks up where it lives. It happens in milliseconds, every time.","It is the system that connects names to servers. Change it carefully, mistakes travel fast.","Think of it as signposts. The domain is the place name, DNS tells you which road to take."],
      more:["DNS changes can take a while to spread everywhere because answers are cached around the world.","There are different record types: some point to servers, some handle email, some prove you own the domain."],
      ex:["For example, moving a site to a new server mostly means updating one DNS record and waiting."],
      why:["Because without DNS we would all be typing numbers into browsers."] },

    { id:"hosting-servers", q:"What is web hosting?", k:["hosting","web hosting","server","servers","host a site","cloud hosting","data center"],
      a:["Hosting is renting space on a computer that is always on and connected, so your site is reachable.","A server is just a computer whose job is to answer requests from browsers all day.","Hosting is where the site lives. Good hosting is boring: fast, stable, never in the news.","It is the landlord of your website. You want one that fixes the heating quickly."],
      more:["Bigger sites often use several servers plus a network that copies files closer to visitors.","Hosting choice affects speed, uptime and security, so it is worth getting right."],
      ex:["For example, a site served from another continent loads slower than one with servers nearby."],
      why:["Because a great site on bad hosting is still a slow site."] },

    { id:"browsers", q:"What does a browser actually do?", k:["browser","browsers","web browser","rendering","different browsers","browser compatibility"],
      a:["It downloads the files of a page and turns code into something you can read and click.","A browser is a translator: it reads HTML, CSS and JavaScript and paints the page.","It fetches, builds and displays. And it has great developer tools hidden inside.","Every browser does it slightly differently, which is why we test in more than one."],
      more:["The browser also caches files so the second visit is faster.","Small differences between browsers can move a layout a few pixels or break a feature entirely."],
      ex:["For example, a form that works on desktop might misbehave on a phone browser, so I test both."],
      why:["Because the browser is where the visitor actually experiences our work."] },

    { id:"cms-basics", q:"What is a CMS?", k:["cms","content management system","content management","site editor","backend","admin panel"],
      a:["A content management system lets people edit a website without writing code.","It is the backstage of the site: forms and screens where we create pages, upload images and publish.","A CMS separates content from design, so editors write and the templates handle the looks.","It is my main workspace. Most of my day happens inside one."],
      more:["It stores content in a database and builds pages from templates when someone visits.","Good CMS setups have clear content types, roles and a review step before publishing."],
      ex:["For example, adding a new product page means filling in fields like title, images and specs, then hitting publish."],
      why:["Because nobody should need a developer to fix a typo."] },

    { id:"content-types", q:"What are content types?", k:["content types","content type","page types","structured content","fields","content model"],
      a:["They are templates for kinds of content: a product, a news article, a landing page, each with its own fields.","A content type defines what information a page needs. A product has specs, an article has an author and date.","They keep content structured. Same fields every time means same layout every time.","Think of them as forms. Fill in the boxes and the site knows how to display it."],
      more:["Well designed fields make content reusable: the same spec can appear on a page, a comparison and a filter.","Too many content types becomes confusing, so I keep them few and clear."],
      ex:["For example, a product type might have fields for title, model number, wattage, images and manual."],
      why:["Because structure is what lets a site stay consistent with many editors."] },

    { id:"blocks-components", q:"What are blocks on a website?", k:["blocks","content blocks","components","page builder","reusable blocks","sections"],
      a:["Blocks are reusable pieces of a page: a banner, a text section, a product grid, a call to action.","They are like building bricks. Stack them to make a page without coding each time.","A block built once can be reused on many pages, and fixing it once fixes it everywhere.","They make pages quick to build and keep the design consistent."],
      more:["Some blocks are shared, like a footer, and some are placed only on one page.","Too many one-off blocks become hard to maintain, so I prefer a small set that does a lot."],
      ex:["For example, a where to buy block can appear on every product page from one place."],
      why:["Because reuse beats copy and paste every time."] },

    { id:"menus-navigation", q:"How do you decide what goes in the menu?", k:["menu","menus","navigation","main menu","nav bar","site navigation","mega menu"],
      a:["I put what most visitors are looking for, using their words, not internal team names.","Fewer items, clear labels. If the menu needs a manual, it is wrong.","Analytics help: the most visited sections earn a spot, the rest go one level down.","The menu is a promise. Every label should take you exactly where you expect."],
      more:["I test labels with real people when I can. Internal jargon sneaks in easily.","Mobile matters too: a menu that is fine on desktop can be a long scroll on a phone."],
      ex:["For example, a label like Products by Room can work better than a technical category name."],
      why:["Because if people cannot find it, it might as well not exist."] },

    { id:"roles-permissions", q:"What are user roles and permissions?", k:["roles","permissions","user roles","access levels","admin access","editor role"],
      a:["They decide who can do what in the CMS: write, edit, publish or change settings.","Not everyone needs the keys to everything. Editors edit, admins administer.","Roles keep the site safe. Fewer people who can break things means fewer broken things.","Each role gets the minimum access it needs to do its job."],
      more:["I review accounts now and then and remove ones that are no longer used.","A good setup lets someone draft content while another person reviews and publishes it."],
      ex:["For example, a content editor can update product text but cannot change site settings."],
      why:["Because least access is one of the simplest security wins."] },

    { id:"drafts-publishing", q:"How does publishing work?", k:["publishing","publish","drafts","draft","unpublished","go live","content workflow"],
      a:["Content starts as a draft, gets reviewed, then gets published. Simple flow, fewer accidents.","Draft means only editors see it. Published means the world sees it.","I like a quick review step before publish. A second pair of eyes catches what the first missed.","You can schedule publishing too, handy for launches at a specific time."],
      more:["Unpublishing hides a page without deleting it, which is safer than removing it.","For big changes I preview on several screen sizes before publishing."],
      ex:["For example, a new product page sits as a draft until its images and manual are ready."],
      why:["Because publishing is instant, and so are mistakes."] },

    { id:"revisions", q:"What are revisions in a CMS?", k:["revisions","revision history","version history","undo changes","previous version","rollback"],
      a:["Every time someone saves a page, the CMS keeps a copy, so you can go back.","Revisions are an undo button with a memory. Who changed what, and when.","They have saved me more than once. Something looks wrong, check the history, restore.","A safety net for content. I always leave a short note on why I changed something."],
      more:["Comparing two revisions side by side shows exactly what changed.","Revision notes help future me understand past me's decisions."],
      ex:["For example, if a description was overwritten by mistake, I restore yesterday's version in a click."],
      why:["Because everyone makes mistakes, and revisions make them cheap."] },

    { id:"product-pages", q:"What makes a good product page?", k:["product page","product pages","pdp","product detail page","product listing","item page"],
      a:["Clear title, good images, the key specs up top, and the documents people need. No fluff.","It answers the visitor's questions before they ask: what is it, does it fit, how does it work, where to get it.","Fast, honest and easy to scan. Pretty is nice, clear is essential.","Great photos, real specs and a clear next step."],
      more:["Consistency across products matters: same order of specs, same image style, same structure.","Manuals and spec sheets are popular downloads, so I make them easy to find."],
      ex:["For example, a heater page should show size, wattage and room coverage right away, not buried at the bottom."],
      why:["Because a product page is often the first and only page a visitor sees."] },

    { id:"product-titles", q:"How do you write a product title?", k:["product title","product titles","product name","naming products","title format","product naming"],
      a:["Same pattern for every product: type, key feature, size or model. Predictable is good.","Short, specific and readable. Visitors should know what it is in one glance.","I follow a formula so titles stay consistent across the whole catalog.","No internal codes alone. A model number helps, but people search with words."],
      more:["The title often feeds the page title for search engines, so it pulls double duty.","Long titles get cut off in listings and search results, so the important words go first."],
      ex:["For example, a title like 36 inch Electric Fireplace Insert is clearer than a model code alone."],
      why:["Because consistent titles make a catalog easy to browse and easy to search."] },

    { id:"product-descriptions", q:"How do you write product descriptions?", k:["product description","product descriptions","product copy","describing products","marketing copy","product text"],
      a:["Benefits first, features second, and short paragraphs. People skim.","I write for the person buying it, not the engineer who built it.","A good description answers why should I care in the first two lines.","Plain language, no walls of text, and every claim backed by a spec."],
      more:["Bullet points work well for key features. Paragraphs for the story.","I avoid copying the same description across products. Each one should say what makes it different."],
      ex:["For example, heats a medium room quietly is more useful than a list of internal component names."],
      why:["Because people do not read websites, they scan them."] },

    { id:"product-specs", q:"How should product specs be shown?", k:["specs","specifications","spec table","technical specs","product specs","dimensions","attributes"],
      a:["In a clean table, same order on every product, with units always included.","Most important specs first. Dimensions and power before the obscure stuff.","Consistent labels and units. Mixing inches and centimeters randomly is a crime.","Specs should be scannable in seconds. Two columns: label and value."],
      more:["Specs usually come from a central product data system, so fixing them there fixes them everywhere.","Empty specs should be hidden rather than shown as blank or N/A."],
      ex:["For example, Width, Height, Depth, Wattage, Voltage, always in that order across the range."],
      why:["Because people compare products, and comparing needs consistency."] },

    { id:"product-images", q:"What makes good product images?", k:["product images","product photos","product photography","image gallery","main image","lifestyle images"],
      a:["A clean main image on a plain background, then lifestyle shots that show it in a real room.","Same angle, same background, same size for every product. Consistency looks professional.","Enough images to answer questions: front, side, details, and in use.","Sharp, light and compressed. Great photos are useless if they take ten seconds to load."],
      more:["The first image does the heavy lifting in listings, so it needs to be the clearest.","Lifestyle images help people imagine the product at home, which specs alone cannot do."],
      ex:["For example, a white background front view first, then a living room shot, then close ups of controls."],
      why:["Because people buy with their eyes first."] },

    { id:"product-documents", q:"Why do product pages have manuals and documents?", k:["manuals","product manual","documents","spec sheet","pdf downloads","installation guide","user guide"],
      a:["People want the manual before they buy and after they lose the paper one. Very popular downloads.","Installers and customers need spec sheets and guides, so we make them easy to find.","Documents answer the detailed questions a page cannot. And they save a lot of support calls.","A product page without its manual feels unfinished."],
      more:["Clear file names and labels matter: Installation Manual beats doc_final_v3.pdf.","When a manual is updated, the old file should be replaced, not left hanging around."],
      ex:["For example, a downloads section with Owner's Manual, Spec Sheet and Installation Guide, clearly labeled."],
      why:["Because the right document at the right time prevents a lot of frustration."] },

    { id:"product-variants", q:"What are product variants?", k:["variants","product variants","variations","sizes and colors","options","variant selector"],
      a:["Versions of the same product, like different sizes, colors or power options, shown on one page.","Instead of five nearly identical pages, one page with a selector. Cleaner for everyone.","Variants group similar products so visitors can switch between options easily.","They are great when done right, confusing when two options look identical."],
      more:["Each variant still has its own data: model number, specs, sometimes its own images.","Variant labels need to be clearly different, otherwise people cannot tell which to pick."],
      ex:["For example, the same fireplace in 50, 60 and 74 inch widths with a size selector."],
      why:["Because fewer, richer pages beat many thin, duplicate ones."] },

    { id:"product-data-system", q:"Where does product data come from?", k:["product data","product information","catalog data","data feed","product database","data import"],
      a:["From a central product information system. It feeds the website, so we edit data in one place.","One source of truth, many destinations. The site just displays what the data says.","Product data is managed centrally and synced to the site, often every night.","If data is wrong on the site, the fix usually belongs upstream, not on the page."],
      more:["Syncs can fail quietly, so I check a few products after big imports.","Clean data in means clean pages out. Messy data in means a very long week."],
      ex:["For example, updating a wattage once in the central system updates the product page after the next sync."],
      why:["Because editing the same fact in five places guarantees five different versions."] },

    { id:"catalogs-categories", q:"How do you organize a product catalog?", k:["catalog","product catalog","categories","category pages","product listing pages","taxonomy","plp"],
      a:["By how customers think: type, room, size. Not by internal department names.","Clear categories, consistent naming, and every product in at least one place.","A good catalog is a tidy closet. Everything has a shelf and you know where it is.","Categories plus filters. Categories for browsing, filters for narrowing down."],
      more:["Order matters on listing pages: popular or key products first, not random.","When a product is removed and added back, it can lose its category, so I always check."],
      ex:["For example, a category for wall mounted heaters with filters for wattage and color."],
      why:["Because a product nobody can find is a product nobody buys."] },

    { id:"filters-search", q:"How do filters and site search help?", k:["filters","site search","search box","faceted search","search bar","filtering products"],
      a:["Filters let people narrow a big list fast. Search lets them skip the browsing entirely.","Good filters depend on good data. If the size field is empty, the filter cannot find it.","I check what people search for on the site. It tells me what they cannot find in the menu.","A search with zero results is a lost visitor, so I watch those closely."],
      more:["Filter labels should use customer language and show only useful options.","Synonyms in search help: people type all sorts of words for the same thing."],
      ex:["For example, if many people search a term we never use, I add it to the content."],
      why:["Because helping people find things is half of web management."] },

    { id:"seo-basics", q:"What is SEO in simple words?", k:["seo","search engine optimization","search ranking","rank higher","organic traffic","search results"],
      a:["Making pages easy for search engines to understand and worth showing to people.","Clear titles, useful content, fast pages, clean URLs. Most SEO is just doing the basics well.","It is about matching what people search with pages that actually answer it.","Good SEO and good user experience are mostly the same thing."],
      more:["Technical SEO covers speed, structure and indexing. Content SEO covers what you write.","There are no magic tricks. Consistency and quality win over time."],
      ex:["For example, a product page titled clearly with the words people search for will usually do better than a vague one."],
      why:["Because most visitors arrive from search engines, not by typing our address."] },

    { id:"page-titles", q:"How do you write a good page title?", k:["page title","title tag","seo title","browser tab title","meta title"],
      a:["Main topic first, under about 60 characters, and unique for every page.","It is the clickable line in search results, so it should be clear and tempting.","Each page gets its own title. Ten pages called Home is a classic mistake.","Specific beats clever. Say what the page is."],
      more:["The site name usually goes at the end, after the page topic.","Titles that get cut off lose their meaning, so key words go at the start."],
      ex:["For example, Wall Mounted Electric Heaters, then the site name, is clear and searchable."],
      why:["Because the title is the first thing people read in search results."] },

    { id:"meta-descriptions", q:"What is a meta description?", k:["meta description","meta descriptions","search snippet","description tag","snippet text"],
      a:["A short summary of the page that often shows under the title in search results.","Think of it as a tiny ad for the page. About 150 characters to convince someone to click.","It does not directly boost rankings, but a good one gets more clicks.","Unique, accurate and with a reason to click."],
      more:["If you leave it empty, search engines pick some text from the page, not always the best bit.","Duplicated descriptions across many pages waste the opportunity."],
      ex:["For example, Compare sizes, specs and features of our electric fireplaces, and find where to buy."],
      why:["Because a clear promise in search results earns the click."] },

    { id:"headings-structure", q:"Why do headings matter?", k:["headings","heading structure","h1","h2","subheadings","heading tags","page structure"],
      a:["They give a page structure, for readers, for screen readers and for search engines.","One h1 per page, then h2s for sections. Like chapters in a book.","Headings let people scan and jump to what they need.","Use them for structure, not for making text big. That is what CSS is for."],
      more:["Skipping levels, like going from h1 straight to h4, confuses screen reader users.","Descriptive headings also help search engines understand the topic of each section."],
      ex:["For example, a product page h1 is the product name, with h2s for Features, Specs and Downloads."],
      why:["Because structure is what turns a wall of text into something readable."] },

    { id:"urls-slugs", q:"What makes a good URL?", k:["url","urls","slug","slugs","clean urls","friendly urls","url structure"],
      a:["Short, lowercase, words separated by hyphens, and readable by a human.","A good URL tells you what the page is before you click it.","No random numbers or long codes. Clean slugs are easier to share and remember.","Pick it carefully once, because changing it later means setting up redirects."],
      more:["The slug is the last part of the URL, usually based on the page title.","For other languages, I translate the slug too, so the URL matches the page language."],
      ex:["For example, a slug like electric-fireplaces beats something like page?id=4821."],
      why:["Because URLs are part of the experience, and changing them has a cost."] },

    { id:"alt-text", q:"What is alt text?", k:["alt text","alt tag","alt attribute","image description","alternative text","alt texts"],
      a:["A short description of an image, read by screen readers and shown if the image fails to load.","It describes what the image shows, for people who cannot see it.","Alt text makes images accessible and helps search engines understand them too.","Describe the image in a sentence, skip the words image of, and keep it useful."],
      more:["Decorative images should have empty alt text, so screen readers skip them.","For product images, I mention the product and what the view shows, like front view or installed in a living room."],
      ex:["For example, Electric fireplace insert installed in a stone wall, front view."],
      why:["Because a blind visitor deserves to know what is in the picture too."] },

    { id:"internal-links", q:"Why do internal links matter?", k:["internal links","internal linking","linking pages","related products","cross links","link structure"],
      a:["They connect related pages, helping people and search engines discover more of the site.","A page with no links pointing to it is an orphan. Hard to find, easy to forget.","Good internal links guide visitors to the next useful step.","Descriptive link text helps: compare wall heaters beats click here."],
      more:["Related products and breadcrumbs are internal links that work quietly in the background.","When I remove a page, I check what links to it so nothing breaks."],
      ex:["For example, a product page linking to its accessories and to the category it belongs to."],
      why:["Because pages that link together get found together."] },

    { id:"sitemaps", q:"What is a sitemap?", k:["sitemap","sitemaps","xml sitemap","site map","site structure map"],
      a:["A list of the pages on a site, made so search engines can find them all.","There are two kinds: one for search engines, a file listing URLs, and one for planning, a diagram of the site.","It is a map so nothing gets missed during crawling.","The planning kind is one of my favorite tools before building anything new."],
      more:["Most CMS setups generate the search engine sitemap automatically.","A planning sitemap shows the hierarchy: home, sections, subpages. Great for spotting gaps."],
      ex:["For example, before a new site launch I sketch the full sitemap so everyone agrees on structure."],
      why:["Because a map makes both crawling and planning easier."] },

    { id:"redirects", q:"What is a redirect?", k:["redirect","redirects","301 redirect","url redirect","moved page","forwarding"],
      a:["It sends visitors from an old address to a new one automatically.","When a page moves, a redirect makes sure old links and bookmarks still work.","A 301 means moved permanently. It also passes along the old page's search value.","Redirects are the forwarding address of the web."],
      more:["Redirect chains, A to B to C, slow things down. I point straight to the final page.","Old domains often redirect to the main site so nothing is wasted."],
      ex:["For example, a discontinued product page can redirect to its replacement or its category."],
      why:["Because breaking old links throws away visitors and search value."] },

    { id:"404-pages", q:"What is a 404 page?", k:["404","404 page","page not found","error page","not found","missing page"],
      a:["It is what you see when a page does not exist. Usually a moved or deleted page.","A good 404 page helps: a search box, links to main sections, a friendly message.","404s happen. The goal is fewer of them, and a helpful one when they do.","I check for 404s regularly and fix the popular ones with redirects."],
      more:["Analytics and crawling tools show which missing pages people keep hitting.","A dead end with no links out is the worst version."],
      ex:["For example, a 404 page that says this page moved and offers links to Products and Support."],
      why:["Because a lost visitor should get a map, not a wall."] },

    { id:"broken-links", q:"How do you find broken links?", k:["broken links","dead links","link checker","broken link","link rot","fix links"],
      a:["I run a crawler that visits every page and reports links that return errors.","Regularly. Links break quietly when pages move or external sites change.","A crawl plus a spreadsheet, then I fix them in order of how visible they are.","Broken links are small, but many of them make a site feel neglected."],
      more:["External links break more often since we do not control those sites.","Broken links to documents are common when files are replaced with new names."],
      ex:["For example, a crawl finding an old manual link that now returns 404, fixed by pointing it to the new file."],
      why:["Because every broken link is a small moment of frustration."] },

    { id:"page-speed", q:"Why does page speed matter so much?", k:["page speed","site speed","fast website","slow website","load time","loading speed","performance"],
      a:["People leave slow pages. A few extra seconds can lose a lot of visitors.","Fast pages feel trustworthy. Slow ones feel broken even when they are not.","Speed helps search rankings too, but mostly it is about respect for people's time.","Fast and simple beats fancy and slow, every time."],
      more:["The usual suspects: huge images, too many scripts, heavy fonts and no caching.","Mobile on a weak connection is the real test, not my fast office connection."],
      ex:["For example, compressing hero images often cuts load time in half with no visible difference."],
      why:["Because nobody ever complained that a page loaded too fast."] },

    { id:"core-metrics", q:"How do you measure page speed?", k:["measure speed","speed test","performance score","web vitals","lighthouse score","speed audit"],
      a:["With speed testing tools and the browser's own developer tools. They show what loads and how long it takes.","I look at when the main content appears and when the page becomes usable, not just a single score.","Test on mobile with a slow connection setting. That is where problems show up.","A score is a hint, not the goal. The real goal is a page that feels fast."],
      more:["Common measures include how fast the biggest element appears and whether the layout jumps around while loading.","I test before and after a change, so I know if it actually helped."],
      ex:["For example, the waterfall view showing a 3 MB image blocking everything else."],
      why:["Because you cannot improve what you do not measure."] },

    { id:"caching", q:"What is caching?", k:["caching","cache","clear cache","browser cache","cached version","cdn"],
      a:["Saving a copy of something so it does not have to be built or downloaded again. Makes sites fast.","The browser, the server and networks in between all keep copies to save time.","Caching is great until you update something and still see the old version.","Have you tried clearing the cache is the web version of turning it off and on again."],
      more:["A content delivery network keeps copies of files on servers around the world, closer to visitors.","After big changes, I clear the site cache so everyone sees the new version."],
      ex:["For example, someone says the fix is not live, I clear the cache, and suddenly it is."],
      why:["Because rebuilding the same page thousands of times is wasteful."] },

    { id:"clear-cache-tip", q:"Why do I still see the old version of a page?", k:["old version","not updating","changes not showing","hard refresh","still old","not showing changes"],
      a:["Probably caching. Try a hard refresh or a private window.","Your browser or the site kept a saved copy. It will catch up, or I can clear it.","Nine times out of ten it is the cache. The tenth time it was never published.","Open it in a private window. If it is new there, it is your browser cache."],
      more:["Some caches expire after minutes, some after hours, depending on settings.","If a private window still shows the old version, the site cache needs clearing."],
      ex:["For example, a new banner live for me but not for a colleague until they hard refresh."],
      why:["Because caches are built to remember, sometimes too well."] },

    { id:"images-for-web", q:"How do you prepare images for the web?", k:["web images","image optimization","optimize images","resize images","image prep","image size"],
      a:["Resize to the size it will actually display, compress it, pick the right format, add alt text.","Never upload a 6000 pixel photo straight from the camera. Resize first.","Right size, right format, right compression. Three steps, huge difference.","I aim for images that look sharp but weigh as little as possible."],
      more:["I also export a slightly larger version for high density screens, but not huge.","Consistent dimensions across a product range make listings look neat."],
      ex:["For example, a 12 MB photo becoming a 150 KB image that looks identical on screen."],
      why:["Because images are usually the heaviest part of a page."] },

    { id:"image-formats", q:"Which image format should I use?", k:["image format","webp","jpg","jpeg","png","svg","file formats"],
      a:["Photos: JPG or WebP. Graphics with transparency: PNG. Logos and icons: SVG.","WebP is usually smallest for photos. SVG stays sharp at any size for simple graphics.","PNG for screenshots and transparency, but it gets heavy for photos.","Use the lightest format that still looks right."],
      more:["SVG is code, so it scales perfectly and can be tiny, but it is not for photos.","Many sites serve modern formats to browsers that support them, with a fallback for older ones."],
      ex:["For example, a product photo as WebP, the logo as SVG, a screenshot as PNG."],
      why:["Because the wrong format can make a file five times bigger for no reason."] },

    { id:"image-compression", q:"What is image compression?", k:["compression","compress images","image compression","file size","lossy","lossless"],
      a:["Making image files smaller by removing data you mostly cannot see.","Lossy compression drops a little quality for a big size win. Lossless keeps everything but saves less.","Good compression is invisible. You only notice it when the page loads fast.","I compress everything before upload. It is the cheapest speed win there is."],
      more:["Around 70 to 85 percent quality is often the sweet spot for photos.","Too much compression leaves blocky artifacts, so I always check visually."],
      ex:["For example, a hero banner going from 2 MB to 250 KB with the same look."],
      why:["Because every kilobyte has to travel to someone's phone."] },

    { id:"lazy-loading", q:"What is lazy loading?", k:["lazy loading","lazy load","load on scroll","deferred images","offscreen images"],
      a:["Images load only when you are about to scroll to them, not all at once.","It saves data and makes the top of the page appear faster.","Load what people see first, the rest can wait its turn.","It is a simple setting with a big effect on long pages."],
      more:["The main image at the top should not be lazy loaded, or it appears late.","Setting image dimensions avoids the page jumping as images arrive."],
      ex:["For example, a category page with 40 product images loads only the first rows immediately."],
      why:["Because nobody needs the footer image before the headline."] },

    { id:"accessibility-basics", q:"What is web accessibility?", k:["accessibility","accessible website","a11y","disabilities","inclusive design","wcag"],
      a:["Making sites usable by everyone, including people using screen readers, keyboards or zoom.","Good contrast, real headings, alt text, labels on forms, keyboard support. The basics cover a lot.","Accessibility is not a feature, it is part of doing the job properly.","It helps everyone: captions in a noisy room, big buttons on a phone, clear text in bright sun."],
      more:["There are published guidelines with clear levels, and many organizations aim for the middle one.","Automated checkers catch some issues, but testing with a keyboard and screen reader catches more."],
      ex:["For example, a form that can be completed using only the Tab and Enter keys."],
      why:["Because the web should work for everybody, not just most people."] },

    { id:"color-contrast", q:"Why is color contrast important?", k:["contrast","color contrast","colour contrast","text contrast","low contrast","readability"],
      a:["Low contrast text is hard to read for many people, and in sunlight for everyone.","Light gray on white might look elegant, but if people cannot read it, it fails.","There are contrast ratios you can check. I test before any color goes live.","Readable beats trendy."],
      more:["Text on photos is tricky. A dark overlay behind the text usually fixes it.","Color alone should not carry meaning, like red for errors with no text."],
      ex:["For example, a pale gray button label that passed the design review but failed the contrast check."],
      why:["Because a message nobody can read is not a message."] },

    { id:"keyboard-navigation", q:"What is keyboard navigation?", k:["keyboard navigation","tab key","keyboard only","focus outline","focus states","skip link"],
      a:["Being able to use a site with just the keyboard: Tab to move, Enter to click.","Some people cannot use a mouse. If a menu only works on hover, it locks them out.","Visible focus outlines show where you are. Removing them is a common mistake.","Try your site with only the Tab key. It is humbling."],
      more:["A skip to content link lets keyboard users jump past the menu.","The tab order should follow the visual order of the page."],
      ex:["For example, a dropdown menu that opens on Enter, not just on mouse hover."],
      why:["Because a keyboard is the main way some people browse."] },

    { id:"screen-readers", q:"How do screen readers work?", k:["screen reader","screen readers","blind users","assistive technology","read aloud","visually impaired"],
      a:["They read the page out loud and let people navigate by headings, links and landmarks.","They depend on clean code: real headings, alt text, labeled buttons.","A screen reader sees your structure, not your design.","Testing with one changes how you build pages. Everyone should try it once."],
      more:["Users often jump between headings or list all links, so descriptive text matters.","Buttons with only an icon need a label, or they are announced as just button."],
      ex:["For example, a search icon button labeled Search instead of nothing."],
      why:["Because the code is the interface for screen reader users."] },

    { id:"captions-video", q:"Why should videos have captions?", k:["captions","subtitles","video captions","closed captions","transcripts","video accessibility"],
      a:["Deaf and hard of hearing people need them, and lots of people watch without sound.","Captions make video usable in an open office, on a train, anywhere.","A transcript also helps search engines understand the video.","Auto captions are a start, but I always review them. They get product names wrong."],
      more:["Background videos with no speech do not need captions, but they need a pause button.","Captions should be synced and accurate, including key sounds."],
      ex:["For example, an installation video with captions so installers can follow it on a noisy job site."],
      why:["Because not everyone can or wants to listen."] },

    { id:"form-labels", q:"Why do forms need labels?", k:["form labels","labels","input labels","placeholder text","accessible forms","field labels"],
      a:["Labels tell people and screen readers what each field is for.","Placeholder text disappears when you type, so it cannot replace a label.","Visible labels above fields are the simplest, clearest pattern.","Clear labels mean fewer errors and fewer abandoned forms."],
      more:["Error messages should say what went wrong and how to fix it, next to the field.","Required fields should be marked clearly, not only with color."],
      ex:["For example, a label Email address above the field instead of only a gray placeholder inside it."],
      why:["Because a form is a conversation, and labels are the questions."] },

    { id:"forms", q:"What makes a good web form?", k:["web forms","contact form","form design","form fields","form submissions","signup form"],
      a:["As few fields as possible. Every extra field loses some people.","Clear labels, helpful errors, and a confirmation so people know it worked.","Test it for real. Submit it, check the email arrives, check spam folders too.","Short, clear and tested. A broken contact form is silent but costly."],
      more:["Spam protection matters, but it should not make humans solve puzzles every time.","I test forms after any change, because they break quietly."],
      ex:["For example, cutting a contact form from 12 fields to 5 and seeing more submissions."],
      why:["Because forms are where visitors actually reach out."] },

    { id:"mobile-responsive", q:"What is responsive design?", k:["responsive design","mobile friendly","responsive","mobile site","mobile version","phone layout"],
      a:["A site that adapts its layout to any screen, from a phone to a wide monitor.","One site, many shapes. The content reflows instead of shrinking.","Most visits come from phones now, so mobile is not the small version, it is the main one.","If it is not good on a phone, it is not good."],
      more:["Touch targets need to be big enough for thumbs, and text readable without zooming.","Tables and wide images are the usual troublemakers on small screens."],
      ex:["For example, a three column product grid becoming a single column on a phone."],
      why:["Because people browse from the couch on their phones, not at desks."] },

    { id:"mobile-testing", q:"How do you test on mobile?", k:["mobile testing","test on phone","device testing","responsive testing","test devices","emulator"],
      a:["Browser developer tools can simulate phone sizes, then I check on a real phone too.","Simulators are good for layout. Real phones are better for touch and speed.","I scroll the whole page on a phone before publishing anything big.","Two monitors for building, one phone for the truth."],
      more:["Different screen sizes and orientations reveal different problems.","Throttling the network in dev tools shows how it feels on a slow connection."],
      ex:["For example, catching a button hidden under a sticky banner only on small phones."],
      why:["Because the desktop preview lies about the mobile experience."] },

    { id:"html-basics", q:"What is HTML?", k:["html","html code","markup","hypertext","html tags","page markup"],
      a:["HTML is the skeleton of a page: headings, paragraphs, links, images.","It tells the browser what each piece of content is, not how it looks.","The structure layer. Get it right and accessibility and SEO get easier.","Simple to learn, surprisingly deep to master."],
      more:["Using the right element, like a real button instead of a clickable box, makes a big difference.","Even in a CMS, knowing a bit of HTML helps fix messy content."],
      ex:["For example, a heading marked as h2 instead of a bold paragraph."],
      why:["Because structure is the foundation everything else sits on."] },

    { id:"css-basics", q:"What is CSS?", k:["css","stylesheet","styles","css code","styling","cascading style sheets"],
      a:["CSS controls how a page looks: colors, fonts, spacing, layout.","HTML is what it is, CSS is how it looks.","One stylesheet can change the look of a whole site at once. Powerful and slightly dangerous.","It is where design becomes real on screen."],
      more:["Responsive layouts are built with CSS rules that change based on screen size.","Small CSS fixes are often the quickest wins in my day."],
      ex:["For example, changing the spacing between all product cards with one CSS rule."],
      why:["Because separating looks from content keeps both easier to manage."] },

    { id:"javascript-basics", q:"What is JavaScript?", k:["javascript","js","scripts","interactive","front end code","script errors"],
      a:["JavaScript makes pages interactive: menus, sliders, filters, forms that check themselves.","HTML is the skeleton, CSS the clothes, JavaScript the muscles.","Useful, but every script has a cost in speed. I keep them to what is needed.","When a page feels slow, too much JavaScript is often why."],
      more:["Third party scripts like trackers and widgets add up fast. I review them regularly.","If a script fails, some features break, so important content should not depend on it."],
      ex:["For example, a variant selector that swaps images and specs without reloading the page."],
      why:["Because interactivity is great, but not at any price."] },

    { id:"dev-tools", q:"What are browser developer tools?", k:["dev tools","developer tools","inspect element","devtools","browser console","network tab"],
      a:["A toolbox built into every browser. Right click, inspect, and you can see how any page is built.","I use them daily: check styles, see what loads slowly, find errors.","The network tab tells you exactly what is slowing a page down.","My favorite free tool. It turns guessing into knowing."],
      more:["You can edit CSS live to test a fix before changing the real site.","The console shows JavaScript errors that explain why something does not work."],
      ex:["For example, finding a 4 MB image in the network tab that explained a slow product page."],
      why:["Because seeing what the browser sees solves most mysteries."] },

    { id:"tools-used", q:"What tools do you use every day?", k:["tools","daily tools","software you use","work tools","toolkit","your setup"],
      a:["The CMS, the browser with dev tools, a code editor, spreadsheets and an image editor.","Two monitors, a laptop, headphones and a lot of browser tabs.","Spreadsheets are underrated. Half of web management is lists.","Simple tools used well beat fancy tools used badly."],
      more:["A task board keeps requests organized and visible to everyone.","Crawlers and speed testers handle the checking I cannot do by hand."],
      ex:["For example, a spreadsheet tracking every product page and what is missing on each."],
      why:["Because the right tool turns a day of work into an hour."] },

    { id:"spreadsheets", q:"Why do you use spreadsheets so much?", k:["spreadsheets","spreadsheet","excel sheet","tracking sheet","bulk edits","data lists"],
      a:["Because websites are full of lists: products, URLs, redirects, images. Spreadsheets love lists.","Bulk changes start in a spreadsheet. Plan it, check it, then apply it.","Filters and sorting find problems instantly, like 40 products missing an image.","A good spreadsheet is a to do list that does math."],
      more:["Redirect plans and content audits are almost always spreadsheets.","Many systems can import and export spreadsheets, which makes bulk updates possible."],
      ex:["For example, a sheet of 300 old URLs mapped to their new URLs before a site restructure."],
      why:["Because seeing everything at once is how you spot what is missing."] },

    { id:"code-editor", q:"Do you write code?", k:["write code","coding","code editor","programming","developer skills","custom code"],
      a:["Some. HTML and CSS daily, a bit of JavaScript, and small scripts to automate boring tasks.","Enough to fix things and talk clearly with developers. Bigger features go to them.","I write code when it saves time. A small script can replace hours of clicking.","A code editor is always open on one of my monitors."],
      more:["Knowing some code makes me a better middle person between design and development.","I keep small snippets I reuse often, like CSS for tables or embeds."],
      ex:["For example, a small CSS block that makes spec tables line up neatly."],
      why:["Because understanding the code makes every conversation about the site easier."] },

    { id:"analytics", q:"What do website analytics tell you?", k:["analytics","web analytics","traffic","visitors","page views","site stats"],
      a:["How many people visit, where they come from, which pages they read and where they leave.","Analytics turn opinions into facts. Very handy in meetings.","I look for patterns: pages with lots of traffic but quick exits usually need work.","They tell you what happened, and you still have to figure out why."],
      more:["Search terms used on the site are gold. They tell you what people expected to find.","Comparing before and after a change shows if it actually helped."],
      ex:["For example, a product page with high traffic but no clicks to where to buy might be hiding the button."],
      why:["Because guessing is expensive, data is cheap."] },

    { id:"bounce-engagement", q:"What does it mean when people leave a page quickly?", k:["bounce rate","quick exits","engagement","time on page","exit rate","leaving the page"],
      a:["Sometimes the page failed them. Sometimes they found the answer fast and left happy.","Context matters. A quick exit from a contact page with a phone number might be a win.","High exits on a key page are a signal to look closer, not a verdict.","I look at what they came for and whether the page answered it."],
      more:["Slow loading is a common reason for quick exits, especially on mobile.","Mismatched search results also cause it: the title promised something the page did not deliver."],
      ex:["For example, a slow category page where many visitors left before the products appeared."],
      why:["Because a number without context can lead to the wrong fix."] },

    { id:"multilingual-sites", q:"How do you manage a site in two languages?", k:["multilingual","two languages","bilingual site","english and french","language switcher","multiple languages"],
      a:["Each page has a version per language, and the language switcher connects them.","English and French side by side means double the content and double the checking.","Structure stays the same, words change. Including URLs and image text.","Never machine translate and publish blindly. A real review catches embarrassing mistakes."],
      more:["Specs and units need care too, and some terms differ by region.","Missing translations should be tracked, not discovered by visitors."],
      ex:["For example, a product page in English and French with matching sections and translated slugs."],
      why:["Because people trust a site that speaks their language properly."] },

    { id:"translations", q:"How do you handle translations?", k:["translations","translate","translating pages","french translation","localization","translated content"],
      a:["Translate the content, the URL slug, the alt text and the meta description. Not just the body text.","I keep a list of preferred terms so translations stay consistent.","Translators get context, not just a list of words. Context changes meaning.","Then a native speaker reviews it on the actual page, not in a spreadsheet."],
      more:["Text length changes between languages, so layouts need room to breathe.","Accents matter in titles. In URLs, I keep them simple without accents."],
      ex:["For example, a button label that fits in English but wraps onto two lines in French."],
      why:["Because a half translated page feels unfinished."] },

    { id:"staging-vs-live", q:"What is the difference between staging and live?", k:["staging","live site","production","test site","staging environment","dev environment"],
      a:["Staging is a private copy of the site for testing. Live is what the world sees.","Break things on staging so you do not break them live.","Big changes go to staging first, get tested, then move to live.","Staging is the rehearsal, live is the show."],
      more:["Staging should match live as closely as possible, or tests can lie.","Content edits usually happen live with drafts. Code and design changes go through staging."],
      ex:["For example, a new page template tested on staging for a week before launch."],
      why:["Because testing in front of everyone is a bad idea."] },

    { id:"testing-changes", q:"How do you test changes before going live?", k:["testing","test changes","qa","quality check","before publishing","test plan"],
      a:["Preview it, check it on desktop and phone, click every link and button, then publish.","I test the change and the things around it. Fixes have a habit of breaking neighbors.","A short checklist: layout, links, images, forms, speed, mobile.","I check like a visitor would, not like the person who built it."],
      more:["Different browsers and screen sizes catch different problems.","After publishing, I check it live again. Caches and settings can surprise you."],
      ex:["For example, after changing a product template, I check five different products, not just one."],
      why:["Because a two minute test is cheaper than a public mistake."] },

    { id:"backups", q:"Why are backups important?", k:["backups","backup","restore","site backup","disaster recovery","database backup"],
      a:["Because one day something will go wrong, and a backup turns a disaster into an inconvenience.","Automatic, regular and tested. A backup you never tested is a hope, not a backup.","Before any big change, I make sure a fresh backup exists.","Backups are boring until the day they are the most important thing in the building."],
      more:["Backups should be stored somewhere separate from the site itself.","Knowing how long a restore takes matters as much as having the backup."],
      ex:["For example, restoring a page section after a bulk import overwrote it."],
      why:["Because undo does not exist at the server level without them."] },

    { id:"security-basics", q:"How do you keep a website secure?", k:["security","website security","secure site","hacked","site security","vulnerabilities"],
      a:["Keep everything updated, use strong unique passwords, limit admin access and use HTTPS.","Most attacks hit old software and weak passwords. The basics stop a lot.","Fewer admins, fewer plugins, more updates.","Security is a habit, not a one time project."],
      more:["Two step login for admin accounts adds a big layer of protection.","Removing old accounts and unused add-ons closes doors nobody is watching."],
      ex:["For example, removing admin access from accounts that have not logged in for a year."],
      why:["Because fixing a hacked site is far harder than preventing it."] },

    { id:"software-updates", q:"Why do websites need updates?", k:["updates","software updates","security patches","updating the cms","patches","outdated software"],
      a:["Updates fix security holes and bugs. Skipping them leaves the door open.","Small regular updates are safer than giant ones once a year.","Test on staging, update, check live. Every time.","Old software is the most common way sites get into trouble."],
      more:["Some updates change behavior, so reading the notes before updating helps.","Security updates get priority. Feature updates can wait for a calm day."],
      ex:["For example, a security patch applied on staging first, tested, then rolled out live the same day."],
      why:["Because attackers read the same security notices we do."] },

    { id:"passwords", q:"What makes a strong password?", k:["passwords","strong password","password manager","login security","two factor","2fa"],
      a:["Long, unique for every account, and stored in a password manager.","A long phrase beats a short complex word. Length wins.","Never reuse passwords. One leak should not open every door.","Add two step verification wherever you can."],
      more:["Shared accounts are risky. Individual logins make it clear who did what.","When someone leaves a team, their access should leave too."],
      ex:["For example, four random words together are stronger and easier to remember than a short mix of symbols."],
      why:["Because passwords are the front door of every system."] },

    { id:"https", q:"What is HTTPS?", k:["https","ssl","tls","padlock","secure connection","ssl certificate"],
      a:["It encrypts the connection between the browser and the site, so data cannot be read in between.","The padlock in the address bar. Every site should have it, no exceptions.","HTTPS protects forms, logins and privacy. Browsers warn people away from sites without it.","It needs a certificate, which must be renewed. Expired certificates cause scary warnings."],
      more:["All old http addresses should redirect to the https version.","Mixed content, an https page loading http images, can break the padlock."],
      ex:["For example, a contact form on HTTPS keeps the visitor's details private in transit."],
      why:["Because trust starts with that little padlock."] },

    { id:"cookie-banners", q:"Why do websites have cookie banners?", k:["cookie banner","cookies","cookie consent","consent banner","tracking cookies","privacy banner"],
      a:["Many places require sites to ask before using cookies that track visitors.","Cookies are small files that remember things, like settings or visits. Some need permission.","A good banner is clear and gives real choices, not a maze.","Necessary cookies keep the site working. Tracking ones need consent."],
      more:["The banner should actually block tracking until people agree, not just look like it does.","It should be easy to change your choice later."],
      ex:["For example, analytics scripts only loading after a visitor accepts them."],
      why:["Because visitors deserve to know what is tracked."] },

    { id:"uptime", q:"What is uptime?", k:["uptime","downtime","site availability","monitoring","uptime monitor","outage"],
      a:["The percentage of time a site is up and working. You want it very close to 100.","Monitoring tools check the site every few minutes and alert us if it goes down.","Even 99 percent sounds great until you realize that is days of downtime a year.","Good uptime is invisible. Nobody notices until it is gone."],
      more:["Planned maintenance should happen at quiet times and be short.","Monitoring key pages and forms, not just the homepage, catches more problems."],
      ex:["For example, an alert at 7 am telling me a site is down before anyone else notices."],
      why:["Because a site that is down is a closed shop sign."] },

    { id:"site-down-panic", q:"What do you do when the site is down?", k:["site is down","website down","site down","outage panic","not loading","server error","emergency"],
      a:["Stay calm, confirm it is really down for everyone, then check what changed recently.","First question: is it down or is it just my connection. Then: what changed.","Panic slows you down. I check, communicate, and fix in that order.","Breathe, check, tell people we are on it, then find the cause."],
      more:["Most outages come from a recent change, an expired domain or certificate, or the server itself.","A quick status message to the team stops the flood of is the site down messages."],
      ex:["For example, a site down because a certificate expired, fixed in minutes once found."],
      why:["Because calm people fix things faster."] },

    { id:"working-with-designers", q:"How do you work with designers?", k:["designers","working with designers","design review","mockups","design handoff","ux design"],
      a:["Early and often. I bring the real content and constraints, they bring the ideas.","I ask designers to design with real product names and real text lengths, not perfect placeholders.","Good designs consider mobile, accessibility and the CMS from the start.","We meet in the middle: beautiful, but buildable and fast."],
      more:["I share what the CMS can and cannot do, so designs fit the system.","I review designs at actual size on a phone, not just on a big screen."],
      ex:["For example, a long product title breaking a beautiful card design, caught early with real data."],
      why:["Because a design that cannot be maintained will not stay beautiful for long."] },

    { id:"working-with-developers", q:"How do you work with developers or agencies?", k:["developers","agency","agencies","dev team","working with developers","outsourcing"],
      a:["Clear tickets, screenshots, and examples of what should happen versus what happens.","I describe the problem, not the solution. They are better at solutions.","Respect their time: one well written request beats ten vague messages.","Test their work promptly, give specific feedback, and say thanks."],
      more:["Steps to reproduce a bug save hours of back and forth.","I group small requests so they can be handled together."],
      ex:["For example, a ticket with the page URL, browser, a screenshot and the expected result."],
      why:["Because clear requests get fast, correct results."] },

    { id:"tickets-requests", q:"How do you write a good request or ticket?", k:["tickets","ticket","requests","bug report","writing a ticket","support request"],
      a:["What is wrong, where, how to see it, and what it should do instead.","A link, a screenshot and one clear sentence. That covers most tickets.","One issue per ticket. Bundling five problems means three get forgotten.","Write it so someone who has never seen the site can understand it."],
      more:["Adding a priority and a deadline, if there is one, helps planning.","Closing the loop matters: when it is fixed, confirm and close it."],
      ex:["For example, On the heater category page on mobile, the filter button overlaps the first product. It should sit above the grid."],
      why:["Because a vague ticket turns into a long conversation."] },

    { id:"prioritizing", q:"How do you prioritize requests?", k:["prioritize","prioritizing","priorities","urgent requests","what comes first","triage"],
      a:["Broken things first, then things with deadlines, then improvements, then nice to haves.","I ask: how many people does it affect, and what happens if we wait a week.","Not everything urgent is important. I sort by impact, not volume.","One list, ordered. Everyone can see where their request sits."],
      more:["Quick wins get batched so they move without blocking bigger work.","When two things are urgent, I make the trade off visible and let the business decide."],
      ex:["For example, a broken contact form beats a new banner request every time."],
      why:["Because doing the right thing first matters more than doing many things."] },

    { id:"deadlines", q:"How do you handle tight deadlines?", k:["deadlines","deadline","tight deadline","time pressure","rush","last minute"],
      a:["Cut scope, not quality. Launch the essential part well, add the rest after.","I say early if something will not fit. Bad news early is good news.","A clear checklist and fewer meetings. Then headphones on.","Deadlines are easier when everyone agrees what done means."],
      more:["I separate must have from nice to have on day one.","Last minute content is the usual risk, so I chase it early."],
      ex:["For example, launching a product page with core info on time and adding the video a week later."],
      why:["Because a smaller launch on time beats a perfect launch that never happens."] },

    { id:"launches", q:"What happens on a launch day?", k:["launch","launch day","going live","site launch","new page launch","release"],
      a:["A checklist, a backup, a calm publish, then a lot of clicking around to check everything.","Launch day should be boring. All the excitement belongs in testing.","Publish, check on desktop and phone, check forms, check redirects, check speed.","Then I watch analytics and errors for the first few hours."],
      more:["Big launches happen early in the week, never on a Friday afternoon.","Someone always finds a typo after launch. That is tradition."],
      ex:["For example, a new product line going live at 9 am with pages, images, manuals and menu links all ready."],
      why:["Because preparation makes launch day quiet."] },

    { id:"friday-deploys", q:"Why not publish big changes on Friday?", k:["friday","friday deploy","friday afternoon","weekend release","deploy timing"],
      a:["Because if it breaks, nobody wants to fix it on a Saturday.","Big changes go out early in the week when everyone is around to help.","Friday afternoon is for small safe edits and tidying up.","It is the oldest rule in the web book, and it exists for a reason."],
      more:["Typos and small text fixes are fine anytime.","Templates, code and big data imports wait for Monday or Tuesday."],
      ex:["For example, a template change scheduled for Tuesday morning instead of Friday at 4 pm."],
      why:["Because weekends are for rest, not emergency fixes."] },

    { id:"consistency", q:"Why do you care so much about consistency?", k:["consistency","consistent","style guide","content standards","uniform","same format"],
      a:["Consistent pages are easier to read, build and maintain.","When every product page follows the same pattern, visitors learn it once.","Inconsistency looks careless, even if each page is fine on its own.","Same word for the same thing, everywhere. Simple rule, big effect."],
      more:["A short style guide for titles, images and labels saves endless debates.","Consistency also makes bulk updates possible."],
      ex:["For example, all spec tables in the same order, so comparing two products is easy."],
      why:["Because consistency builds trust without anyone noticing it."] },

    { id:"fast-simple-opinion", q:"Is a fancy website better than a simple one?", k:["fancy website","simple website","minimal design","animations","flashy design","simple vs fancy"],
      a:["Fast and simple beats fancy almost every time.","Fancy animations are fun once. Waiting for them is annoying the tenth time.","Visitors come for information, not a show. Give them what they came for, quickly.","Simple is not boring. Simple is respectful."],
      more:["A few thoughtful details beat lots of effects.","Every fancy feature has a maintenance cost that lasts years."],
      ex:["For example, a clean product grid that loads instantly beats a slider that loads in four seconds."],
      why:["Because people judge a site by how easily they get what they need."] },

    { id:"writing-for-web", q:"How should you write for the web?", k:["writing for the web","web writing","web copy","copywriting","plain language","content writing"],
      a:["Short sentences, clear headings, the most important thing first.","Write for people, not for search engines. Search engines prefer that too.","Plain language. If a ten year old would be confused, rewrite it.","Cut it in half, then cut it again."],
      more:["Bullets for lists, short paragraphs for ideas, and links with descriptive text.","Avoid internal jargon. Customers do not speak the company's language."],
      ex:["For example, Find a dealer near you instead of Utilize our dealer locator functionality."],
      why:["Because people scan, and scanning needs clear signposts."] },

    { id:"clean-pages", q:"What do you mean by a clean page?", k:["clean page","clean design","clutter","white space","tidy layout","decluttering"],
      a:["Clear hierarchy, enough white space, one main action, nothing extra.","A clean page lets the content breathe. Clutter makes everything shout.","If I remove something and nobody misses it, it should not have been there.","Clean is calm. And calm pages convert better."],
      more:["White space is not wasted space. It guides the eye.","Old banners and outdated promos are the main source of clutter."],
      ex:["For example, removing three competing banners so the product finally stands out."],
      why:["Because attention is limited, so every element should earn its spot."] },

    { id:"content-audit", q:"What is a content audit?", k:["content audit","audit","site audit","outdated content","content review","page inventory"],
      a:["Listing every page and deciding: keep, update, merge or remove.","A spring clean for the website. Old pages pile up faster than you think.","I export all pages into a spreadsheet and review them one by one.","It always finds surprises, like a page from years ago still getting traffic."],
      more:["Analytics help decide: low traffic and outdated usually means remove and redirect.","Doing it in small batches is more realistic than one giant audit."],
      ex:["For example, merging three thin pages about the same topic into one strong page."],
      why:["Because less, better content beats more, stale content."] },

    { id:"landing-pages", q:"What makes a good landing page?", k:["landing page","landing pages","campaign page","promo page","marketing page"],
      a:["One goal, one clear message, one obvious next step.","It matches what brought the person there, like the ad or email they clicked.","Short, focused and fast. No distractions from the main action.","A headline, a benefit, proof, and a button. That is the core."],
      more:["Campaign pages should have an end plan: redirect or update when the campaign ends.","Testing two versions of a headline can teach a lot."],
      ex:["For example, a seasonal page highlighting three products with a clear Find a Retailer button."],
      why:["Because focus turns visitors into action."] },

    { id:"homepage", q:"What should be on a homepage?", k:["homepage","home page","front page","main page","homepage banner"],
      a:["Who you are, what you offer, and clear paths to the main sections.","The homepage is a doorway, not a warehouse. Point people where they need to go.","One strong main message, then quick routes to products and support.","Everyone wants space on the homepage. That is why it needs an owner."],
      more:["Rotating sliders are popular with teams and ignored by visitors. One strong banner works better.","Search and navigation matter as much as the hero image."],
      ex:["For example, a hero with the main product line, then links to categories, support and where to buy."],
      why:["Because many visitors decide in seconds whether they are in the right place."] },

    { id:"fun-fact-first-website", q:"Tell me a fun fact about the web", k:["fun fact","fun facts","web trivia","web history","did you know","interesting fact"],
      a:["The very first website is still online, and it is mostly plain text and links. Still loads fast, too.","The web and the internet are not the same thing. The internet is the roads, the web is one kind of traffic.","Hyperlinks were the big idea. Clicking from page to page felt like magic at first.","The first web pages had no images at all. Imagine an image-free product page today."],
      more:["Early sites were built by hand, page by page, before content management systems existed.","Some old animated under construction graphics are now considered web art."],
      ex:["For example, the first web page explained what the web was, on the web itself. Very meta."],
      why:["Because a bit of history makes you appreciate how far things have come."] },

    { id:"fun-fact-404", q:"Where does the number 404 come from?", k:["404 origin","why 404","error codes","status codes","http status","error numbers"],
      a:["It is a status code. 4xx codes mean something went wrong on the request side, 404 means not found.","Every page load returns a code. 200 means fine, 301 means moved, 404 means not here, 500 means the server is unhappy.","There is a popular myth about a room 404, but it is really just part of a numbering system.","I speak fluent status code. 200 is my favorite number."],
      more:["500 errors are on the server side, so those are the scarier ones for me.","There is even a joke code, 418, that says the server is a teapot."],
      ex:["For example, checking a list of URLs and seeing which return 200, 301 or 404."],
      why:["Because the codes tell you exactly what kind of problem you have."] },

    { id:"beginner-tips", q:"Any tips for someone starting in web?", k:["beginner tips","getting started","beginners","new to web","starting out","first steps","career start"],
      a:["Learn HTML and CSS basics, build a tiny site, and learn how to use browser dev tools.","Be curious. Right click, inspect, and see how your favorite sites are built.","Learn the basics of SEO and accessibility early. They make you more valuable instantly.","Document what you do. Future you will forget why you did it."],
      more:["Small projects teach more than long courses. Build, break, fix.","Learn to write clearly too. Half the job is explaining things to people."],
      ex:["For example, build a one page site about a hobby and make it fast and accessible."],
      why:["Because fundamentals never go out of date."] },

    { id:"learn-web", q:"How can I learn web stuff?", k:["learn web","learning","how to learn","courses","tutorials","self taught","resources"],
      a:["Start with HTML and CSS through free tutorials, then build something real.","Pick a small project and learn what you need along the way.","Read the official documentation for browsers and web standards. It is free and very good.","Copy nothing blindly. Understand each line, then it sticks."],
      more:["Inspecting real sites with dev tools is like a free masterclass.","Join a community and ask questions. Everybody was a beginner once."],
      ex:["For example, recreate a simple page you like, from scratch, just to learn how it works."],
      why:["Because doing beats watching."] },

    { id:"skills-needed", q:"What skills does a web manager need?", k:["skills","skills needed","web skills","qualifications","what to learn","skill set"],
      a:["A mix: some technical knowledge, good writing, organization and patience.","Enough code to understand problems, enough design sense to spot bad layouts, enough calm for launch days.","Communication is underrated. You talk to designers, developers, marketing and product teams.","Attention to detail. One wrong number can show up on a hundred pages."],
      more:["Prioritization is a skill too. Saying not yet, politely and with reasons.","Comfort with data and spreadsheets helps a lot with catalogs."],
      ex:["For example, spotting that a spec says 5000 watts instead of 500 before it goes live."],
      why:["Because the job sits between many teams and needs a bit of all their skills."] },

    { id:"two-monitors", q:"Why do you have two monitors and a laptop?", k:["two monitors","dual monitors","monitors","screen setup","desk setup","laptop","workstation"],
      a:["One screen for the CMS, one for the live site, and the laptop for chat and notes.","Editing on one side and previewing on the other saves so much clicking.","More screens, fewer tabs to juggle. Well, slightly fewer tabs.","The setup lets me compare old and new versions side by side."],
      more:["A vertical layout on one screen is great for long pages and code.","The laptop keeps messages out of my main view, so they do not pull me away."],
      ex:["For example, a spreadsheet of products on one monitor, the CMS on the other, updating them one by one."],
      why:["Because web work is mostly comparing things."] },

    { id:"browser-tabs", q:"How many browser tabs do you have open?", k:["browser tabs","too many tabs","tabs open","open tabs","tab count"],
      a:["Honestly? More than I would admit in a meeting.","Enough that the icons became tiny dots. I know them by position.","It is a system. A chaotic one, but a system.","Fewer since I started using bookmarks folders. Still a lot."],
      more:["I close everything at the end of the week. It feels like cleaning a desk.","Grouping tabs by task helps keep the chaos organized."],
      ex:["For example, the live site, staging, the CMS, analytics, a spreadsheet and fourteen product pages."],
      why:["Because web work means checking many places at once."] },

    { id:"dry-humour", q:"Do you have any web jokes?", k:["joke","jokes","web joke","funny","make me laugh","humor","humour"],
      a:["I would tell you a joke about caching, but you would probably see an old version of it.","My favorite page is the one that loads in under a second. Rare, like a unicorn.","There are two kinds of people: those who back up their site and those who will.","I tried to write a CSS joke, but it would not center."],
