    { id:"refunds-returns", q:"How do you handle refunds and returns?", k:["refund","refunds","returns","return policy","money back","return an item","exchange"], a:["I check eligibility first, explain the steps clearly and give a realistic timeline for the money to come back.","Returns are easier when people know exactly what to expect: how to send it, how long it takes, when they'll hear from us.","If a refund isn't possible, I look for another way to make it right, like a repair or exchange."], more:["I always give a reference number and send the steps by email so nothing gets lost.","Timelines are where people get anxious, so I'm clear about how long banks and processing usually take."], ex:["For example: Your return is approved. Once the item arrives, the refund is processed within a few business days."], why:["Because a clear return process turns an unhappy buyer into someone who trusts you again."] },
    { id:"complaints", q:"How do you handle complaints?", k:["complaint","complaints","formal complaint","file a complaint","grievance","unhappy customer","complain"], a:["I take every complaint seriously, log it properly and make sure it reaches the people who can change things.","A complaint is free feedback. It shows exactly where we're letting people down.","I listen, thank them for telling us, fix what I can and explain what happens with the rest."], more:["Patterns in complaints get shared in team meetings. That's how real improvements happen.","I always give a reference and a timeline so the person knows it didn't vanish."], ex:["For example, several complaints about confusing delivery emails led to the wording being rewritten."], why:["Because people who complain are giving us a chance to keep them."] },
    { id:"compliments", q:"Do you get compliments?", k:["compliments","compliment","thank you calls","praise","positive feedback","kind words","nice customers"], a:["Yes, and they make my day. A sincere thank you after a tough call is the best feeling.","I save the nicest ones in a little folder. On a hard day, I read a few.","I always pass compliments along when they're about a teammate or another department."], more:["Compliments get logged too. They help show what's working, not just what's broken.","Some callers ask to speak to my supervisor just to say something nice. That's the best plot twist."], ex:["For example, a caller once said I was the most patient person they'd talked to all week. I smiled for an hour."], why:["Because positive feedback tells us what to keep doing."] },
    { id:"tone-of-voice", q:"How important is tone of voice?", k:["tone of voice","tone","voice tone","sound friendly","warm voice","pitch","intonation"], a:["Huge. On the phone, tone carries most of the meaning. The same words can sound kind or cold.","A warm, steady tone makes people trust you before you've solved anything.","I vary my tone so I don't sound flat. Monotone makes even good news sound boring."], more:["I match my energy to the caller. Upbeat with happy callers, calm and slower with stressed ones.","Recording myself helped me hear habits I didn't notice, like ending every sentence with a question tone."], ex:["For example, 'I can help with that' sounds very different with a smile than with a sigh."], why:["Because people can't see your face, so your voice has to do the work."] },
    { id:"smiling-on-phone", q:"Does smiling on the phone really help?", k:["smile on the phone","smiling","smile","hear a smile","smile voice","smiling while talking","mirror on desk"], a:["Absolutely. People can hear a smile. It changes the shape of your mouth and your voice gets warmer.","I keep a tiny mirror on my desk. If I catch myself frowning, I reset.","It sounds silly, but try it: say hello with and without a smile. You'll hear it."], more:["Smiling also helps me. It's hard to stay grumpy while smiling.","On tough calls I don't fake a big grin, just a soft one to keep my tone kind."], ex:["For example, I smile right before I click to answer every call. Habit now."], why:["Because a warm voice makes callers relax faster."] },
    { id:"headset-tips", q:"Any headset tips?", k:["headset","headset tips","headphones","microphone","mic position","earpiece","noise cancelling"], a:["Keep the mic about two fingers from the corner of your mouth, not right in front. That stops breathing noises.","Adjust it so it's comfy for eight hours. A tight headset is a headache by lunchtime.","Switch ears if you use a single earpiece. Your ears will thank you."], more:["I clean the ear cushions regularly and keep a spare cushion in my drawer.","Noise cancelling helps a lot in a busy room. Callers shouldn't hear the whole office."], ex:["For example, moving my mic a little to the side fixed a caller complaint that I sounded like I was in a wind tunnel."], why:["Because your headset is your main tool, and comfort keeps you focused."] },
    { id:"voice-care", q:"How do you take care of your voice?", k:["voice care","protect your voice","sore throat","drink water","hydration","losing voice","vocal care"], a:["Water, water, water. I keep a bottle on my desk and sip between calls.","I don't shout or strain. The headset does the work, so I can speak at a normal volume.","Short pauses help. I let the caller talk and give my voice small rests through the day."], more:["Warm drinks are my friend in winter. Very cold drinks right before a long call feel harsh.","I also hum quietly before my shift to warm up, like a singer but much less impressive."], ex:["For example, on a heavy day I take a few sips of water after every call. It keeps my voice clear until the end of shift."], why:["Because my voice is my main tool, so it needs maintenance like any other."] },
    { id:"breaks", q:"Do you take breaks between calls?", k:["breaks","break between calls","short break","take a break","pause","rest between calls","coffee break"], a:["Yes, short ones. Even thirty seconds after a hard call helps me reset before the next person.","I use my scheduled breaks fully: away from the desk, headset off, a little walk.","Breaks aren't laziness, they keep my patience topped up."], more:["I use the not-ready status responsibly. If I need a moment after a tough call, I take it, then jump back in.","Stepping away from the screen is the best part. My eyes and ears need it."], ex:["For example, after a long technical call, I stand, stretch and refill my water before going ready again."], why:["Because the next caller deserves a fresh version of me."] },
    { id:"stretching", q:"Do you stretch at your desk?", k:["stretching","stretch","desk stretches","posture","stiff neck","sitting all day","ergonomics"], a:["Yes, little ones between calls: neck rolls, shoulder shrugs, wrist circles.","Sitting with a headset all day makes you stiff, so I stand up whenever the call allows.","Good posture and a chair at the right height make a big difference by the end of the shift."], more:["I set my monitor at eye level so I'm not looking down all day.","Some calls I take standing, which also makes my voice sound more energetic."], ex:["For example, every hour I do a quick shoulder roll and look away from the screen for twenty seconds."], why:["Because a comfortable body makes a calmer voice."] },
    { id:"burnout-prevention", q:"How do you avoid burnout?", k:["burnout","burn out","burnt out","avoid burnout","work wellness","exhausted","stress at work"], a:["I take my breaks, celebrate small wins and leave the tough calls at the desk when the shift ends.","Variety helps. Mixing phones with emails or ticket work gives my brain a change of pace.","Talking with the team helps a lot. Knowing everyone has rough calls makes them lighter."], more:["I set small goals for the day, like a perfect hold etiquette streak. It keeps the job fun.","When I notice I'm getting short with callers, I take that as a sign to pause."], ex:["For example, after a heavy morning, I'll ask to spend an hour on email tickets to give my voice and mood a rest."], why:["Because a patient agent is a rested agent."] },
    { id:"team-huddles", q:"What happens in team huddles?", k:["team huddle","huddles","team meeting","morning meeting","daily standup","stand-up","briefing"], a:["Quick morning chats: what's changed, what issues are trending and any updates we need to know.","Huddles are short, ten minutes at most. Info, a shout-out or two and back to the phones.","We share tricky calls and how we solved them. It's the best training there is."], more:["If a new problem is appearing, the huddle is where we agree on one answer for everyone.","We also celebrate wins. A great survey comment gets read out, which is lovely."], ex:["For example, a huddle might say: there's a delivery delay in one area today, here's what to tell callers."], why:["Because everyone giving the same answer builds trust."] },
    { id:"peak-hours", q:"When are your peak hours?", k:["peak hours","busy hours","rush hour","peak time","high volume","call spikes","busiest hours"], a:["Usually mid-morning and right after lunch. People call once they've settled into their own day.","The first hour after opening is always a wave, everyone who waited overnight calls at once.","Peaks also follow events: a new product, a billing run or bad weather can light up the queue."], more:["During peaks we keep wrap-up tight and save non-urgent work for quiet hours.","Planning breaks around peaks is an art. Nobody wants to be at lunch when the wave hits."], ex:["For example, the day after a billing cycle, the queue fills with invoice questions before 10 a.m."], why:["Because knowing the rush helps us staff for it."] },
    { id:"mondays", q:"Are Mondays really the busiest?", k:["monday","mondays","monday rush","start of the week","weekend backlog","monday morning","manic monday"], a:["Oh yes. Everything that broke over the weekend calls on Monday morning.","Monday is the main event. I bring extra water, extra patience and my best hold music apology.","Mondays are busy but kind of fun. The day flies by."], more:["We plan for it: fewer meetings, more people on phones and no long side projects.","By Wednesday things calm down, and by Friday it's usually smooth."], ex:["For example, a Monday queue at opening can be three times a normal Wednesday."], why:["Because people save problems up over the weekend."] },
    { id:"busiest-times-of-year", q:"What are the busiest times of year?", k:["busiest time of year","seasonal peaks","holiday season","busy season","seasonal volume","high season","quiet season"], a:["Seasonal changes and holidays. When the weather turns or after big shopping periods, calls jump.","Right after the holidays is a classic: setup questions, returns and gift confusion.","Every business has its own season, and you learn to feel it coming."], more:["Before peak season we refresh articles and do extra training so we're ready.","Quiet seasons are perfect for cleaning up old tickets and improving templates."], ex:["For example, the first cold week of the year can double calls about anything heating related."], why:["Because customer needs follow the calendar."] },
    { id:"typical-day", q:"What's a typical day like?", k:["typical day","daily routine","day in the life","normal day","average day","workday","schedule"], a:["Huddle, log in, calls, calls, calls, a few emails, follow-ups, wrap-up and a final check of my ticket board.","Mostly phones, with ticket updates and callbacks in between. No two calls are the same, so it never feels repetitive.","I start calm, ride the morning peak, catch up after lunch and close my open loops before the end of shift."], more:["I usually handle dozens of contacts in a day, from quick questions to long troubleshooting sessions.","The afternoon is often when I make callbacks and finish follow-up emails."], ex:["For example: 9 a.m. huddle, 9:15 first call, 11:30 break, afternoon callbacks, 4:45 board check."], why:["Because a steady rhythm keeps a busy day under control."] },
    { id:"start-of-shift", q:"What's your start of shift routine?", k:["start of shift","shift start","morning routine","before the shift","logging in","getting ready","first thing"], a:["Headset check, systems open, water filled, read any updates and glance at my ticket board.","I log into everything before my shift time, so I'm ready the moment I go live.","Five minutes of setup saves an hour of chaos. I check yesterday's follow-ups first."], more:["I test my headset with a quick sound check. Discovering a dead mic on a live call is not fun.","I read new knowledge base updates every morning. Things change fast."], ex:["For example, if there's a known issue today, I open the matching article so it's ready for the first call."], why:["Because the first call deserves the same quality as the tenth."] },
    { id:"end-of-shift", q:"What do you do at the end of your shift?", k:["end of shift","shift end","finishing work","log off","close out","end of day","handover"], a:["I finish notes, update every ticket I touched, set callbacks and leave a clean board for tomorrow.","I write a short handover for anything that might come up while I'm away.","Last step: headset off, deep breath, and the day stays at the desk."], more:["If a call runs past my shift, I finish it properly. No one gets rushed because I'm leaving.","I check that every promise I made today has a note and a date."], ex:["For example: 'Customer expecting delivery update tomorrow, tracking checked, nothing new yet.'"], why:["Because tomorrow's me will thank today's me."] },
    { id:"favorite-part", q:"What's your favorite part of the job?", k:["favorite part","favourite part","best part","love about","enjoy most","favorite thing","what you love"], a:["Turning a frustrated caller into a relieved one. That change in their voice is the best feeling.","The moment someone says 'oh, that was easy, thank you'. Never gets old.","Solving puzzles. Every call is a little mystery and I love cracking it."], more:["I also love the team. Sharing wins and laughs between calls makes the day fly.","Teaching someone how to do it themselves feels great too. They leave more confident."], ex:["For example, a caller who started the call worried ended it laughing and saying they'd tell their friends we were great."], why:["Because helping people is the whole point, and the phone lets me hear it happen."] },
    { id:"hardest-part", q:"What's the hardest part of the job?", k:["hardest part","most difficult","challenge","challenges","toughest part","worst part","difficult part"], a:["When I can't give people what they want. Delivering a no kindly is hard every time.","Back to back difficult calls with no breathing room. That takes real energy.","Problems that aren't in my control, like delays from somewhere else. I want to fix them and can't."], more:["What helps is focusing on what I can do: clear info, honest timelines and kind words.","The team helps too. A quick 'you handled that well' from a colleague goes a long way."], ex:["For example, telling someone a part is out of stock for weeks. I can't change it, but I can keep them updated so they're not left wondering."], why:["Because I genuinely want everyone to hang up happy."] },
    { id:"funniest-calls", q:"What's the funniest kind of call?", k:["funniest call","funny call","funny calls","weird calls","strange calls","best story","silly moments"], a:["Pets joining the call. A barking dog agreeing with everything the caller says is my favourite background music.","When the fix is so simple we both start laughing. The caller usually says 'please don't tell anyone'.","Callers who narrate every step like a sports commentator. Honestly, it makes the troubleshooting fun."], more:["I never laugh at people, only with them. The best moments are when we both see the funny side.","Kids saying hello in the background are lovely. I always say hello back."], ex:["For example, someone spent five minutes looking for a button, then shouted 'found it, it was the big one!' We laughed together."], why:["Because humour makes a frustrating moment human."] },
    { id:"beginner-tips", q:"Any tips for beginners?", k:["beginner tips","tips for beginners","new agent","just starting","first job","newbie","starting out"], a:["Listen more than you talk, take notes on everything and never be afraid to ask a teammate.","Learn the knowledge base before memorising scripts. Knowing where to find answers is the real skill.","Be kind to yourself. Everyone fumbles their first calls, and everyone gets better."], more:["Shadow experienced agents. You'll learn phrases and tricks you won't find in any training.","Pick one skill to improve each week, like hold etiquette or closings. Small steps add up."], ex:["For example, my first week I kept a notepad of phrases I liked from teammates. I still use half of them."], why:["Because the basics, done well, are what make a great agent."] },
    { id:"skills-needed", q:"What skills do you need for customer service?", k:["skills needed","skills","customer service skills","qualities","soft skills","what it takes","requirements"], a:["Patience, listening, clear communication and problem solving. Typing fast helps too.","Empathy and calm are the core. The technical stuff you can learn.","You need curiosity. Wanting to understand the real problem makes you good at solving it."], more:["Organisation matters a lot: tracking promises, callbacks and tickets without dropping any.","Flexibility too. Every caller is different, and the plan changes call by call."], ex:["For example, a calm agent with average product knowledge often beats an expert who's impatient."], why:["Because people remember how you made them feel more than what you knew."] },
    { id:"typing-speed", q:"How fast do you type?", k:["typing speed","typing","type fast","words per minute","wpm","keyboard skills","touch typing"], a:["Fast enough to take notes while someone talks without looking at the keyboard. That's the real goal.","Typing while listening is a superpower in this job. Practice pays off.","Speed is nice, accuracy is better. A typo in an account number causes a lot of trouble."], more:["Shortcuts and note templates save more time than typing faster.","I use abbreviations in my rough notes, then clean them up during wrap-up."], ex:["For example, I type the caller's issue as they describe it, so my summary is ready when they finish."], why:["Because good notes during the call mean shorter wrap-up after it."] },
    { id:"multitasking", q:"How do you multitask?", k:["multitasking","multitask","many tasks","juggling","several screens","doing two things","focus"], a:["Listening, typing and searching at the same time becomes natural with practice. The trick is never losing focus on the caller.","I multitask with tools, not with attention. The person on the phone always gets my full ear.","I keep my screens organised: CRM on one side, knowledge base on the other."], more:["When it gets too much, I tell the caller 'give me a moment to check that' and do one thing at a time.","Chat is where multitasking really matters, since you can handle more than one conversation."], ex:["For example, while someone explains the issue, I'm already pulling up their account and the right article."], why:["Because the caller shouldn't wait while I search."] },
    { id:"positive-language", q:"What is positive language?", k:["positive language","positive phrases","positive words","say it positively","reframe","positive wording","upbeat phrases"], a:["It's focusing on what you can do. Instead of 'I can't do that until Monday', I say 'I can get that done for you on Monday'.","Same facts, kinder framing. It makes a huge difference to how people feel.","Positive language turns a dead end into a next step."], more:["I swap 'problem' for 'situation' sometimes and 'you have to' for 'the next step is'.","It's not about being fake cheerful. It's about being helpful in how you phrase things."], ex:["For example, 'That item is out of stock' becomes 'That item will be back soon, I can let you know when it arrives'."], why:["Because people hear the first words most clearly."] },
    { id:"phrases-to-avoid", q:"What phrases should you avoid?", k:["phrases to avoid","bad phrases","what not to say","avoid saying","dont say","forbidden phrases","words to avoid"], a:["'Calm down' is number one. It never calms anyone down.","'That's not my department' and 'there's nothing I can do'. Even if true, they sound like giving up.","'You should have', 'as I said before' and 'to be honest'. They sound blaming or suspicious."], more:["Instead of 'I don't know', I say 'let me find out for you'. Same truth, much better feeling.","I also avoid jargon and internal codes. Customers don't speak our language."], ex:["For example, instead of 'You'll have to call back', I say 'I'll call you back as soon as I have it'."], why:["Because a single wrong phrase can undo a whole good call."] },
    { id:"closing-a-call", q:"How do you close a call?", k:["closing a call","end the call","ending a call","wrap up the call","goodbye","sign off","call closing"], a:["Summarise what we did, confirm next steps, ask if there's anything else and thank them.","I make sure they're clear before we hang up. A confused goodbye means another call.","Warm and simple: thanks for calling, have a lovely rest of your day."], more:["I let the caller hang up first. It feels more polite and avoids cutting them off.","If I promised something, I repeat it in the close: you'll get an email within the hour."], ex:["For example: So the replacement ships today and you'll get tracking by email. Anything else I can help with? Great, thanks for calling!"], why:["Because the last impression is the one people remember."] },
    { id:"mute-etiquette", q:"What's the mute button etiquette?", k:["mute button","mute","muting","mute etiquette","on mute","unmute","silent mode"], a:["Mute is for coughs and sneezes, not for side conversations. If I need longer, I use hold properly.","I always say 'one moment' before muting. Otherwise it's just unexplained silence.","Rule number one: always assume you're not muted. It keeps you professional."], more:["Long mute silences make callers think the line dropped. For more than a few seconds, I use hold.","I double check the mute light before I say anything I wouldn't want them to hear, which is basically nothing anyway."], ex:["For example: 'Excuse me one second' then mute, cough, unmute, 'sorry about that, where were we?'"], why:["Because trust breaks instantly if a caller hears something they shouldn't."] },
    { id:"wrap-up-codes", q:"What are call wrap-up codes?", k:["wrap-up code","wrap up codes","disposition","disposition codes","call codes","after call work","acw"], a:["After each call I pick a code for what it was about and how it ended. That feeds the reports.","Wrap-up time is when I finish notes, choose the code and set any follow-ups.","Accurate codes help the business see why people call, so I take them seriously."], more:["I try to keep wrap-up short but complete. Rushed codes make bad data.","When a call covers two topics, I code the main one and mention the second in the notes."], ex:["For example, a call about a late delivery that ended with a reshipment gets the delivery code and 'resolved'."], why:["Because good data leads to fewer problems, and fewer problems means fewer calls."] },
    { id:"metrics", q:"What metrics do you track?", k:["metrics","kpis","kpi","performance numbers","stats","statistics","targets"], a:["Handle time, first call resolution, satisfaction, quality scores and how many contacts we answer on time.","The main ones are speed, quality and happiness. All three need balance.","I watch my own numbers to improve, but I never chase one at the cost of the caller."], more:["Numbers tell you what, recordings and comments tell you why. You need both.","My favourite combo is high first call resolution with good satisfaction. That means it's working."], ex:["For example, if my handle time drops but repeat calls rise, I know I'm rushing."], why:["Because what gets measured gets improved, as long as you measure the right thing."] },
    { id:"call-centre-facts", q:"Got any fun facts about call centres?", k:["fun facts","fun fact","call centre facts","call center facts","trivia","did you know","interesting facts"], a:["Fun fact: people can hear a smile in your voice. It's real, and it's my secret weapon.","Most callers decide how they feel about the call within the first few seconds.","The most common fix in tech support is still turning it off and on again. Classic for a reason."], more:["Another one: callers usually overestimate how long they were on hold. That's why checking in matters.","Many call centres follow the sun, passing calls between time zones so someone is always awake."], ex:["For example, a two minute hold with no check-in can feel like five."], why:["Because knowing how people perceive calls makes you better at them."] },
    { id:"desk-phone", q:"Why do you have a desk phone?", k:["desk phone","telephone","phone on desk","landline","phone setup","softphone","dial pad"], a:["It's my backup and my old friend. Most calls come through the computer, but the desk phone is there if anything fails.","Some features are just easier on it, like quick transfers and the big hold button.","It also makes my desk look properly call centre. Very official."], more:["Softphones on the computer are common now, but a physical button is satisfying.","I keep important extensions on speed dial for fast transfers."], ex:["For example, when the computer phone app froze once, I switched to the desk phone and the caller never noticed."], why:["Because a backup line means no caller gets dropped."] },
    { id:"monitor-setup", q:"What's on your monitor?", k:["monitor","screen","two screens","dual monitor","desktop setup","computer screen","screen layout"], a:["The CRM with the caller's account, my notes and the knowledge base. Everything within one glance.","Phone controls at the top, customer info in the middle, help articles on the side.","A tidy screen means a calm mind. I close anything I don't need."], more:["Two monitors make a big difference. One for the customer, one for answers.","I keep the queue counter visible so I always know how busy things are."], ex:["For example, as the call connects, my screen fills with the caller's history and I'm ready to go."], why:["Because the fewer clicks, the faster the help."] },
    { id:"call-flow", q:"What does a good call look like?", k:["call flow","good call","perfect call","call structure","call steps","ideal call","call stages"], a:["Greet, verify, listen, solve, confirm, close. Simple structure, warm delivery.","The caller explains once, I understand fully, it's solved and they leave happy. That's the dream.","A good call has a clear start, middle and end. The caller always knows where we are."], more:["I signpost along the way: first I'll check your account, then we'll look at the fix.","The confirm step is the one people skip. Always check it actually worked."], ex:["For example: greeting, quick verification, three questions, a two-step fix, a test, a summary and goodbye in eight minutes."], why:["Because structure keeps calls efficient and callers relaxed."] },
    { id:"asking-questions", q:"How do you ask good questions?", k:["asking questions","good questions","open questions","closed questions","probing questions","clarifying questions","questioning"], a:["I start with open questions to get the story, then closed questions to confirm details.","Open: 'what happened when you tried?' Closed: 'did the light turn green?' Both have their moment.","One question at a time. Stacking three questions confuses everyone."], more:["I ask 'what changed recently?' a lot. It uncovers causes nobody thinks to mention.","If I'm unsure, I ask instead of assuming. Assumptions lead to repeat calls."], ex:["For example: 'Can you walk me through what you see on the screen?' then 'Is there a red light on the front?'"], why:["Because the right question saves ten minutes of guessing."] },
    { id:"confused-callers", q:"How do you help confused callers?", k:["confused caller","confused customer","not tech savvy","lost caller","explaining simply","simple words","patient explanation"], a:["Slow down, use simple words and give one step at a time. Then wait for them to finish before the next.","I describe what they should see, like 'a blue button in the bottom corner'. It keeps us both on track.","Patience is everything. Nobody learns faster by feeling rushed."], more:["I avoid technical terms. If I have to use one, I explain it in plain words.","I check understanding often: does that make sense so far?"], ex:["For example, I once guided someone through a settings menu by describing every icon. It took a while, and they were so proud when it worked."], why:["Because confidence grows when people succeed with you, not around you."] },
    { id:"talkative-callers", q:"How do you handle very talkative callers?", k:["talkative caller","chatty customer","long talker","off topic","rambling","keep on track","steer the call"], a:["I listen kindly, then gently steer back: that sounds lovely, now let's get your order sorted.","I use their name and a summary to bring focus back. It's polite and effective.","Friendly but focused. I enjoy the chat, but I still have a queue waiting."], more:["Sometimes the chat is the real need. A little warmth goes a long way, then we move on.","Closed questions help to keep things on track when a call is drifting."], ex:["For example: 'I love that story. So just to confirm, the issue started on Tuesday?'"], why:["Because everyone in the queue deserves my time too."] },
    { id:"silent-callers", q:"What if a caller goes silent?", k:["silent caller","no answer on line","dead air","silence on the line","nobody speaking","line dropped","cant hear you"], a:["I check in: 'Are you still with me?' If no reply, I repeat once, then follow our process for disconnected calls.","Dead air is awkward, so I fill it with what I'm doing: I'm just checking your account now.","If the line is bad, I offer to call them back on a clearer line."], more:["If I have their number and the call drops mid-issue, I call back right away. Nobody should have to wait in the queue again.","I note dropped calls in the ticket so the next agent knows what happened."], ex:["For example: 'I can't hear you anymore. If you can hear me, I'll call you back in one minute on the number we have.'"], why:["Because silence makes people nervous on both ends."] },
    { id:"repeat-callers", q:"How do you handle repeat callers?", k:["repeat caller","called before","multiple calls","calling again","third call","still not fixed","repeat contact"], a:["With extra care. If someone is calling again, we missed something, so I take full ownership.","I read the history first and start with: I can see you've called before, I'm sorry this is still going on.","My goal is to make this the last call. I dig deeper and I set a follow-up myself."], more:["I often give my own callback so they have one person following the case.","Repeat contacts are great for spotting process gaps. I flag them in the huddle."], ex:["For example, a caller on their third contact got a direct callback from me every day until it was solved."], why:["Because repeat callers have earned a smoother experience."] },
    { id:"ownership", q:"What does taking ownership mean?", k:["ownership","take ownership","own the issue","accountability","responsibility","follow through","see it through"], a:["It means acting like the problem is mine to solve, even if it started somewhere else.","I don't pass people around. I either fix it or make sure the right person does, and I check.","Ownership is saying 'I'll handle this' and meaning it."], more:["Even after a transfer, I sometimes check the ticket later to see it closed properly.","It also means owning my mistakes quickly and fixing them."], ex:["For example, a delivery issue belonged to another team, but I followed up daily until the customer had their order."], why:["Because people trust a person, not a department."] },
    { id:"setting-expectations", q:"How do you set expectations?", k:["set expectations","setting expectations","timelines","realistic promises","manage expectations","what to expect","under promise"], a:["Clear, honest and realistic. I'd rather say three days and deliver in two than the opposite.","I explain what happens next, when and what they need to do, if anything.","Vague promises cause more calls. Specific ones calm people down."], more:["If I'm unsure of a timeline, I give a range and a date I'll update them.","I never promise what's outside my control. I promise what I'll do."], ex:["For example: 'The technician team usually contacts you within two business days. If you haven't heard by Thursday, call us and mention this reference.'"], why:["Because disappointment comes from the gap between expectation and reality."] },
    { id:"mistakes", q:"What happens when you make a mistake?", k:["making mistakes","mistake","error","messed up","wrong information","fix my mistake","oops"], a:["I own it quickly, apologise and fix it. Most people are kind when you're honest.","Mistakes happen. What matters is how fast you correct them and what you learn.","I tell the customer straight away if I gave wrong info. Hiding it only makes it worse."], more:["I write a note so the team can avoid the same slip, especially if the article was unclear.","Quality reviews help me catch patterns before they become habits."], ex:["For example, I once gave the wrong return address. I called back within the hour, apologised and sent the correct label."], why:["Because honesty keeps trust even when things go wrong."] },
    { id:"training", q:"How were you trained?", k:["training","onboarding","learning the job","new hire training","shadowing","practice calls","coaching"], a:["Classroom learning on products and systems, then shadowing experienced agents, then practice calls with a coach.","Listening in on real calls taught me the most. You hear tone and timing you can't learn from a manual.","Training never really ends. New products and processes mean always learning."], more:["Role plays felt silly at first but they're great. Better to stumble in practice than on a live call.","Ongoing coaching sessions keep everyone sharp."], ex:["For example, in my first weeks I listened to dozens of calls before taking my own, with a coach sitting next to me."], why:["Because confidence comes from practice, not just reading."] },
    { id:"coaching-feedback", q:"How do you take feedback?", k:["feedback","taking feedback","receiving feedback","constructive criticism","coaching session","improve","growth"], a:["With an open mind. Feedback is someone handing me a shortcut to being better.","I ask for examples so I know exactly what to change.","I pick one thing at a time to work on. Trying to fix everything at once fixes nothing."], more:["I also give feedback to the team about tools and scripts. Good feedback flows both ways.","Writing down the feedback helps me remember and track progress."], ex:["For example, I was told to slow my closing. I practised it for a week and my next review noticed."], why:["Because nobody hears themselves perfectly."] },
    { id:"product-knowledge", q:"How do you keep up with product knowledge?", k:["product knowledge","know the products","learning products","product updates","new products","product training","specs"], a:["Daily updates, the knowledge base and lots of questions to the product experts.","I like hands-on learning. If I can see a product working, I explain it much better.","Every tricky call teaches me something new about how things really work."], more:["I keep a personal cheat sheet of common model differences and setup steps.","When a new product launches, I read everything about it before the first calls come in."], ex:["For example, before a launch I went through the setup steps myself so I could guide callers smoothly."], why:["Because confident answers come from real understanding."] },
    { id:"note-templates", q:"Do you use templates for notes?", k:["note template","templates","canned responses","saved replies","macros","text snippets","shortcuts"], a:["Yes, for common calls. A template keeps my notes consistent and saves time.","I use snippets for things I type all the time, then add the personal details.","Templates are great helpers but I never let them replace thinking."], more:["My favourite template has three lines: issue, action, next step. Works for almost any call.","For emails, I always edit the template so it doesn't sound copied."], ex:["For example: 'Issue: no power. Action: reset done, still no power. Next: technician visit booked.'"], why:["Because consistency helps everyone reading the notes later."] },
    { id:"workforce-planning", q:"How is the team schedule planned?", k:["scheduling","shift planning","staffing","forecasting","rota","shift schedule","workforce planning"], a:["Planners look at past call volumes to predict busy times, then schedule agents to match.","Shifts are staggered so there's always cover, especially during peaks.","Good planning means breaks don't all happen at once and the queue stays manageable."], more:["Forecasts include seasonal patterns and known events like launches or billing runs.","Sticking to the schedule matters. If I'm late from break, the whole plan shifts."], ex:["For example, more agents start early on Mondays because that's when the biggest wave hits."], why:["Because the right number of people at the right time keeps wait times short."] },
    { id:"adherence", q:"What is schedule adherence?", k:["schedule adherence","adherence","being on time","on schedule","logged in time","status changes","availability"], a:["It means being available when the schedule says I should be. On time for shifts, back on time from breaks.","Small delays add up. If ten people are two minutes late, the queue notices.","I set my status correctly so the system always knows if I'm ready, on a call or on break."], more:["Adherence isn't about being robotic. It's about being fair to the team and to callers.","If a call runs into my break, that's fine. The system understands that."], ex:["For example, I set a quiet alarm for the end of my break so I'm back on the dot."], why:["Because planning only works if everyone follows the plan."] },
    { id:"after-call-work", q:"What do you do between calls?", k:["between calls","after call","wrap-up time","wrap up","post call","admin time","call notes"], a:["Finish my notes, pick the wrap-up code, set any callbacks and send follow-up emails.","A quick breath, a sip of water and a glance at the board.","I keep after-call work tight, but never skip it. It's what makes the next contact smooth."], more:["If something needs research, I set a task instead of making the queue wait.","I check my notes read clearly before I go ready again."], ex:["For example: note done, code set, email sent, ready in under a minute."], why:["Because the work after the call keeps promises from slipping."] },
    { id:"vip-language", q:"How do you make callers feel valued?", k:["feel valued","valued customer","make them feel special","personal touch","personalize","personalise","rapport"], a:["Use their name, remember what they said and follow through on every promise.","Small touches: thanking them for their patience, checking in during holds, a warm goodbye.","Treat every caller like they're the only one in the queue, even when there are fifty."], more:["Building rapport doesn't take long. A friendly line about their day can change the whole call.","I reference earlier details: you mentioned you need it before the weekend, so I've prioritised it."], ex:["For example, remembering a caller said they were moving house and sending the new address confirmation without being asked."], why:["Because people who feel valued stay loyal."] },
    { id:"language-barriers", q:"How do you handle language barriers?", k:["language barrier","language barriers","accent","non native speaker","translation","interpreter","understand accent"], a:["Speak clearly, slowly and use simple words. Patience goes both ways.","I repeat back what I understood to make sure we're aligned.","If an interpreter service or a bilingual teammate is available, I offer it."], more:["I avoid idioms and slang, which can be confusing.","Following up by email helps a lot, since written words are easier to translate."], ex:["For example, I spell out reference numbers slowly, digit by digit, and confirm them back."], why:["Because everyone deserves to be understood."] },
    { id:"spelling-numbers", q:"How do you confirm names and numbers?", k:["spelling names","phonetic alphabet","read back","confirm numbers","spell it","reference number","account number"], a:["I read them back, digit by digit, and use words for letters: B as in bravo, M as in mike.","Always confirm. One wrong digit means a missing order or a wrong email.","For email addresses I go slowly and repeat the whole thing at the end."], more:["I group long numbers in threes. It's easier for both of us to follow.","I type and say at the same time, so I catch my own typos."], ex:["For example: that's S as in sierra, M as in mike, ending in 4 4 7, correct?"], why:["Because small errors cause big headaches later."] },
    { id:"ticket-backlog", q:"How do you manage a ticket backlog?", k:["ticket backlog","backlog","too many tickets","pending tickets","overdue tickets","clearing backlog","pile of tickets"], a:["Oldest and most urgent first. Then the quick wins to shrink the pile fast.","I block time between calls for follow-ups, so the backlog doesn't grow in silence.","The ticket board helps. I can see what's stuck and where to push."], more:["Sometimes the team does a backlog blitz in a quiet afternoon. It feels great to clear the board.","I send short updates on waiting tickets, so customers know they're not forgotten."], ex:["For example, after a busy week we split the backlog by category and cleared it in two quiet afternoons."], why:["Because every ticket is someone waiting."] },
    { id:"call-routing", q:"How do calls get routed to you?", k:["call routing","routing","ivr","phone menu","press 1","skills routing","auto attendant"], a:["Callers choose options in the phone menu, then the system sends them to the agent with the right skills.","If I'm trained for billing and technical, I get both kinds of calls.","Good routing means fewer transfers. Bad menus send people to the wrong place."], more:["We share feedback when the menu confuses people, like when an option is misunderstood.","Some callers just press zero to reach a person, which tells us the menu could be simpler."], ex:["For example, if many people choose 'billing' for delivery questions, the menu wording needs work."], why:["Because the right agent first time saves everyone time."] },
    { id:"self-service", q:"What about self-service options?", k:["self-service","self service","help online","do it yourself","online portal","customer portal","help yourself"], a:["I love good self-service. Simple questions get answered instantly and I get more time for complex ones.","When people can track orders or reset passwords themselves, everyone is happier.","I often point callers to online tools for next time, gently, never as a brush-off."], more:["Our calls show which self-service pages aren't working. That feedback helps improve them.","Not everyone wants self-service, and that's fine. The phone is always there."], ex:["For example, I'll say: you can also check this anytime online, here's where to find it."], why:["Because the fastest answer is the one you don't have to wait for."] },
    { id:"listening-to-silence", q:"Why do you pause before answering?", k:["pausing","pause before answering","dont interrupt","interrupting","waiting to speak","let them finish","talk over"], a:["To make sure they've finished. Interrupting makes people feel unheard.","A short pause gives me time to think and gives them space to add anything.","Two seconds of silence sounds thoughtful, not slow."], more:["Callers often add the most important detail right after a pause.","Talking over someone, even by accident, resets the trust you've built."], ex:["For example, I paused and the caller added, oh, and it only happens at night. That changed everything."], why:["Because the best info often comes last."] },
    { id:"handling-pressure", q:"How do you handle a full queue?", k:["full queue","long queue","pressure","calls stacking","overwhelmed","under pressure","queue pressure"], a:["One call at a time. The queue is everyone's problem, the caller in my ear is mine.","I stay efficient without rushing: clear questions, quick notes, no extra chatter.","I don't let a big number on the screen change my tone with the person I'm helping."], more:["The team helps each other: covering quick calls, sharing answers to repeated issues.","When I feel the pressure rising, a deep breath before going ready helps."], ex:["For example, with forty people waiting, I still greeted the next caller like they were the only one."], why:["Because rushing creates mistakes, and mistakes create more calls."] },
    { id:"teamwork", q:"How does the team work together?", k:["teamwork","team work","teammates","helping each other","team chat","team spirit","colleagues"], a:["We share tips in team chat, cover for each other and celebrate wins together.","If someone gets a tricky question, three people jump in with ideas. I love that.","A good team makes hard days easy. We laugh a lot between calls."], more:["We swap knowledge constantly. Someone always knows the trick you need.","After tough calls, a quick check-in from a teammate means a lot."], ex:["For example, someone posts 'anyone seen this error?' and within a minute there's an answer."], why:["Because nobody knows everything, but together we come close."] },
    { id:"why-customer-service", q:"Why did you choose customer service?", k:["why customer service","choose this job","career choice","why this career","got into customer service","love helping","why support"], a:["I love helping people and solving problems. Customer service lets me do both all day.","Talking to people never gets boring. Every call is a new story.","I like the feeling of making someone's day a little easier."], more:["It also teaches skills that matter everywhere: patience, clear talking and staying calm.","The variety keeps it interesting. One call is a puzzle, the next is a laugh."], ex:["For example, the first time someone said 'you saved my day', I knew this job was for me."], why:["Because helping people is the most satisfying work I know."] },
    { id:"career-growth", q:"Where can customer service lead?", k:["career growth","career path","promotion","next step","team lead role","grow in career","advance"], a:["Team lead, trainer, quality reviewer, knowledge base writer or moving into other teams. Lots of paths.","The skills transfer everywhere: communication, problem solving and handling pressure.","Many people start on the phones and end up shaping how the whole support works."], more:["Becoming a go-to person for a product or process is a great first step.","Helping train new agents is a nice way to grow and give back."], ex:["For example, agents who write great knowledge base articles often move into training or content roles."], why:["Because understanding customers is valuable in any role."] },
    { id:"customer-journey", q:"What is the customer journey?", k:["customer journey","customer experience","cx","touchpoints","end to end","experience journey","customer lifecycle"], a:["It's every step someone takes with a company, from buying to using to getting help. I'm one stop on that road.","Support is often the moment that decides how people feel about the whole experience.","When I understand the full journey, I can explain where things are and what comes next."], more:["Many calls happen because an earlier step was unclear. We share that so it gets fixed upstream.","A great support call can rescue a rough journey."], ex:["For example, if delivery emails confuse people, I hear about it on the phone before anyone else."], why:["Because support sees the whole experience from the customer's side."] },
    { id:"voice-of-customer", q:"Do you share customer feedback with other teams?", k:["voice of customer","share feedback","product feedback","feedback loop","insights","trends from calls","customer insights"], a:["Yes. We see trends before anyone else, so we pass them to product and other teams.","I tag patterns in tickets so they show up in reports.","Call centres are like the ears of a company. We hear everything first."], more:["A clear example plus how often it happens makes feedback actionable.","When a fix comes from our feedback, the whole team cheers."], ex:["For example, lots of calls about one confusing instruction led to the instructions being rewritten."], why:["Because fixing the cause beats answering the same call forever."] },
    { id:"remote-vs-office", q:"Do you work from the office or remotely?", k:["remote work","work from home","office or home","remote support","home office","hybrid","in the office"], a:["Customer service works in both. Here I've got my call centre style desk, with the headset, phone and board all set up.","Remote or office, the essentials are the same: a quiet space, a good headset and solid internet.","I like the office energy during peak hours. Hearing the team helps."], more:["At any desk, background noise is the enemy. Callers should hear only me.","Staying connected in team chat matters even more when people are spread out."], ex:["For example, a quiet corner and a noise cancelling headset make any space feel like a proper call desk."], why:["Because the caller only cares about clear sound and a helpful voice."] },
    { id:"desk-setup", q:"What's on your desk?", k:["your desk","desk setup","workspace","my room","call desk","desk items","office setup"], a:["Headset, monitor, desk phone, water bottle, notepad and the ticket board on the wall. Everything I need within arm's reach.","A tidy desk and a full water bottle. And a tiny mirror to check I'm smiling.","My call centre corner: headset on its stand, screens ready and sticky notes in three colours."], more:["I keep a notepad for quick details like reference numbers, then shred it at the end of the day.","Everything has its spot, so I never hunt for anything mid-call."], ex:["For example, my headset hangs on a hook at the side of the monitor, ready for the first call."], why:["Because a tidy workspace means a calm head."] },
    { id:"calls-per-day", q:"How many calls do you take a day?", k:["calls per day","how many calls","call volume","number of calls","daily calls","calls a day","contact volume"], a:["It depends on the day and the type of calls, but it can be dozens. Mondays are on the higher end.","Some days are lots of quick calls, others are fewer, longer troubleshooting sessions.","I care more about solving each one than the count."], more:["Call volume changes with seasons, launches and even the weather.","Fewer, better calls usually beat many rushed ones."], ex:["For example, a day of quick order questions might be twice the count of a technical day."], why:["Because quality per call matters more than the number."] },
    { id:"handling-silence-hold", q:"How long is too long on hold?", k:["too long on hold","long hold","hold too long","waiting too long","max hold","hold limit","forever on hold"], a:["If it's more than a couple of minutes, I check back. More than a few, I offer a callback instead.","Nobody should be left hanging. Checking in every minute or two keeps them comfortable.","Personally, anything past one full loop of the hold music is too long. I'm only half joking."], more:["If I need longer research, a callback respects their time far more than a long hold.","I always give a fresh estimate when I check in."], ex:["For example: 'Thanks for waiting. This is taking a bit longer, would you prefer I call you back in fifteen minutes?'"], why:["Because their time is as valuable as mine."] },
    { id:"remembering-names", q:"Do you use the caller's name?", k:["caller name","using names","remember names","personal name","address by name","first name","customer name"], a:["Yes, a couple of times in the call. It makes things more personal without overdoing it.","I ask how they'd like to be addressed if I'm unsure. Some prefer first names, some don't.","Using a name at the start and end is my sweet spot."], more:["Using a name too often sounds like a sales script. Two or three times is plenty.","If a name is hard to pronounce, I ask kindly. People appreciate the effort."], ex:["For example: 'Thanks for your patience, Sam, I've got that fixed for you.'"], why:["Because hearing your name makes you feel seen."] },
    { id:"under-promise", q:"Do you ever promise things you can't control?", k:["broken promise","overpromise","over promise","promise","guarantee","commitments","promising too much"], a:["Never. I only promise what I can personally do, like a callback or an update.","I promise actions, not outcomes I don't control. 'I'll chase it today' instead of 'it'll arrive tomorrow'.","A promise kept builds more trust than a big promise broken."], more:["If I'm unsure, I say so and promise to find out. Honesty works better than optimism.","Every promise goes into my notes so I can't forget it."], ex:["For example: 'I can't guarantee the date, but I'll check with the warehouse and call you by 3 p.m.'"], why:["Because broken promises are the fastest way to lose trust."] }

KB["john"] = {
  topics: [
    { id:"what-i-do", q:"What do you do here?", k:["cabinet maker","cabinetmaker","carpenter","carpentry","woodworker","woodworking","joiner","what you build"], a:["I'm a cabinet maker. I turn rough boards and sheet goods into cabinets, drawers and doors that fit right and last.","I build cabinets and furniture by hand and with machines. Measuring, cutting, joining, sanding, finishing: the whole trip from plank to piece.","Think of me as the person who makes the boxes your kitchen lives in. Clean joints, square corners, doors that close quietly."], more:["Most of my work is casework: boxes, face frames, doors and drawers. Some days it's a single shelf, some days a full run of kitchen cabinets.","The job is half woodworking and half problem solving. Walls aren't straight, wood moves, and every room has a surprise."], ex:["For example, this week I'm building a base cabinet with two drawers and a door, from cut list to finish."], why:["Because a good cabinet gets used every single day, and I like making things that earn their keep."] },
    { id:"typical-day", q:"What's a typical day like in the workshop?", k:["typical day","daily routine","normal day","workday","day in the shop","schedule","routine"], a:["Coffee, sweep, check the plan. Then I cut parts in the morning while I'm fresh and do assembly or sanding in the afternoon.","Mornings are for the loud machines and careful cuts. Afternoons are glue-ups, sanding and finishing. Last thing, I clean up.","A lot of measuring, a fair bit of cutting, some sanding, and at least one moment where I stare at a board deciding which face goes out."], more:["I try to group similar tasks: all the crosscuts at once, all the dados at once. Fewer setups means fewer mistakes.","Glue needs time, so I plan glue-ups before lunch or before leaving. The clamps do the work while I'm gone."], ex:["For example, today I milled poplar for a face frame before ten, cut the joinery by noon and glued it up after lunch."], why:["Because batching tasks keeps setups accurate and saves a surprising amount of time."] },
    { id:"start-of-day", q:"How do you start your day?", k:["start the day","morning routine","first thing","opening the shop","in the morning","warm up"], a:["I sweep the floor, check the glue-ups from yesterday and read my cut list. Then the coffee gets cold while I work.","First I look at what's in the clamps, then I check my blades and tools. A dull blade in the morning ruins the whole day.","I walk the shop, turn on the dust collector, and mark what I'm cutting today right on the boards."], more:["Checking yesterday's glue-ups first tells me if anything shifted overnight while there's still time to fix the plan.","I also check the shop humidity. Wood reacts to it, so it tells me whether to cut parts today or let them sit."], ex:["For example, if a panel came out of the clamps slightly cupped, I'll plan to flatten it before anything else."], why:["Because a calm, organized start prevents rushed mistakes later."] },
    { id:"current-project", q:"What are you building right now?", k:["building now","current project","working on","half built cabinet","this cabinet","in progress","kitchen cabinet project"], a:["A kitchen-style base cabinet: plywood box, hardwood face frame, one drawer on top and a door below.","That half-built cabinet over there. The box is glued and square, the face frame is next, then the drawer and door.","A base cabinet for a kitchen run. Right now it's a box without a face, so it looks a bit shy."], more:["The carcass is plywood with dados for the bottom and a rabbet for the back. The face frame will be hardwood, joined with pocket screws.","The drawer will be dovetailed in front and run on full-extension slides. The door gets concealed hinges."], ex:["For example, the next step is fitting the face frame flush with the box sides, then trimming it with a flush-trim bit."], why:["Because a base cabinet has a bit of everything: box, frame, drawer and door. It's a good all-round build."] },
    { id:"favorite-wood", q:"What's your favorite wood?", k:["favorite wood","favourite wood","best wood","wood you love","prefer to work","top wood"], a:["Cherry. It cuts clean, smells nice and darkens to a deep red over the years. It gets better with age.","I'd say cherry, with walnut a close second. Walnut is easier to love on day one, cherry rewards patience.","Cherry for furniture, maple for anything that has to take a beating."], more:["Cherry starts out pale pink and darkens with light exposure. A finished cherry piece looks very different after a year in the sun.","It does burn easily on saw blades and routers if you go too slow, so I keep tools sharp and feed steady."], ex:["For example, I once built a cherry cabinet and left a book on top. Months later you could see a lighter rectangle where the book had been."], why:["Because I like a wood that changes with the room it lives in."] },
    { id:"favorite-tool", q:"What's your favorite tool?", k:["favorite tool","favourite tool","best tool","tool you love","most used tool","go-to tool"], a:["A good hand plane. Shaving off a whisper-thin curl and leaving a glassy surface never gets old.","My combination square. It's not glamorous, but almost every cut in this shop starts with it.","The block plane in my apron. Small, quick, and it fixes a lot of tiny problems."], more:["A sharp plane leaves a surface cleaner than sanding does, because it slices the fibers instead of scratching them.","The square earns its place by checking everything: blade angles, layout lines, box corners, depths."], ex:["For example, if a door edge is a hair proud, two passes with the block plane and it sits perfectly flush."], why:["Because the simplest tools are the ones I reach for a hundred times a day."] },
    { id:"favorite-part", q:"What's your favorite part of the job?", k:["favorite part","favourite part","best part","enjoy most","most satisfying","love about the job"], a:["The first dry fit when everything slides together tight with no gaps. That's the moment.","Putting on the first coat of finish. The grain jumps out and all the sanding finally pays off.","Closing a drawer that glides in and stops flush. Small thing, huge satisfaction."], more:["A clean joint tells the story of good measuring, good cutting and patience. You can't fake it.","Finish day is the reveal. Raw wood looks flat, then the oil hits it and the figure comes alive."], ex:["For example, a dovetailed drawer that goes together with a few light taps of the mallet makes my week."], why:["Because it's the proof that all the careful steps before it were worth it."] },
    { id:"hardest-part", q:"What's the hardest part of your job?", k:["hardest part","most difficult","toughest part","challenging","biggest challenge","hard about"], a:["Installing in rooms where nothing is level, plumb or square. The cabinet is perfect, the house isn't.","Patience during glue-ups and finishing. You can't rush drying time, no matter how much you stare at it.","Fixing a mistake without making it obvious. That takes more skill than doing it right the first time."], more:["Old houses especially: floors slope, walls bow, corners aren't 90 degrees. Shims and scribing become my best friends.","Finishing is hard because dust, temperature and humidity all affect it. A perfect piece can be ruined in the last hour."], ex:["For example, I once had a wall that bowed almost half an inch over the length of a cabinet run, so I scribed the filler strip to follow it."], why:["Because the shop is controlled, but the real world is not."] },
    { id:"measure-twice", q:"Why do you always say measure twice, cut once?", k:["measure twice","cut once","measure twice cut once","measuring","double check","accurate measurements"], a:["Because wood doesn't grow back. Measuring is cheap, a wasted board isn't.","A second measure catches the classic mistakes: reading the wrong side of the mark, or hooking the tape wrong.","Measure twice, cut once. And if you're tired, measure three times and cut tomorrow."], more:["I also mark which side of the line to cut on. A blade has thickness, and cutting on the wrong side makes a part short by the kerf.","Whenever I can, I skip numbers entirely and mark directly from the piece it has to fit. Fewer numbers, fewer mistakes."], ex:["For example, I once cut a shelf a blade width short because I cut on the wrong side of my line. Now I put an X on the waste side every time."], why:["Because a cut can't be undone, but a measurement can always be repeated."] },
    { id:"tape-measure", q:"Any tips for using a tape measure?", k:["tape measure","measuring tape","tape","tape hook","burn an inch","reading a tape"], a:["The little hook on the end slides on purpose. It moves the thickness of the hook so inside and outside measurements both read true.","Use the same tape for the whole project. Two tapes can disagree by a hair, and hairs add up.","For precise work I burn an inch: start at the 1 inch mark and subtract it. The hook stays out of it."], more:["A bent or loose hook throws every reading off. If it's damaged, I retire the tape to the truck.","For anything critical I trust a steel rule or a story stick over a tape."], ex:["For example, measuring a cabinet opening, I hook one side and read the other, then check it again starting from the opposite side."], why:["Because consistent measuring matters more than perfect measuring."] },
    { id:"squares", q:"What kind of squares do you use?", k:["square","combination square","speed square","try square","framing square","checking square","90 degrees"], a:["A combination square for layout and depths, a try square for checking edges, and a framing square for big panels and boxes.","My combination square does most of the work. I check it against a known straight line now and then, because even squares can drift.","Squares keep me honest. If my reference is off, every cut after it is off too."], more:["You can test a square by drawing a line, flipping it over and drawing again. If the lines don't match, it's out.","For checking a box, I also measure the diagonals. Equal diagonals mean the box is square."], ex:["For example, before glue sets on a cabinet box, I measure corner to corner both ways and push the long diagonal until they match."], why:["Because square parts make assembly easy and doors that hang right."] },
    { id:"marking-gauge", q:"What is a marking gauge for?", k:["marking gauge","wheel gauge","cutting gauge","scribing line","layout line","marking knife"], a:["It scribes a line parallel to an edge, perfect for marking joint depths and shoulders.","A marking gauge cuts a fine line into the fibers. My chisel can drop right into it, which beats any pencil line.","I set it once and mark every matching part with the same setting. Consistent and quick."], more:["A wheel gauge has a small sharp disc that slices rather than tears, so it works across and along the grain.","Paired with a marking knife, it gives me lines that are thinner and more accurate than a pencil."], ex:["For example, for dovetails I set the gauge to the thickness of the board and scribe the baseline around every end."], why:["Because a knife line is a physical edge, and tools can register against it."] },
    { id:"story-stick", q:"What is a story stick?", k:["story stick","storystick","layout stick","rod","measuring stick","full size layout"], a:["It's a plain strip of wood with all the important marks on it: heights, shelf positions, door gaps. No tape needed.","Instead of writing numbers, I mark the real positions on a stick and transfer them straight to the parts.","It's the oldest trick in the shop, and it still beats a tape for repeating the same layout."], more:["On installs I'll mark wall heights, outlet locations and the floor high point on a stick. Then I lay out cabinets from it.","Because there's no arithmetic, there are no math errors. The stick just is the measurement."], ex:["For example, for a bank of drawers I mark every drawer height on one stick and use it on both sides of the cabinet."], why:["Because transferring marks directly removes the chance of misreading a number."] },
    { id:"cut-list", q:"How do you make a cut list?", k:["cut list","cutting list","parts list","bill of materials","list of parts","cutting diagram"], a:["I list every part with its name, quantity, thickness, width and length. Then I plan how to get them out of the boards and sheets.","From the drawing I break the project down part by part, then group parts by material and thickness.","A cut list is the bridge between the drawing and the saw. I don't cut without one."], more:["For sheet goods, I draw the sheet and fit parts onto it like a puzzle, keeping grain direction consistent on visible parts.","I add a little extra length to solid wood parts so I can trim them to final size after milling."], ex:["For example, a base cabinet list has two sides, a bottom, two stretchers, a back, face frame rails and stiles, drawer parts and a door."], why:["Because it saves material and stops me from discovering a missing part halfway through."] },
    { id:"design-drawings", q:"Do you draw your designs first?", k:["design drawing","sketch","sketches","drawings","plans","blueprint","drawing a cabinet"], a:["Always. Even a quick sketch with dimensions saves me from building something that doesn't fit.","I start with a rough sketch, then a front view and a side view with measurements. That's enough for most cabinets.","Pencil and graph paper still do the job. If it works on paper, it'll probably work in wood."], more:["I draw the joinery too. Knowing where a dado or a tenon goes changes the length of the parts.","For tricky spots I'll draw a full-size section on a piece of plywood so I can lay parts right on top of it."], ex:["For example, for a corner cabinet I drew the corner at full size to check how the door would swing past the next cabinet."], why:["Because changes on paper cost an eraser, changes in wood cost a board."] },
    { id:"first-project", q:"What's a good first woodworking project?", k:["first project","beginner project","easy project","starter project","simple project","project to start"], a:["A simple box or a small shelf. Few parts, straight cuts, and you learn measuring, gluing and finishing.","A cutting board or a step stool. Useful, quick, and mistakes are small.","Build a small wall shelf with dados. It teaches layout, joinery and finishing all in one weekend."], more:["Pick a project with straight lines and a forgiving wood like pine or poplar. Save the curves and fancy joints for later.","Finish it, even if it's imperfect. Learning to finish a project is a skill all by itself."], ex:["For example, a pine bookshelf with two dadoed shelves and a back panel is a perfect first build."], why:["Because a small win teaches more and keeps you coming back for the next one."] },
    { id:"beginner-tips", q:"Any tips for beginners?", k:["beginner tips","tips for beginners","new to woodworking","getting started","advice for beginners","learning woodworking","novice"], a:["Start simple, keep your tools sharp, and practice on scrap before the real piece.","Buy a few good tools instead of a lot of cheap ones. A sharp chisel and an accurate square go a long way.","Learn to read the grain and measure carefully. Speed comes later on its own."], more:["Do test cuts. Every machine setup should be checked on a scrap before it touches your good wood.","Keep a notebook of settings and mistakes. Your future self will thank you."], ex:["For example, before cutting dados in good plywood, I cut one in a scrap and test the fit with a real shelf."], why:["Because good habits early make everything later easier and safer."] },
    { id:"hardwood-softwood", q:"What is the difference between hardwood and softwood?", k:["hardwood vs softwood","hardwood","softwood","hard wood","soft wood","deciduous","conifer"], a:["It's about the tree, not the hardness. Hardwoods come from leafy trees, softwoods from conifers like pine.","Hardwoods like oak and maple are usually denser and used for furniture. Softwoods like pine are lighter and great for framing and simple builds.","Funny thing: balsa is technically a hardwood, and some softwoods are harder than it. The names are botanical."], more:["Hardwoods usually have more interesting grain and hold up better to wear, which is why I use them for face frames and doors.","Softwoods are easier to cut and cheaper to buy, but they dent easily."], ex:["For example, I'll use poplar for painted parts and oak or maple where the wood shows and gets handled."], why:["Because choosing the right one decides how the piece looks and how long it lasts."] },
    { id:"oak", q:"What is oak like to work with?", k:["oak","red oak","white oak","oak wood","quarter sawn oak","oak grain"], a:["Oak is strong, heavy and has bold open grain. Classic for cabinets and furniture.","Red oak is a bit pinkish with open pores, white oak is tighter and handles moisture better.","It's tough on tools but forgiving to finish. Stain takes to it nicely because of the open pores."], more:["Quartersawn white oak shows ray fleck, those shimmering ribbons across the grain. It's beautiful and very stable.","The open pores can show through paint, so for a smooth painted finish I use grain filler or choose another wood."], ex:["For example, a quartersawn white oak door panel with a clear oil finish shows flake patterns that change as you walk by."], why:["Because it's durable, easy to source and looks great with a simple finish."] },
    { id:"maple", q:"Why use maple for cabinets?", k:["maple","hard maple","soft maple","maple wood","maple cabinets","light wood"], a:["Maple is hard, smooth and light colored. It takes a beating, so it's great for drawers and kitchen parts.","Hard maple is dense and tough. It has a fine grain, so it looks clean and modern with a clear finish.","It's my choice for things that get used hard: drawer sides, cutting boards, shelves that see a lot of weight."], more:["Maple can be blotchy when stained, so I use a conditioner or a gel stain, or I just leave it natural.","It also burns easily on saws and routers, so sharp tools and a steady feed matter."], ex:["For example, maple drawer boxes with a clear finish look crisp and last for decades."], why:["Because hardness and a fine grain make it both durable and clean looking."] },
    { id:"walnut", q:"What makes walnut special?", k:["walnut","black walnut","dark wood","walnut wood","walnut grain","chocolate wood"], a:["Rich chocolate color, smooth to work and it finishes beautifully with just oil.","Walnut machines easily and holds crisp details. It feels like the wood wants to cooperate.","It's dark when fresh and slowly lightens and warms over time. Very different from cherry, which darkens."], more:["The lighter sapwood near the bark is creamy, so I plan parts to avoid it or use it on purpose for contrast.","Walnut dust is fine and irritating, so a good mask and dust collection matter here."], ex:["For example, a walnut door on a maple cabinet makes a nice two-tone contrast."], why:["Because it looks expensive without needing any stain at all."] },
    { id:"cherry", q:"What should I know about cherry wood?", k:["cherry","cherry wood","black cherry","darkens","reddish wood","cherry aging"], a:["Cherry is smooth, fine grained, and darkens to a deep reddish brown with light and time.","It's a joy to plane and carve, but it shows every scratch and blotches if you stain it.","Let it age naturally. Staining cherry is like putting a filter on a sunset."], more:["To speed up the color change, some woodworkers leave fresh pieces in sunlight for a few days before finishing.","It burns easily on power tools, so I keep blades sharp and keep the wood moving."], ex:["For example, two cherry boards from the same tree can look identical on day one and still match beautifully years later."], why:["Because its color change is part of its charm."] },
    { id:"birch", q:"What is birch used for?", k:["birch","birch plywood","baltic birch","yellow birch","birch wood","void free plywood"], a:["Birch is pale, fairly hard and fine grained. Birch plywood is one of my go-to materials for cabinet boxes and drawers.","Baltic birch plywood has many thin layers and very few voids. Great for drawer boxes and jigs.","Solid birch is similar to maple and can stand in for it in many uses."], more:["Baltic birch edges look nice when sanded and finished, so I sometimes leave the edge exposed as a design detail.","Like maple, birch can blotch when stained. Conditioner or a gel stain helps."], ex:["For example, I build shop jigs from Baltic birch because it stays flat and holds screws well."], why:["Because it's stable, strong and consistent sheet to sheet."] },
    { id:"pine", q:"Is pine good for furniture?", k:["pine","pine wood","pine boards","knotty pine","white pine","yellow pine"], a:["Yes, especially for rustic or painted pieces. It's light, cheap and easy to work.","Pine is soft, so it dents easily. Great for beginners and shelves, less great for tabletops.","Knotty pine has its charm, but the knots can bleed through paint unless you seal them first."], more:["Pine is resinous. The sap can gum up blades and show through finishes, so I seal knots with shellac.","It stains unevenly, so a conditioner helps a lot."], ex:["For example, a pine shelf in a mudroom painted white looks great and takes the knocks without anyone minding."], why:["Because it's affordable and forgiving while you're learning."] },
    { id:"poplar", q:"Why do you use poplar?", k:["poplar","yellow poplar","tulipwood","poplar wood","paint grade wood","green streaks"], a:["Poplar is my paint grade wood. Stable, easy to mill and it takes paint really smoothly.","It's a hardwood but soft enough to work easily. Perfect for painted face frames and doors.","Poplar sometimes has green or purple streaks. That's normal, and under paint nobody ever knows."], more:["It's not great under stain because it can look muddy, so I keep it for painted work.","It holds screws and glue well, which makes it practical for interior parts too."], ex:["For example, the face frame on the cabinet I'm building now is poplar because it will be painted."], why:["Because it's affordable, stable and gives a smooth painted surface."] },
    { id:"ash", q:"What is ash wood like?", k:["ash","ash wood","white ash","ash grain","tool handles","bendable wood"], a:["Ash is strong, springy and has a bold grain similar to oak, but lighter in color.","It bends well with steam and handles shock, which is why it's used for tool handles.","It's a nice choice when you want an oak look with a lighter, more modern feel."], more:["Like oak, ash has open pores that show through paint unless you fill them.","It machines well with sharp tools and stains evenly."], ex:["For example, the handle on my favorite mallet is ash, and it's taken years of abuse."], why:["Because it combines strength and flexibility better than most woods."] },
    { id:"hickory", q:"Is hickory good for cabinets?", k:["hickory","hickory wood","pecan wood","hickory cabinets","rustic cabinets","color variation"], a:["Hickory is extremely hard and tough. It makes rustic cabinets with big color variation.","It's beautiful in a wild way: light and dark streaks side by side. Hard on tools though.","Hickory is great when you want strength and character. Not my choice if you want a uniform look."], more:["Its hardness dulls blades faster, so I plan for more sharpening on hickory jobs.","It also moves quite a bit with moisture, so it needs proper acclimating."], ex:["For example, hickory doors in a lodge-style kitchen look great because the variation is part of the style."], why:["Because it's one of the toughest domestic woods around."] },
    { id:"plywood", q:"Why use plywood for cabinets?", k:["plywood","ply","sheet goods","cabinet plywood","plywood sheets","hardwood plywood"], a:["Plywood is stable because the layers cross grain. It barely moves, which is perfect for cabinet boxes.","It's strong, holds screws well and comes in big flat sheets. Ideal for carcasses and backs.","Cabinet grade plywood has a nice hardwood face veneer, so it looks good where it shows."], more:["The exposed edges need covering, usually with edge banding or a solid wood face frame.","Plywood thickness is often a bit under the nominal size, so I measure it before cutting dados."], ex:["For example, the box of the cabinet I'm building is plywood, and the face frame hides its front edges."], why:["Because stability matters more than anything for a box that holds doors and drawers."] },
    { id:"mdf", q:"What is MDF good for?", k:["mdf","medium density fiberboard","fiberboard","mdf board","mdf panels","painted panels"], a:["MDF is dead flat and smooth, perfect for painted doors, panels and templates.","It's made from fine wood fibers and glue. No grain, no knots, no movement to speak of.","Great for painted work, terrible near water. A soaked MDF edge swells and never comes back."], more:["It's heavy and doesn't hold screws in its edges as well as plywood, so I pilot drill and avoid overtightening.","The dust is very fine, so I always use dust collection and a good mask with MDF."], ex:["For example, painted shaker door center panels are often MDF because they stay perfectly flat."], why:["Because a flat, stable surface gives the cleanest paint finish."] },
