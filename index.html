    { id:"particleboard", q:"What about particleboard?", k:["particleboard","particle board","chipboard","flake board","budget board","low cost board"], a:["Particleboard is made from wood chips and glue. It's affordable and flat, common in budget cabinets.","It works fine for some boxes, but it's weak with screws and hates moisture.","I'm not a big fan for kitchens, but with a good laminate surface and careful hardware it can do the job."], more:["Screws can strip out easily, so special fasteners and inserts help, and glue joints matter more.","Edges need to be sealed or banded to keep moisture out."], ex:["For example, a lot of flat-pack furniture uses particleboard with a melamine or laminate skin."], why:["Because it's economical, but it has clear limits."] },
    { id:"melamine", q:"What is melamine board?", k:["melamine","melamine board","laminated board","white melamine","melamine cabinets","coated board"], a:["Melamine is particleboard or MDF with a hard plastic-like surface already applied. No finishing needed.","It's popular for cabinet interiors because it's easy to clean and comes ready to use.","It chips if you cut it with the wrong blade or setup, so I take it slow and score the cut."], more:["Glue doesn't stick to the melamine face, so joints rely on screws, dados into the core or special fasteners.","Edges get covered with matching edge banding."], ex:["For example, white melamine shelves inside a closet look clean and wipe down easily."], why:["Because it saves all the finishing work on surfaces nobody wants to paint."] },
    { id:"veneer", q:"What is wood veneer?", k:["veneer","wood veneer","veneered","thin wood","veneer sheet","face veneer"], a:["Veneer is a very thin slice of wood glued onto a stable core. You get the look of nice wood on a stable panel.","It lets me use beautiful figured wood across a big panel without the movement problems of solid wood.","Veneer isn't cheating. It's been used for centuries in fine furniture."], more:["Sliced veneers from the same log can be book matched, so the grain mirrors itself across a door or panel.","Sanding veneer needs care: sand through it once and the core shows."], ex:["For example, a walnut veneered plywood panel gives a cabinet side the look of solid walnut without the weight."], why:["Because it stretches rare wood further and keeps panels stable."] },
    { id:"edge-banding", q:"How do you cover plywood edges?", k:["edge banding","edgebanding","edge tape","plywood edges","iron on edge","covering edges","solid edging"], a:["With edge banding: a thin strip of veneer, often iron-on, that matches the face.","For heavier wear, I glue on solid wood edging and trim it flush. It's tougher than tape.","Either banding or a face frame. Raw plywood edges just don't look finished."], more:["Iron-on banding has heat activated glue. Iron it down, trim the overhang, and ease the edge with a sanding block.","Solid edging takes more time but survives bumps and can be shaped with a router."], ex:["For example, shelf fronts in a bookcase get solid edging so they can handle books being slid on and off."], why:["Because it protects the edge and makes the panel look like solid wood."] },
    { id:"grain-direction", q:"Why does grain direction matter?", k:["grain direction","wood grain","with the grain","against the grain","reading grain","grain orientation"], a:["Plane or cut against the grain and the fibers tear out. Go with it and the surface stays smooth.","Grain also decides strength. Long grain is strong, short grain snaps easily.","It's also about looks: grain running the same way on matching parts makes a piece feel calm and planned."], more:["I read grain like a hill: plane downhill, from where the fibers rise toward where they exit, to avoid tearout.","On cabinet doors, vertical grain on stiles and horizontal on rails is the traditional look."], ex:["For example, a shelf with grain running across its short width would break with a load. Along the length it's strong."], why:["Because the direction of the fibers controls strength, finish quality and appearance."] },
    { id:"wood-movement", q:"What is wood movement?", k:["wood movement","wood moves","expansion","contraction","seasonal movement","swelling","shrinking"], a:["Wood swells when the air is humid and shrinks when it's dry. Mostly across the width, hardly in length.","A wide solid panel can change size noticeably between summer and winter. Design has to allow for it.","Wood never stops breathing. Good furniture is built to let it."], more:["That's why frame and panel doors exist: the panel floats in a groove and can move without cracking the frame.","Tabletops are attached with clips or slotted holes so they can move across their width."], ex:["For example, if you glue a solid panel tight into a frame, it can split in winter or blow the joints in summer."], why:["Because ignoring it leads to cracks, gaps and stuck drawers."] },
    { id:"moisture-content", q:"Why does moisture content matter?", k:["moisture content","moisture meter","wet wood","dry wood","kiln dried","humidity"], a:["Wood should be at a moisture level that matches where it will live. Too wet and it shrinks after you build.","I check boards with a moisture meter before building. Numbers don't lie.","Kiln dried lumber is the norm for furniture. Air dried works too if it's given enough time."], more:["If wood is wetter than its future home, joints loosen and panels crack as it dries.","Shop humidity matters too, so I try to keep conditions steady."], ex:["For example, a board fresh from a damp storage shed can read noticeably wetter than one stored indoors."], why:["Because building with wood at the right moisture prevents surprises after delivery."] },
    { id:"acclimating", q:"Do you let wood acclimate before using it?", k:["acclimate","acclimating","acclimatize","let wood sit","settle wood","sticker"], a:["Yes. New wood rests in the shop for days, stickered with spacers so air reaches every face.","I bring boards in early and let them settle to shop conditions before I mill them.","Patience here saves headaches later. Wood that rests stays flat after you cut it."], more:["Stickering means stacking boards with thin strips between them so air circulates evenly.","I also rough cut parts oversize, let them rest a day, then mill them to final size."], ex:["For example, a board that's flat on delivery can cup overnight once it adjusts. Better it does that before I cut joinery."], why:["Because wood moves to match its environment, and I want it to finish moving before I build."] },
    { id:"choosing-boards", q:"How do you choose good boards?", k:["choosing boards","picking boards","selecting lumber","buying lumber","lumber yard","board selection"], a:["I look for straight grain, flat boards, no big cracks and no twist. And I sight down each edge.","I pick the board for the part. Pretty figure for doors, plain straight grain for frames and hidden parts.","Take your time at the lumber pile. A good board saves an hour of fixing later."], more:["I check the end grain too. Growth rings running more vertical usually mean a more stable board.","I buy a bit extra, around a fifth more, to cover defects and mistakes."], ex:["For example, for door rails and stiles I pick quiet, straight grain so the frame looks calm around the panel."], why:["Because the board you choose decides how easy the build is."] },
    { id:"knots-defects", q:"What do you do with knots and defects?", k:["knots","knot","wood defects","cracks","checks","warped board","cupping","twist"], a:["I cut around them or put them where they won't show. Sometimes a knot becomes a feature.","Loose knots get cut out. Tight knots can stay if they look good and don't weaken the part.","Cup, bow, twist and crook: the four ways a board misbehaves. Most can be milled out if the board is thick enough."], more:["End checks are small cracks at the ends of boards. I usually trim them off because they can keep spreading.","A twisted board is the hardest to fix. Often it's better used for short parts."], ex:["For example, a knotty section of walnut might become a small drawer front where the character looks intentional."], why:["Because defects affect both strength and how the finished piece looks."] },
    { id:"joinery-overview", q:"What joints do you use most?", k:["joinery","wood joints","types of joints","joint types","best joint","strongest joint"], a:["Dados and rabbets for boxes, pocket screws for face frames, dovetails for drawers and mortise and tenon for doors.","It depends on the job. Strength, looks and speed all decide which joint wins.","Every joint has a place. A clean dado in plywood is as satisfying as a hand cut dovetail."], more:["Glue surface matters most. Long grain to long grain is strong, end grain barely holds glue at all.","Mechanical locking, like a dovetail, adds strength even if the glue fails."], ex:["For example, in the cabinet I'm building: dados hold the bottom, a rabbet holds the back, and the drawer front is dovetailed."], why:["Because the right joint makes a piece last generations."] },
    { id:"dovetail", q:"What is a dovetail joint?", k:["dovetail","dovetails","dove tail","dovetail joint","drawer joint","hand cut dovetails","half blind dovetails"], a:["Interlocking tails and pins shaped like a bird's tail. Once glued, they can't pull apart in one direction.","It's the classic drawer joint. Strong, beautiful and a sign of careful work.","Dovetails resist pulling, which is exactly what a drawer front feels every time you open it."], more:["Half blind dovetails hide the joint from the front, so you only see it from the side of the drawer.","I cut them by hand or with a router and jig. Hand cut ones have a little more personality."], ex:["For example, a drawer with dovetailed corners can be yanked open for decades without loosening."], why:["Because the wedge shape locks mechanically, not only with glue."] },
    { id:"mortise-tenon", q:"What is a mortise and tenon joint?", k:["mortise and tenon","mortise","tenon","mortice","tenon joint","frame joint"], a:["A tenon is a tongue on the end of one part that fits into a hole, the mortise, in another. Very strong.","It's the backbone of doors, tables and chairs. Lots of glue surface and mechanical strength.","One of the oldest joints there is, and still one of the best."], more:["The tenon is usually about a third of the thickness of the board, leaving strong walls on both sides of the mortise.","A good fit slides in with hand pressure. Too tight splits the mortise, too loose starves the glue."], ex:["For example, the rails and stiles of a heavy frame and panel door are often joined with mortise and tenon."], why:["Because it handles twisting and racking forces better than most joints."] },
    { id:"dados", q:"What is a dado?", k:["dado","dados","dadoes","dado joint","housing joint","shelf groove","dado blade"], a:["A dado is a flat bottomed groove cut across the grain. Shelves and cabinet bottoms sit in it.","It's the workhorse of cabinet boxes. It locates the part and gives plenty of glue surface.","A shelf in a dado isn't going anywhere. It's like a little ledge built into the side."], more:["I cut dados on the table saw with a dado stack or with a router and a straight edge.","Plywood often runs thinner than its label, so I size the dado to the actual sheet."], ex:["For example, the bottom of my current cabinet sits in dados cut into both side panels."], why:["Because it makes assembly square and simple, and adds strength."] },
    { id:"rabbets", q:"What is a rabbet joint?", k:["rabbet","rabbets","rebate","rabbet joint","back panel groove","l shaped cut"], a:["A rabbet is an L shaped step cut along an edge. Cabinet backs often sit in one.","It's like a dado with one wall missing. Simple, quick and useful.","Rabbets hide the edge of a back panel and help square up the box."], more:["I cut them with a router, a table saw or a rabbet plane, depending on the part.","A rabbeted back lets the cabinet sit tight to the wall with the back panel recessed."], ex:["For example, the back of the cabinet I'm building sits in rabbets along the sides and top."], why:["Because it gives extra glue surface and hides edges."] },
    { id:"biscuits", q:"What are biscuit joints?", k:["biscuit","biscuits","biscuit joint","biscuit joiner","plate joiner","football shaped"], a:["Small football shaped wafers of compressed wood that fit into matching slots. Great for alignment.","Biscuits mainly line up parts during glue-ups. They add a bit of strength too.","When the glue hits them they swell, so the joint tightens up nicely."], more:["They're handy for edge joining panels and attaching face frames where alignment matters more than strength.","Don't rely on them as the only joint where real strength is needed."], ex:["For example, when gluing up a wide panel, biscuits keep the boards flush so I sand less."], why:["Because they make alignment fast and accurate."] },
    { id:"dowels", q:"Are dowel joints strong?", k:["dowel","dowels","dowel joint","dowelling","doweling jig","wood pins"], a:["Yes, when they're accurate. Round pins glued into matching holes in both parts.","Dowels are simple and strong, but the holes must line up perfectly. A jig makes all the difference.","They're a classic alternative to mortise and tenon in many frames and carcasses."], more:["Fluted dowels let excess glue escape so the joint doesn't build up pressure.","I use two dowels per joint at least, so the parts can't twist around a single pin."], ex:["For example, cabinet shelves often rest on short metal or wooden pins in drilled holes, a cousin of the dowel."], why:["Because they're quick to make and give solid alignment and strength."] },
    { id:"pocket-screws", q:"What are pocket screws?", k:["pocket screw","pocket screws","pocket hole","pocket holes","pocket jig","angled screw"], a:["An angled hole drilled into one part, then a screw that pulls it tight to the other. Fast and strong.","They're my favorite for face frames. Quick to build and hidden on the back.","Pocket screws don't need clamps to hold while glue dries. The screw is the clamp."], more:["Use the right screw: coarse thread for soft woods and plywood, fine thread for hardwoods.","Clamp the parts flat while driving, or the joint can creep out of alignment."], ex:["For example, the face frame for my current cabinet will be assembled with pocket screws on the back side."], why:["Because they're fast, strong and need very little setup."] },
    { id:"box-joints", q:"What is a box joint?", k:["box joint","box joints","finger joint","finger joints","comb joint","square fingers"], a:["Interlocking square fingers. Think of a dovetail without the angle.","Box joints are strong because of all that glue surface, and they look great on boxes and drawers.","They're easy to make with a simple jig on the table saw or router table."], more:["A tight fit is key. Too loose and they rattle, too tight and you'll split something during assembly.","They don't lock mechanically like dovetails, so the glue does the holding."], ex:["For example, a shop toolbox with box joints at every corner can take years of rough use."], why:["Because they're strong, decorative and quick to cut with a jig."] },
    { id:"tongue-groove", q:"What is tongue and groove?", k:["tongue and groove","tongue","groove","t and g","panel joint","interlocking boards"], a:["One board has a tongue on its edge, the next has a groove. They fit together into a wide panel.","It's common in back panels, paneling and floors. The boards can move without opening gaps.","It's one of those simple joints that solved a big problem: wide panels from narrow boards."], more:["For cabinet backs, I don't glue tongue and groove boards. They need room to move.","A small chamfer along the edges hides any seasonal gaps and gives a nice shadow line."], ex:["For example, a beadboard style back on an open cabinet is often tongue and groove."], why:["Because it lets wood move while keeping the surface closed."] },
    { id:"glue-types", q:"What glue do you use?", k:["wood glue","glue types","yellow glue","pva glue","hide glue","epoxy","polyurethane glue"], a:["Mostly yellow wood glue. Strong, easy cleanup and fast setting.","For long assemblies I use slower glue so I have more time. For gaps or oily woods, epoxy.","Hide glue for some fine work. It's reversible with heat and moisture, which is nice for repairs."], more:["Glue works best on fresh, tight fitting wood surfaces. It doesn't fill gaps well, except epoxy.","Check the open time on the bottle. Some glues give you minutes, some much longer."], ex:["For example, for a big carcass glue-up with many joints, I pick a slower setting glue so I'm not racing."], why:["Because the right glue gives you strength and enough working time."] },
    { id:"glue-up", q:"Any tips for a good glue-up?", k:["glue up","glue-up","glueup","gluing","clamping up","dry fit","squeeze out"], a:["Always dry fit first. If it doesn't go together dry, it won't go together wet.","Have every clamp ready, set and nearby before glue touches wood.","A bit of squeeze-out along every joint tells me there's enough glue. Too much just makes a mess."], more:["I let squeeze out get rubbery, then pare it off with a chisel. Wiping wet glue can smear it into the grain and spoil the stain.","I check square and flat before the glue sets. Once it's set, it's set."], ex:["For example, for a cabinet box I rehearse the whole assembly dry and number each part before mixing anything."], why:["Because a glue-up is the one step you can't pause halfway."] },
    { id:"clamps", q:"How many clamps do you need?", k:["clamps","clamp","bar clamps","pipe clamps","parallel clamps","f clamps","clamping"], a:["Always one more than you have. That's the rule in every shop.","Bar clamps, pipe clamps, parallel clamps and a bucket of small ones. Each one has a job.","Clamps are like friends: you find out who's reliable during a glue-up."], more:["Parallel clamps keep pressure square, which helps with cabinet boxes and panels.","I use cauls, straight boards between clamp and work, to spread pressure and keep panels flat."], ex:["For example, a cabinet box can need eight or ten clamps at once just for the main joints."], why:["Because even pressure is what makes a tight, strong glue line."] },
    { id:"sanding", q:"What sanding grits do you use?", k:["sanding","sandpaper","sanding grit","grits","sanding sequence","random orbit sander","sander"], a:["I usually go 120, 150, 180. Sometimes 220 for a fine finish.","Start coarse enough to remove marks, then step up without skipping. Each grit erases the last one's scratches.","For paint, stop around 180. For oil or clear finishes, I go a bit finer."], more:["Skipping grits leaves deeper scratches that show up when finish goes on.","I wipe the dust between grits so loose grit doesn't scratch the surface."], ex:["For example, after milling a door, I start at 120 to remove machine marks, then 150 and 180 before finish."], why:["Because sanding in steps gives a smooth, even surface that takes finish well."] },
    { id:"sanding-tips", q:"How do you sand without leaving swirl marks?", k:["swirl marks","sanding marks","sanding scratches","hand sanding","sanding block","sanding tips"], a:["Let the sander do the work. Light pressure, slow passes and keep it flat.","Finish by hand with the grain at your last grit. It removes those little swirls.","Pencil marks help: scribble the surface lightly and sand until they're gone evenly."], more:["Lifting or tilting the sander creates dips and swirls, especially near edges.","I use a raking light from the side to spot scratches before finishing."], ex:["For example, I hold a work light low across a panel and every swirl shows up like a shadow."], why:["Because finish magnifies every scratch you leave behind."] },
    { id:"planing", q:"What does planing do?", k:["planing","plane wood","flatten board","thickness planer","jointer","milling lumber","surfacing"], a:["Planing flattens and smooths boards and brings them to the exact thickness I need.","First I flatten one face on the jointer, square an edge, then plane the other face parallel.","It's how rough lumber becomes square, straight parts ready for joinery."], more:["The jointer creates a flat reference, the thickness planer makes the other face parallel to it.","Taking light passes avoids tearout and snipe at the ends."], ex:["For example, a rough board starts uneven and fuzzy, and a few passes later it's smooth and exactly the thickness I need."], why:["Because joinery only works on flat, square stock."] },
    { id:"hand-plane-vs-power", q:"Hand plane or power planer?", k:["hand plane","power planer","block plane","smoothing plane","jack plane","hand planing"], a:["Both. The machine does the heavy lifting, the hand plane does the fine work.","A power planer is fast for removing lots of wood. A hand plane leaves a finer surface and gives more control.","For big stock removal, the machine. For fitting a door or smoothing a tricky board, my hand plane."], more:["A sharp, well set smoothing plane can leave a surface that needs little or no sanding.","The jack plane is the all-rounder. If I could keep only one, it would probably be that."], ex:["For example, I mill boards on the machines, then use a hand plane to fit a door edge to the opening."], why:["Because each one is best at different parts of the job."] },
    { id:"chisels", q:"How do you use chisels?", k:["chisel","chisels","bench chisel","paring chisel","mortise chisel","chopping"], a:["For cleaning out joints, paring to a line and fitting parts. Keep them sharp and keep both hands behind the edge.","I pare thin slices with hand pressure, and chop deeper cuts with a mallet.","A chisel is only as good as its edge. A dull one tears instead of cuts."], more:["Bevel down for rough work, bevel up for fine paring. It changes how the chisel rides through the cut.","Always cut away from your body and keep the work clamped."], ex:["For example, I clean the waste between dovetail pins with a chisel and mallet, working from both sides."], why:["Because a chisel gives control that no machine can match for fine fitting."] },
    { id:"sharpening", q:"How do you sharpen chisels and plane irons?", k:["sharpening","sharpen","sharp edge","whetstone","honing","sharpening stones","dull blade"], a:["On stones, from coarse to fine, then a quick strop. A mirror finish on the edge means it's ready.","Flatten the back once, then hone the bevel each time. A honing guide makes it consistent.","Sharp tools are safer. You push less, so you slip less."], more:["The edge is where two polished surfaces meet. Both faces need to be smooth for a truly sharp edge.","I touch up edges often instead of letting them get really dull. It's faster that way."], ex:["For example, a quick hone between tasks keeps my plane cutting clean shavings all day."], why:["Because sharp tools cut cleaner, faster and safer."] },
    { id:"table-saw", q:"What do you use the table saw for?", k:["table saw","tablesaw","rip cut","ripping","saw fence","rip fence"], a:["Ripping boards to width, cutting sheet goods and cutting dados. It's the heart of the shop.","Straight, accurate cuts. With a good fence and sled, it's incredibly precise.","Most of my parts pass through the table saw at some point."], more:["A crosscut sled holds parts square for accurate crosscuts, and keeps my hands far from the blade.","I keep the blade clean and sharp, and I follow the manual for setup and guard use."], ex:["For example, every plywood part for my current cabinet was ripped and crosscut on the table saw."], why:["Because it's the most accurate way to make straight, repeatable cuts."] },
    { id:"miter-saw", q:"What is a miter saw good for?", k:["miter saw","mitre saw","chop saw","crosscut saw","miter cuts","angle cuts"], a:["Fast, accurate crosscuts and angle cuts. Great for trim and cutting boards to length.","It's my go-to for cutting rails and stiles to length quickly.","For molding and trim work at installs, it's essential."], more:["A stop block lets me cut many parts to the exact same length without measuring each one.","Let the blade reach full speed before cutting, and let it stop before lifting."], ex:["For example, for a face frame with four rails, I set a stop and cut them all identical."], why:["Because it makes repetitive crosscuts fast and consistent."] },
    { id:"circular-saw", q:"When do you use a circular saw?", k:["circular saw","skill saw","circ saw","portable saw","breaking down plywood","track saw"], a:["For breaking down big sheets of plywood before they go on the table saw.","It's portable, so it comes with me on installs too.","With a straight edge guide, it makes clean, straight cuts on full sheets."], more:["Support the sheet on both sides of the cut so the blade doesn't pinch.","Cut with the good face down, because the blade exits on the top side and can splinter it."], ex:["For example, I lay a full sheet on foam boards on the floor and cut it into manageable pieces with a guide."], why:["Because handling full sheets on a table saw alone is awkward."] },
    { id:"hand-saw", q:"Do you still use hand saws?", k:["hand saw","handsaw","dovetail saw","backsaw","japanese saw","pull saw"], a:["Yes. Dovetails, small trims and quick cuts. It's quiet and accurate.","A good backsaw cuts joinery cleaner than many machines.","Hand saws teach you to cut straight. That skill helps with every other tool."], more:["Pull saws cut on the pull stroke, so the blade can be thinner and very precise.","Let the saw do the work. Pushing harder only makes it wander."], ex:["For example, I cut the tails of a drawer's dovetails by hand with a small backsaw."], why:["Because for fine joinery, control beats speed."] },
    { id:"jigsaw", q:"What is a jigsaw used for?", k:["jigsaw","jig saw","curved cuts","cutouts","sink cutout","scroll cuts"], a:["Curves and cutouts. Things a straight saw can't do.","I use it for sink openings, outlet cutouts and curved parts.","It's not the most accurate tool, but it goes where others can't."], more:["Choose the blade to match the material and cut: fine teeth for a clean edge, coarse for speed.","Clamp the work and keep the base flat on the surface."], ex:["For example, cutting an opening for pipes in the back of a sink base cabinet."], why:["Because sometimes the cut just isn't straight."] },
    { id:"band-saw", q:"What do you use a band saw for?", k:["band saw","bandsaw","resawing","resaw","cutting curves","thin boards"], a:["Curves, resawing thick boards into thinner ones, and rough shaping.","Resawing is the band saw's magic trick: one thick board becomes two matching thin ones.","It's quieter and safer feeling for many cuts, because the blade pushes the work down onto the table."], more:["Book matching comes from resawing a board and opening it like a book.","Blade tension and tracking matter a lot. I check them and follow the manual for setup."], ex:["For example, I can resaw a thick walnut board into two panels for a pair of matching doors."], why:["Because it cuts thick stock and curves that other saws can't handle well."] },
    { id:"router", q:"What do you use a router for?", k:["router","routers","router table","plunge router","trim router","routing"], a:["Edges, grooves, dados, rabbets, profiles, flush trimming. It's the most versatile power tool in the shop.","With the right bit and a guide, a router can make almost any joint or edge.","I use a trim router for small jobs and a bigger router in a table for heavier work."], more:["Take light passes. Several shallow cuts are cleaner and safer than one deep one.","Feed direction matters: against the bit rotation, so the bit doesn't grab and run."], ex:["For example, I trim the face frame flush with the cabinet sides using a flush-trim bit."], why:["Because one tool can handle dozens of different tasks."] },
    { id:"router-bits", q:"What router bits are most useful?", k:["router bits","router bit","flush trim bit","straight bit","roundover bit","chamfer bit","profile bit"], a:["Straight bit, flush-trim bit, roundover and chamfer. Those four cover most jobs.","A pattern bit for templates and a rabbeting bit with bearings come right after.","For doors, matched rail and stile bits make shaker frames easy."], more:["Carbide bits stay sharp much longer, and a clean bit cuts cooler and cleaner.","Bearing guided bits follow an edge or a template, so they're great for copying shapes."], ex:["For example, a small roundover on a shelf edge feels nicer to the hand and resists chipping."], why:["Because a few good bits do most of the work."] },
    { id:"drills-drivers", q:"Drill or impact driver?", k:["drill","drills","impact driver","driver","cordless drill","drill bits","pilot hole"], a:["A drill for holes, a driver for screws. I keep both on the bench.","The drill with a clutch is better for delicate screws in hardwood, the impact driver for long screws.","I almost always drill a pilot hole first. It prevents splitting and keeps screws straight."], more:["A countersink bit lets screw heads sit flush with the surface.","Set the clutch low for small screws so they don't strip or snap."], ex:["For example, installing hinges, I use the drill with a low clutch setting so the tiny screws don't strip."], why:["Because the right tool keeps screws straight and wood intact."] },
    { id:"hammers-nails", q:"Do you still use hammers and nails?", k:["hammer","hammers","nails","nail gun","brad nailer","finish nails","mallet"], a:["Yes, for trim and quick holds. But in cabinets, glue and screws do most of the work.","A brad nailer holds parts while glue dries. Small holes, easy to fill.","My mallet gets more use than my hammer. It's for chisels and tapping joints home."], more:["Nails at slight opposing angles hold better than straight ones.","For fine work I set nail heads below the surface and fill the holes."], ex:["For example, I use small brads to hold a cabinet back while the glue dries."], why:["Because nails are fast, but glue and joinery are where real strength comes from."] },
    { id:"screws", q:"What screws do you use in cabinets?", k:["screws","wood screws","cabinet screws","screw types","countersink","stripped screw"], a:["Wood screws with a good thread for the material. Coarse for plywood and softwood, finer for hardwood.","For hanging cabinets I use strong screws made for that job, driven into studs.","Pilot holes, the right length, and don't overtighten. That's most of it."], more:["A stripped hole can be fixed with glue and a wooden plug or toothpicks, then redrilled.","Square or star drive heads slip less than the old slotted ones."], ex:["For example, screwing a cabinet to a wall, I go through the rail at the back into the stud, not into drywall."], why:["Because the wrong screw can split wood or pull out under load."] },
    { id:"hinges", q:"What kind of hinges do you use?", k:["hinges","hinge","concealed hinges","european hinges","euro hinges","butt hinges","cup hinge"], a:["Mostly concealed European hinges for modern cabinets. Hidden, adjustable and soft close if you want.","For traditional pieces, I like butt hinges set in a small mortise. Classic look.","Euro hinges are a cabinet maker's best friend. You can adjust a door in three directions with a screwdriver."], more:["Concealed hinges need a round cup hole drilled in the door. A jig keeps the placement accurate.","Butt hinges need careful mortising so the door hangs flush and closes without binding."], ex:["For example, the door on my current cabinet will hang on two concealed hinges with soft close."], why:["Because the hinge decides how the door looks and how easily it can be adjusted later."] },
    { id:"drawer-slides", q:"What drawer slides do you prefer?", k:["drawer slides","drawer slide","drawer runners","full extension","soft close slides","undermount slides","side mount"], a:["Full extension slides so you can reach the back of the drawer. Soft close if the job calls for it.","Undermount slides hide under the drawer and look cleaner. Side mount are simpler and very sturdy.","Slides need precise spacing. A few millimeters off and they bind."], more:["Drawer boxes must be built to the exact width the slides require. I check the slide instructions before cutting.","Wooden runners are traditional and quiet, but they need wax and careful fitting."], ex:["For example, a deep pot drawer in a kitchen base cabinet works best with heavy duty full extension slides."], why:["Because a smooth drawer is something people notice every day."] },
    { id:"drawer-construction", q:"How do you build a drawer?", k:["drawer construction","build a drawer","drawer box","drawer front","drawer bottom","making drawers"], a:["Four sides joined at the corners, a bottom panel in a groove, then the front attached or built in.","I like dovetails at the corners and a plywood bottom that slides into a groove.","Build the box square, fit it to the slides, and then attach the front so the gaps are even."], more:["A separate false front lets me adjust the front position after the box is installed.","The bottom floats in a groove so it can move, and it's screwed only at the back."], ex:["For example, my current cabinet's drawer gets a dovetailed box with a separate front for perfect alignment."], why:["Because a square box is the key to smooth sliding."] },
    { id:"face-frame-vs-frameless", q:"Face frame or frameless cabinets?", k:["face frame","frameless","face frame vs frameless","european cabinets","framed cabinets","full overlay"], a:["Face frame cabinets have a solid wood frame on the front, more traditional. Frameless cabinets show only the box edges, more modern.","Face frames add strength and hide plywood edges. Frameless give slightly more interior space.","Both are good. It's a style choice as much as a construction choice."], more:["Frameless cabinets usually use full overlay doors that cover the whole front.","Face frames give a place to scribe against walls and help square up the box."], ex:["For example, my current cabinet has a face frame because the kitchen it's for has a classic style."], why:["Because the front style decides how doors and drawers fit and how the cabinets look."] },
    { id:"carcass", q:"What is a cabinet carcass?", k:["carcass","carcase","cabinet box","casework","cabinet construction","case construction"], a:["It's the box: sides, bottom, top or stretchers, and back. Everything else hangs on it.","The carcass is the skeleton of a cabinet. If it's square, everything else is easy.","Mostly plywood, joined with dados and rabbets, glued and screwed."], more:["The back panel stiffens the box and keeps it square, so it's more important than it looks.","Base cabinets usually have stretchers instead of a full top, since the countertop covers it."], ex:["For example, a base cabinet carcass has two sides, a bottom, front and back stretchers, a back and a toe kick."], why:["Because a solid, square box is the foundation for doors and drawers."] },
    { id:"cabinet-doors", q:"What door styles do you make?", k:["cabinet doors","door styles","shaker door","slab door","raised panel","flat panel door","inset doors"], a:["Shaker, slab and raised panel. Shaker is the most popular by far.","Shaker doors are a simple frame with a flat panel. Clean and timeless.","Slab doors are flat with no frame. Very modern. Raised panel doors are more traditional."], more:["Frame and panel doors let the panel float so the door stays flat as the wood moves.","Inset doors sit inside the face frame and need very precise, even gaps."], ex:["For example, the door on my current cabinet is a shaker door with a flat center panel."], why:["Because the door style defines the whole look of a kitchen."] },
    { id:"kitchen-cabinets", q:"What are the main kitchen cabinet types?", k:["kitchen cabinets","base cabinet","wall cabinet","tall cabinet","upper cabinets","lower cabinets","pantry cabinet"], a:["Base cabinets on the floor, wall cabinets on the wall, and tall cabinets like pantries that go floor to ceiling.","Base cabinets hold the countertop, wall cabinets hold dishes, tall cabinets hold everything else.","Three families, and countless sizes and versions in each."], more:["Base cabinets are deeper than wall cabinets, so the countertop has room and the wall cabinets don't hit your head.","Tall cabinets are great for pantries and built-in ovens."], ex:["For example, the cabinet I'm building is a base cabinet with a drawer over a door."], why:["Because each type has a different job in the kitchen."] },
    { id:"standard-heights", q:"What are standard cabinet heights?", k:["standard height","cabinet height","counter height","cabinet dimensions","standard sizes","cabinet depth"], a:["Base cabinets are usually around 34 and a half inches tall, so with a countertop the work surface lands near 36 inches.","Wall cabinets usually start about 18 inches above the counter. Depths are roughly 24 inches for base, 12 for wall.","Those are common standards, but I always check the room and the person's needs."], more:["Standards exist so appliances and countertops fit, but custom work can adjust them.","Toe kicks are recessed at the bottom so you can stand close without stubbing your toes."], ex:["For example, a taller person might want slightly higher counters, so I adjust the base height."], why:["Because standards make sure appliances and countertops fit together."] },
    { id:"countertops", q:"How do cabinets work with countertops?", k:["countertop","countertops","counter top","worktop","countertop install","counter overhang"], a:["Base cabinets must be level and square so the countertop sits flat and supported.","I leave the tops open with stretchers so the countertop can be attached from below.","The countertop usually overhangs the front by a little so drips miss the cabinet doors."], more:["Heavy tops like stone need cabinets that are perfectly level and well supported.","Sink bases need openings for plumbing and space for the sink basin."], ex:["For example, before the countertop goes on, I check level across the entire run of base cabinets."], why:["Because an unlevel base makes countertops crack or rock."] },
    { id:"installing-cabinets", q:"How do you install cabinets?", k:["installing cabinets","cabinet install","install","hanging cabinets","mounting cabinets","installation"], a:["Find the high point of the floor, mark a level line, find the studs, then set and fasten cabinets one by one.","Wall cabinets first usually, so I'm not leaning over the base cabinets. Then the bases.","Level, plumb, fasten, check, repeat. And breathe."], more:["I screw cabinets together through the face frames or sides before fastening them to the wall.","Shims fill gaps behind and under cabinets so screws don't pull them out of shape."], ex:["For example, I start a run from a corner, level the first cabinet perfectly, then line up the rest to it."], why:["Because a well installed cabinet works smoothly for decades."] },
    { id:"leveling-shimming", q:"How do you level cabinets?", k:["leveling","level cabinets","shimming","shims","plumb","uneven floor","spirit level"], a:["Shims under and behind the cabinet until it's level front to back and side to side.","A good level and patience. I check every cabinet in both directions.","Floors are never flat. Shims are how I convince the cabinet otherwise."], more:["I find the high point on the floor and level everything to that, shimming up the low spots.","Shims get trimmed flush and hidden by the toe kick or trim."], ex:["For example, in one kitchen the floor dropped noticeably from one end to the other, so the last cabinet sat on stacked shims."], why:["Because doors and drawers only work right in a level, plumb box."] },
    { id:"finding-studs", q:"How do you find studs?", k:["finding studs","stud finder","wall studs","studs","drywall anchors","fastening to wall"], a:["Stud finder, tapping the wall and looking for nails in the baseboard. I use all three.","Once I find one, the next is usually at a regular spacing. I confirm with a small test hole hidden behind the cabinet.","Wall cabinets get screwed into studs, never just into drywall."], more:["Outlet boxes are usually attached to studs, so they're a good clue.","I mark stud locations on the wall above where the cabinets will go."], ex:["For example, I drive a thin nail where the cabinet will cover it. If it hits wood, I've found my stud."], why:["Because cabinets full of dishes are heavy, and drywall alone won't hold them."] },
    { id:"scribing", q:"What is scribing?", k:["scribing","scribe","scribe to wall","scribe strip","filler strip","uneven wall"], a:["Tracing the shape of a wall onto a piece so it can be cut to fit perfectly against it.","It's how I hide wavy walls. The cabinet follows the wall instead of leaving a gap.","A compass, a pencil and a block plane. That's my scribing kit."], more:["I leave extra wood on the side of the face frame or a filler strip for scribing.","Back beveling the scribe cut makes it easier to fit tight against the wall."], ex:["For example, a filler strip next to a wall can be scribed to follow a bowed wall exactly."], why:["Because walls are rarely straight, and gaps look sloppy."] },
    { id:"templates", q:"Do you use templates?", k:["templates","template","jig","jigs","pattern routing","shop jig","making templates"], a:["All the time. A template lets me cut the same shape again and again.","With a router and a pattern bit, a template turns into copies quickly and accurately.","Jigs and templates are my secret helpers. They take time to make and save even more."], more:["I make templates from MDF or plywood because they're stable and smooth.","On installs, I make templates of tricky areas like corners or pipes before cutting real parts."], ex:["For example, for a curved toe kick on several cabinets, I make one template and trace it on all of them."], why:["Because templates make repeating parts accurate and fast."] },
    { id:"finishes-overview", q:"What finishes do you use?", k:["finishes","wood finish","finishing","clear coat","topcoat","protective finish"], a:["Oil, wax, polyurethane, lacquer and paint. Each one fits a different use.","For kitchens, I want something tough, so poly or lacquer. For furniture, oil looks warm and natural.","Finish is the skin of the wood. It protects it and shows off its looks."], more:["Film finishes like poly sit on top. Oil finishes soak in. They look and feel different.","Always test on scrap of the same wood first. Finish can surprise you."], ex:["For example, kitchen cabinets get a hard film finish because they deal with water, grease and hands."], why:["Because the right finish depends on how the piece will be used."] },
    { id:"oil-wax", q:"What about oil and wax finishes?", k:["oil finish","danish oil","linseed oil","tung oil","wax finish","paste wax","hardwax oil"], a:["Oil soaks into the wood and brings out the grain. Very natural look and easy to repair.","Wax adds a soft sheen and smooth feel, usually over another finish.","Oil finishes are my favorite for walnut and cherry furniture. They just glow."], more:["Oil offers less protection than a film finish, so it's better for pieces that don't see lots of water.","Rags soaked with drying oils can heat up and catch fire by themselves. I lay them flat to dry outside, following the product label."], ex:["For example, a cherry side table with a few coats of oil and a final wax feels silky to the touch."], why:["Because it's simple, beautiful and easy to maintain."] },
    { id:"polyurethane-lacquer", q:"Polyurethane or lacquer?", k:["polyurethane","poly","lacquer","varnish","spray finish","water based finish"], a:["Poly is tough and easy to brush. Lacquer dries fast and sprays beautifully.","For kitchens, either works if applied well. Poly is more forgiving with a brush.","Lacquer is a pro favorite for cabinets because coats build quickly and can be repaired."], more:["Water based finishes stay clear and don't yellow, which is nice on light woods like maple.","Oil based finishes add warmth and a slight amber tone."], ex:["For example, on maple cabinets I use a water based finish so they stay light instead of turning yellow."], why:["Because durability and look both matter, and each finish balances them differently."] },
    { id:"paint", q:"How do you paint cabinets?", k:["paint","painting cabinets","painted cabinets","primer","cabinet paint","spray paint"], a:["Smooth surfaces, a good primer, light sanding between coats and a durable paint made for cabinets.","Spraying gives the smoothest finish. A good brush and roller can also do a great job.","Paint shows every flaw, so prep is ninety percent of the work."], more:["Fill nail holes and seams first, prime, sand lightly, then two or more topcoats.","Let paint cure fully before heavy use. Dry to the touch isn't fully hard."], ex:["For example, the poplar face frame on my current cabinet will be primed and painted with two coats."], why:["Because a painted cabinet is only as smooth as the surface underneath."] },
    { id:"stain", q:"How do you stain wood evenly?", k:["stain","staining","wood stain","gel stain","blotchy stain","stain color"], a:["Sand evenly, use a conditioner on blotchy woods, and wipe off excess stain before it dries.","Test on scrap from the same boards. Stain on a sample chip never looks the same as on your wood.","Gel stain is easier on tricky woods like pine, maple and cherry."], more:["End grain soaks up more stain, so I sand it finer or seal it a little first.","Stain is color only. It still needs a protective topcoat."], ex:["For example, I make a sample board with stain and finish together so the final color is clear before committing."], why:["Because blotchy stain is one of the hardest mistakes to fix."] },
    { id:"finishing-tips", q:"Any finishing tips?", k:["finishing tips","finish tips","between coats","dust nibs","brush marks","thin coats"], a:["Thin coats, plenty of drying time, and light sanding between coats.","Work in a clean, dust free space. Dust in wet finish is the enemy.","Raise the grain with a damp cloth before finishing, then sand lightly. The finish stays smoother."], more:["A good light at a low angle shows runs, drips and missed spots while the finish is still wet.","Follow the drying times on the can. Rushing causes soft, cloudy or wrinkled finishes."], ex:["For example, after the first coat, I lightly sand with fine paper to remove dust nibs before the next coat."], why:["Because good finishing is mostly patience and cleanliness."] },
    { id:"dust-collection", q:"How do you deal with dust?", k:["dust collection","dust collector","shop vac","dust extraction","air filter","fine dust"], a:["A dust collector on the big machines, a shop vacuum on the sanders and an air filter running overhead.","Collect dust at the source. Sweeping later is too late for the fine stuff.","Dust is a health issue, not just a cleaning issue."], more:["Fine dust is the most dangerous because it floats and goes deep into lungs. Good collection and a mask together.","I empty the collector before it's full, because suction drops a lot as it fills."], ex:["For example, my random orbit sander connects to a shop vacuum, so almost no dust escapes."], why:["Because clean air keeps me healthy and finishes clean."] },
    { id:"sawdust", q:"What do you do with all the sawdust?", k:["sawdust","saw dust","wood shavings","shavings","wood chips","sawdust uses"], a:["Some goes to compost or garden mulch, some becomes wood filler mixed with glue.","Fine sawdust from a project mixed with glue makes filler that matches the color.","It gets everywhere. I've found it in places I didn't know I had."], more:["Shavings make good animal bedding or garden mulch, depending on the wood type.","Treated wood and MDF dust should not go into compost."], ex:["For example, I keep a jar of walnut dust to mix with glue for filling small gaps in walnut pieces."], why:["Because good material shouldn't go to waste."] },
    { id:"shop-cleaning", q:"How do you keep the shop clean?", k:["shop cleaning","cleaning the shop","clean up","sweeping","tidy shop","clean workshop"], a:["Clean as I go, and a full sweep at the end of every day.","Dust collection does most of it. A broom and a vacuum do the rest.","A clean shop is a safer shop. Offcuts on the floor are tripping hazards."], more:["I vacuum before finishing so dust doesn't drift into wet finish.","I clean blades and bits regularly. Resin buildup makes them cut hot and rough."], ex:["For example, I spend the last few minutes of each day putting tools back and sweeping."], why:["Because clutter leads to accidents and lost tools."] },
    { id:"workshop-organization", q:"How is your workshop organized?", k:["workshop organization","shop layout","organize tools","tool storage","shop setup","workflow layout"], a:["Lumber comes in one side, gets milled, then moves to assembly and finally to finishing. A straight path.","Tools live near where they're used. Clamps by the assembly table, chisels by the bench.","Everything has a place. If it doesn't, it ends up on the bench, and the bench disappears."], more:["The big machines need space around them for long boards to feed in and out.","I keep finishing in a separate corner to keep dust away."], ex:["For example, my lumber rack is near the door, the saws are in the middle, and finishing is at the far end."], why:["Because a good flow saves steps and keeps things safe."] },
    { id:"pegboard", q:"Why do you use a pegboard?", k:["pegboard","peg board","tool wall","hanging tools","tool board","shadow board"], a:["Every tool is visible and within reach. And I can see right away what's missing.","I draw outlines around tools so they always go back to the same spot.","A pegboard is cheap, flexible and easy to rearrange as the shop changes."], more:["Hooks can wiggle loose, so I secure them so they don't fall when I grab a tool.","I keep the most used tools at eye level and rarely used ones higher."], ex:["For example, my squares, chisels and marking tools hang right above my workbench."], why:["Because seeing tools saves time searching for them."] },
    { id:"workbench", q:"What makes a good workbench?", k:["workbench","work bench","bench","bench vise","bench height","bench top"], a:["Heavy, flat and steady. It shouldn't move when I plane or hammer on it.","A good vise and a way to hold work securely. Holdfasts and dogs are very useful.","The bench is the center of the shop. Everything happens around it."], more:["Height matters: about where your palms are with your arms hanging down works well for hand tools.","A flat top is important for assembly. I flatten mine every now and then."], ex:["For example, my bench is heavy hardwood with a front vise and an end vise for holding boards to plane."], why:["Because you can't do accurate work on a wobbly surface."] },
    { id:"lumber-rack", q:"How do you store wood planks?", k:["lumber rack","wood rack","storing lumber","plank storage","wood storage","offcuts bin"], a:["On a wall rack, flat and supported every couple of feet so they don't sag.","Long boards on the rack, sheet goods on edge, offcuts in a bin sorted by size.","Stored right, wood stays flat. Stored wrong, it becomes firewood."], more:["I keep lumber off the floor and away from damp walls.","Sheet goods can bow if they lean too much, so I store them nearly vertical or flat."], ex:["For example, the planks over there are on brackets every two feet, sorted by species."], why:["Because good storage keeps boards straight and easy to find."] },
    { id:"carrying-planks", q:"How do you carry long planks safely?", k:["carrying planks","carry boards","lifting wood","heavy lifting","moving sheets","plank handling"], a:["Lift with your legs, keep the board close and watch the ends when turning.","Long planks are like swords. I keep an eye on both ends so I don't hit anything or anyone.","For full sheets, a panel carrier or a second person makes it easy."], more:["Carrying long boards on your shoulder is easier than holding them at waist height.","Clear the path before lifting, so you're not stepping over clutter with your arms full."], ex:["For example, when I turn with a long board, I turn my whole body slowly and check the ends."], why:["Because backs and windows both appreciate care."] },
    { id:"saw-horse", q:"What are saw horses for?", k:["saw horse","sawhorse","sawhorses","saw horses","trestle","support stand"], a:["Portable supports for cutting, sanding and finishing big parts.","Two saw horses and a sheet of plywood make an instant work table.","They're simple, but I'd be lost without them on installs."], more:["Folding saw horses are great on job sites. Heavy wooden ones are steadier in the shop.","I use them to hold doors when finishing, so I can reach every edge."], ex:["For example, I lay cabinet doors across saw horses on padded strips to spray finish."], why:["Because they give flexible support anywhere."] },
    { id:"eye-ear-protection", q:"What safety gear do you wear?", k:["safety gear","eye protection","safety glasses","ear protection","hearing protection","goggles","earmuffs"], a:["Safety glasses always, hearing protection with loud machines, and a dust mask when sanding or cutting.","Eyes and ears don't grow back. I protect them every time.","Glasses go on when I walk in. They're part of the uniform."], more:["Loud machines can damage hearing over time without you noticing. Earmuffs or plugs fix that.","I also avoid loose sleeves, gloves near spinning blades and dangling jewelry. Follow each tool's manual for specifics."], ex:["For example, even for one quick cut, I put my glasses and ear protection on first."], why:["Because the quick cut without protection is the one that hurts."] },
    { id:"dust-masks", q:"Do you need a dust mask?", k:["dust mask","respirator","face mask","breathing protection","n95","mask"], a:["Yes, especially for sanding and cutting MDF. Fine dust is not something to breathe.","A good fitted mask or respirator, plus dust collection. Both together.","If you can see dust in the air, it's time for a mask."], more:["A simple paper mask is better than nothing, but a proper fitted respirator does much more.","Finishing products may need a respirator with the right cartridges. Check the label."], ex:["For example, when sanding walnut or MDF, I wear a fitted respirator."], why:["Because breathing fine dust is a slow, hidden risk."] },
    { id:"push-sticks", q:"What are push sticks?", k:["push stick","push sticks","push block","push blocks","featherboard","hands near blade"], a:["Simple tools that push the wood past the blade so my hands stay far away.","On the table saw, when the cut gets narrow, a push stick takes over from my fingers.","Cheap to make, priceless to use."], more:["Push blocks hold the board down and forward on the jointer and router table.","Featherboards hold the wood against the fence so I don't have to."], ex:["For example, ripping a thin strip, I switch to a push stick well before my hand gets close to the blade."], why:["Because fingers are not replaceable parts."] },
    { id:"blade-guards", q:"Do you use blade guards?", k:["blade guard","blade guards","riving knife","splitter","saw guard","guarding"], a:["Yes. The guard and riving knife stay on whenever the cut allows. Follow the saw's manual.","A riving knife keeps the cut open so the wood can't pinch the blade and kick back.","Guards may feel awkward at first, but you get used to them fast."], more:["Some cuts like dados need the guard removed. Those cuts need extra care and other safety aids, as the manual describes.","I put the guard back right after. It's easy to forget."], ex:["For example, every rip cut I make on the table saw happens with the riving knife in place."], why:["Because they prevent the most common table saw accidents."] },
    { id:"kickback", q:"What is kickback?", k:["kickback","kick back","saw kickback","board thrown","binding blade","pinched blade"], a:["When the blade catches the wood and throws it back toward you, fast and hard.","It happens when wood pinches the blade or twists between the blade and fence.","Respect kickback. Stand to the side of the blade line and use the riving knife."], more:["Never cut freehand on a table saw, and don't use the fence and miter gauge together for crosscuts.","Keep blades sharp and wood flat. Twisted boards bind more often. Follow the manual for your saw."], ex:["For example, a board with internal tension can close up behind the blade during a rip. The riving knife keeps it from pinching."], why:["Because it's the most common serious table saw hazard."] },
    { id:"finger-safety", q:"How do you keep your fingers safe?", k:["finger safety","keep fingers","fingers safe","hand safety","fingers clear","safe distance"], a:["Keep hands well away from blades and bits, use push sticks and never reach over a running blade.","I set a personal rule: if my hand gets close to the danger zone, I stop and rethink the cut.","Turn the machine off and wait for the blade to stop before clearing offcuts."], more:["I use clamps, jigs and sleds so small parts don't have to be held by hand.","Never cut tiny pieces on large machines. Cut them from a bigger board instead."], ex:["For example, to cut a small part, I cut it from a long board so my hands stay far from the blade."], why:["Because ten fingers is the best tool count you'll ever have."] },
    { id:"shop-safety-habits", q:"What are your shop safety habits?", k:["shop safety","safety rules","safety habits","safe workshop","machine safety","safety tips"], a:["Read the manual, use the guards, protect eyes and ears, and never work tired or rushed.","Unplug a machine before changing blades or bits. Every time.","A clean floor, good light and a clear head. That's half of shop safety."], more:["I never wear loose clothing near spinning tools and keep long hair tied back.","If a cut feels wrong, I stop. There's always another way to make it."], ex:["For example, before changing a router bit, I unplug the router, not just switch it off."], why:["Because good habits work even when attention slips."] },
    { id:"mistakes", q:"What do you do when you make a mistake?", k:["mistakes","mistake","fix mistakes","fixing errors","messed up","oops","wrong cut"], a:["Stop, breathe and figure out if I can fix it or if it's time for a new part.","Some mistakes become design features. A short part can sometimes become a smaller part elsewhere.","Everyone makes mistakes. The skill is hiding them so well nobody knows."], more:["Small gaps can be filled, dents can be steamed out, and tearout can sometimes be patched with a matching piece.","I keep a note of each mistake so I don't make it twice."], ex:["For example, a shelf cut too short became a drawer bottom for another cabinet."], why:["Because good work comes from good recovery, not from never failing."] },
    { id:"fixing-dents", q:"How do you fix dents and gaps?", k:["fixing dents","dent","dents","gaps","wood filler","patch","repair wood"], a:["Dents can often be raised with a damp cloth and a hot iron. The steam swells the fibers back up.","For gaps, glue and matching sawdust, or a thin sliver of wood glued in.","A patch made from the same board, with grain matched, can disappear completely."], more:["The steam trick works for dents where the fibers are crushed, not cut.","Wood filler takes stain differently than wood, so I test it first."], ex:["For example, a hammer dent on a pine shelf vanished after a few seconds of steam."], why:["Because a repaired piece doesn't need to start over."] },
    { id:"hand-vs-power", q:"Hand tools or power tools?", k:["hand tools vs power tools","hand tools","power tools","hand vs power","traditional woodworking","machine tools"], a:["Both. Power tools for speed and repeatability, hand tools for control and fine fitting.","Machines rough it out, hand tools make it fit. That's my balance.","Hand tools teach you how wood behaves. Power tools let you do more of it."], more:["Hand tools are quiet and safe feeling, but slower. Power tools need more care and safety gear.","For a single dovetail drawer, hand tools are often as fast as setting up a jig."], ex:["For example, I mill boards with machines, then fit the drawer with a hand plane."], why:["Because the best tool is the one that does the job well right now."] },
    { id:"quoting-projects", q:"How do you plan a quote for a project?", k:["quote","quoting","estimate","estimating","project estimate","bid"], a:["I break the project into materials, hardware, labor hours and finishing time.","I need clear drawings or measurements first. Guessing makes bad quotes.","A good quote also includes time for installs, surprises and cleanup."], more:["I list every cabinet, door, drawer and special part, then estimate the hours for each.","Hardware like hinges and slides adds up, so I count them carefully."], ex:["For example, for a kitchen I list each cabinet and its parts, hardware and finish before writing anything down."], why:["Because a careful breakdown avoids surprises for everyone."] },
    { id:"timelines", q:"How long does it take to build a cabinet?", k:["timeline","timelines","how long","build time","lead time","project time"], a:["A single cabinet can take a few days with finishing. A kitchen takes weeks.","Building is faster than people think, finishing is slower than they think.","It depends on the design, the wood and how many coats of finish it needs."], more:["Drying times for glue and finish set a minimum. You can't rush them.","Batching parts for many cabinets at once speeds things up a lot."], ex:["For example, my current base cabinet: a day for parts, a day for assembly and drawer, then a few days of finishing."], why:["Because good work takes the time it needs."] },
    { id:"working-with-clients", q:"How do you work with clients?", k:["clients","customers","client meeting","working with clients","customer wishes","client needs"], a:["I listen first. How the space will be used matters more than any drawing.","I show samples of wood and finish so there are no surprises later.","Clear communication avoids most problems. I explain what's possible and what's not."], more:["I ask how they cook, what they store and what they want to see on display.","Changes are easiest at the drawing stage, so I spend time getting that right."], ex:["For example, someone who bakes a lot might want deep drawers for mixing bowls instead of shelves."], why:["Because a cabinet that fits someone's life is better than one that just fits the space."] },
    { id:"measuring-rooms", q:"How do you measure a room for cabinets?", k:["measuring a room","site measure","room measurements","field measure","measuring walls","site visit"], a:["Measure each wall at several heights, check corners for square and floors for level.","I note windows, outlets, pipes and vents. Everything that can be in the way.","Measure, sketch and photograph. Then measure again."], more:["Measuring walls at top, middle and bottom shows if they bow or lean.","I check diagonals in corners to see how far from square they are."], ex:["For example, a wall can measure differently at counter height than at the floor. I build to the smaller one and scribe."], why:["Because the room decides what fits, not the drawing."] },
    { id:"wood-smell", q:"What does a woodshop smell like?", k:["wood smell","smell of wood","sawdust smell","cedar smell","shop smell","aroma"], a:["Like fresh cut wood. Every species smells different. Cherry is sweet, oak is sharp, cedar is unmistakable.","It's the best part of walking in each morning. That and the quiet before the machines start.","Walnut has an earthy smell, maple is mild, and pine smells like a forest."], more:["Some woods have strong smells you can recognize blindfolded. Cedar is the classic.","Finish smells are less pleasant, which is why good ventilation matters."], ex:["For example, when I cut cedar, the whole shop smells like it for a day."], why:["Because the smell tells you the wood is fresh and alive."] },
    { id:"fun-facts-wood", q:"Do you know any fun facts about wood?", k:["fun facts","fun fact","wood facts","interesting facts","trivia","did you know"], a:["Wood is stronger along the grain than many people think. A small stick can hold a surprising amount of weight in compression.","Tree rings show the age of the tree and the weather it lived through. Wide rings mean good growing years.","Balsa is botanically a hardwood, while yew, a softwood, is harder than many hardwoods."], more:["Some woods float and some sink. A few very dense tropical woods sink in water.","Wood keeps reacting to humidity forever, even centuries after the tree was cut."], ex:["For example, quartersawn oak has visible rays that carried nutrients sideways through the living tree."], why:["Because wood is a natural material with its own history."] },
    { id:"tree-rings", q:"What can tree rings tell you?", k:["tree rings","growth rings","annual rings","ring count","end grain rings","rings"], a:["Each ring is one year of growth. You can count the age of the tree.","Wide rings mean good years with lots of growth, tight rings mean slow, hard years.","On a board, the ring pattern tells me how it was cut and how it will move."], more:["Boards with rings perpendicular to the face, quartersawn, move less and stay flatter.","Boards with rings parallel to the face, flatsawn, show cathedral patterns but cup more."], ex:["For example, I look at the end of a board to see the rings and predict if it will cup."], why:["Because the rings explain both the look and the behavior of the wood."] },
    { id:"sawing-methods", q:"What is quartersawn wood?", k:["quartersawn","quarter sawn","flatsawn","plainsawn","riftsawn","sawing methods"], a:["It's wood cut so the growth rings run nearly vertical in the board. Very stable and with straight grain.","Flatsawn shows big cathedral patterns, quartersawn shows straight lines and sometimes ray fleck.","Quartersawn costs more because it wastes more of the log, but it moves less."], more:["Riftsawn sits between the two, with rings at an angle and a very straight look on all faces.","For doors and frames, quartersawn or riftsawn stays flatter over time."], ex:["For example, quartersawn white oak doors show shimmering flakes across the grain."], why:["Because the cut affects stability and appearance."] },
    { id:"shaker-style", q:"Why are shaker cabinets so popular?", k:["shaker cabinets","shaker style","simple cabinets","timeless cabinets","shaker kitchen","classic style"], a:["They're simple, clean and fit almost any style of kitchen.","A plain frame and flat panel. Nothing fancy, nothing to go out of style.","Shaker is proof that simple and well made beats ornate."], more:["They work with paint or stain, modern or traditional hardware.","The simplicity also shows craftsmanship, because every joint and gap is visible."], ex:["For example, a white shaker kitchen with brass pulls looks classic, and with black pulls it looks modern."], why:["Because simplicity never goes out of fashion."] },
    { id:"clean-joints", q:"What makes a clean joint?", k:["clean joints","tight joints","perfect joint","gap free","joint fit","precise joint"], a:["Accurate layout, sharp tools and careful test fits. No gaps, no forcing.","A clean joint slides together with firm hand pressure and closes without a hairline.","I'm proud of clean joints. They're like a signature you can't fake."], more:["Knife lines and sharp chisels make a bigger difference than any fancy tool.","Paring to the line in small steps beats taking one big cut and hoping."], ex:["For example, a mortise and tenon that slides in with a gentle push and stays put without glue is perfect."], why:["Because tight joints are stronger and look better."] },
    { id:"patience", q:"Is patience important in woodworking?", k:["patience","patient","slow down","rushing","take your time","careful work"], a:["Absolutely. Most mistakes come from rushing.","Wood rewards patience. Glue, finish and even boards themselves need time.","If I'm tired or rushing, I stop and do something easy instead, like sharpening."], more:["Slow is smooth, smooth is fast. Careful steps avoid redoing work.","Waiting a day for wood to settle can save a week of fixing."], ex:["For example, I let a finish cure overnight instead of adding a coat too soon. It saves sanding later."], why:["Because mistakes made in a hurry take longer to fix than doing it right."] },
    { id:"learning-craft", q:"How did you learn carpentry?", k:["learning carpentry","learn woodworking","how to learn","training","apprentice","learning the craft"], a:["By doing it: lots of practice, lots of mistakes, and watching experienced woodworkers closely.","Start with basics, build simple pieces, and slowly take on harder projects.","Every project teaches something. The craft never really stops being a school."], more:["Practice joints on scrap. Dovetails especially get better with repetition.","Books, classes and good mentors speed it up, but nothing replaces hours at the bench."], ex:["For example, cutting a practice dovetail every day for a couple of weeks makes a big difference."], why:["Because skill in the hands comes from repetition."] },
    { id:"pride-craft", q:"What makes you proud of your work?", k:["proud","pride","quality work","craftsmanship","well made","good work"], a:["When something I built is still working perfectly years later.","Clean joints, even gaps, smooth drawers. Details nobody notices unless they're wrong.","I'm proud when the work speaks for itself and nobody has to ask how it was made."], more:["Quality is in the hidden parts too: the back of the drawer, the inside of the box.","I build things as if someone will look inside, because one day they will."], ex:["For example, I finish the inside of drawers as nicely as the outside."], why:["Because craftsmanship is about care in the places nobody looks."] },
    { id:"humour-shop", q:"Got any woodworking jokes?", k:["joke","jokes","funny","woodworking humor","shop humor","make me laugh"], a:["I cut this board three times and it's still too short. Measure twice, cut once, they said.","Why did the carpenter break up with the board? It was too knotty.","My wood joke? It took me a while, but I nailed it."], more:["The shop's oldest joke: you can never have too many clamps. It's also true.","And another: I'm reading a book about wood glue. I can't put it down."], ex:["For example, every time someone asks if I can make a board longer, I say sure, cut it twice."], why:["Because a bit of dry humor makes long sanding sessions go faster."] },
    { id:"square-box", q:"How do you make sure a cabinet is square?", k:["square cabinet","box square","measure diagonals","out of square","racking","square box"], a:["Measure both diagonals. If they match, the box is square.","Check with a big square on each corner, then confirm with diagonals.","Cut parts square, glue carefully, then check before the glue sets."], more:["If a box is out of square, a clamp across the long diagonal can pull it back.","A square back panel helps lock the box square."], ex:["For example, during glue-up, I measure diagonals and adjust the clamps until they match."], why:["Because doors and drawers only fit right in a square box."] },
    { id:"door-gaps", q:"How do you get even gaps around doors?", k:["door gaps","even gaps","door reveal","door alignment","adjusting doors","sagging door"], a:["Careful fitting and adjustable hinges. I aim for small, even gaps all around.","Spacers help: thin strips set between doors while I install hinges.","Concealed hinges let me fine tune doors up, down, in and out with a screwdriver."], more:["I plane door edges a hair at a time until the gap is consistent.","Gaps should look even more than be perfectly equal. The eye notices patterns."], ex:["For example, I use playing cards as spacers to set small, even gaps around a door."], why:["Because even gaps make a cabinet look crisp and professional."] },
    { id:"toe-kick", q:"What is a toe kick?", k:["toe kick","toekick","kick plate","cabinet base","plinth","recessed base"], a:["The recessed space at the bottom of base cabinets so you can stand close without hitting your toes.","It's a small detail that makes kitchens comfortable.","Sometimes I build it into the cabinet, sometimes it's a separate base."], more:["A separate base can be leveled first, which makes installing the cabinets easier.","Toe kicks can even hold slim drawers or lighting."], ex:["For example, a separate leveled base under a run of cabinets means every cabinet sits right on top."], why:["Because comfort matters as much as looks in a kitchen."] },
    { id:"shelves", q:"How do you make adjustable shelves?", k:["shelves","adjustable shelves","shelf pins","shelf holes","shelf sag","shelving"], a:["A row of holes drilled into the cabinet sides and small pins that hold the shelf.","A drilling jig keeps the holes evenly spaced, so the shelf sits level.","Shelves need to be stiff enough not to sag with weight."], more:["Long shelves can sag over time. A solid edge strip on the front stiffens them a lot.","I drill holes before assembly, while the sides are flat on the bench."], ex:["For example, a shelf full of dishes needs a thicker panel or a hardwood edge to stay straight."], why:["Because adjustable shelves fit whatever people need to store."] },
    { id:"hardware-pulls", q:"How do you install knobs and pulls?", k:["knobs","pulls","handles","cabinet hardware","drilling pulls","hardware jig"], a:["With a drilling template so every pull is in the same spot on every door.","Measure, mark and drill from the front, with a backing block behind to prevent tearout.","Hardware is the jewelry of a cabinet. Placement matters."], more:["Consistent positions make a whole kitchen look intentional.","Drill a test hole in scrap to check the screw length and hole size."], ex:["For example, I make one jig for all drawer fronts so pulls line up across a run of cabinets."], why:["Because misaligned pulls stand out right away."] },
    { id:"curing-drying", q:"How long should finish dry?", k:["drying time","cure time","curing","finish dry","dry time","recoat time"], a:["Dry to the touch is fast, fully cured can take days or weeks. Check the label.","I wait for the recoat time on the can, and I'm careful with use until it's fully cured.","Temperature and humidity change drying a lot. Cold and damp slow everything down."], more:["Using a cabinet too soon can leave marks in a soft finish.","Good airflow helps finishes dry evenly."], ex:["For example, I tell people to use painted cabinets gently for the first couple of weeks while the paint hardens."], why:["Because a fully cured finish lasts much longer."] }
  ],

KB["luis"] = {
  topics: [
    { id:"web-manager-role", q:"What does a web manager do?", k:["web manager","website manager","manage websites","your role","what you do","job description","web management"],
      a:["I look after the company websites: content, product pages, fixes, speed and making sure nothing breaks on a Friday afternoon.","Think of me as the caretaker of our sites. I decide what goes live, keep things tidy and coordinate with designers and developers.","I own the websites day to day. Requests come in, I sort them, build or fix what I can and hand the rest to the right people.","Part editor, part mechanic, part traffic controller. If it lives on our sites, it passes through my desk at some point."],
      more:["A big chunk is product content: titles, specs, images and manuals. The rest is SEO, accessibility, speed checks and keeping requests moving.","I also decide priorities. Everyone has an urgent request, so a lot of the job is choosing what actually matters this week."],
      ex:["For example, a new product launches: I make sure its page has the right title, images, specs, manual and that it shows up in the right category."],
      why:["Because a website without an owner slowly turns into a junk drawer."] },

    { id:"typical-day", q:"What is a typical day like?", k:["typical day","daily routine","day to day","workday","average day","normal day"],
      a:["Coffee, check the sites are up, scan new requests, then headphones on for a long block of focused work.","Mornings are for checking and planning, the middle of the day is deep work, and afternoons are reviews, testing and replies.","It is a mix: fixing a product page, reviewing a design, chasing a broken link and testing a change before it goes live.","Quiet most of the time, which is how I like it. The loud days are usually launch days."],
      more:["I try to batch small tasks together so they do not chop up the day.","Testing takes more time than people expect. Building a change is quick, checking it on every device is the real work."],
      ex:["For example, a morning might be 20 product page edits, then an afternoon reviewing a new landing page layout."],
      why:["Because a predictable rhythm keeps me calm when something unpredictable happens."] },

    { id:"morning-routine", q:"What is your morning routine at work?", k:["morning routine","first thing","start the day","mornings","when you arrive","first hour"],
      a:["I open the homepage of each site, check a couple of key pages, then read the request queue before touching anything.","First a quick health check: are the sites up, are forms working, did anything weird happen overnight.","Coffee, then a scan of the sites, then I pick the one task that matters most today.","I start by looking, not doing. Ten minutes of checking saves an hour of surprises."],
      more:["I also glance at analytics for anything odd, like a sudden traffic drop on a key page.","Then I write a short list of three things for the day. Three, not twelve."],
      ex:["For example, if a nightly data import updated products, I spot check a few pages to see it landed correctly."],
      why:["Because finding a problem before visitors do is the best kind of morning."] },

    { id:"headphones-focus", q:"Why are your headphones always on?", k:["headphones","headphones on","red headphones","over ear","noise cancelling","headset","earphones"],
      a:["Headphones on means deep work mode. It is my polite do not disturb sign.","They help me focus. Some tasks need an hour of uninterrupted attention, and these buy me that hour.","They are red and black and they mean business. If they are on, I am in the middle of something.","Half for music, half as a signal. People learned that headphones on means send me a message instead."],
      more:["If something is truly urgent, a tap on the shoulder is fine. The site being down counts. A font question does not.","I take them off for meetings and reviews, so there are clear windows when I am easy to reach."],
      ex:["For example, when I am cleaning up 50 product specs, one interruption can mean starting the list over."],
      why:["Because focus is the most valuable tool on this desk, more than the monitors."] },

    { id:"focus-music", q:"What music do you listen to while working?", k:["focus music","music","playlist","listening to","songs","lofi","background music"],
      a:["Mostly instrumental: ambient, electronic, anything without lyrics when I am writing content.","Lyrics are fine for repetitive tasks like resizing images. For writing copy, words in my ears fight words on the screen.","Something steady with no surprises. Same as I like my websites.","Sometimes nothing at all. The headphones just block the noise."],
      more:["I keep one playlist only for deep work, so pressing play tells my brain it is focus time.","Long tracks are better. Fewer transitions, fewer distractions."],
