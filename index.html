<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Our Workspaces</title>
<meta name="description" content="Four friends, four workspaces. Tap anyone to see what they are up to, chat about their work, or bring them a snack.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* One-screen app: a header with the four names over a full-bleed isometric view of four rooms. The person card floats on the stage. */
:root{
  --bg:#f1efea;
  --surface:#ffffff;
  --ink:#1b1d22;
  --muted:#5f6670;
  --line:#dcd8d0;
  --accent:#d9643a;
  --accent-ring:rgba(217,100,58,.45);
  --on-accent:#ffffff;
  --ok:#3fa36b;
  --warn:#e0a030;
  --low:#d9534f;
  --shadow:0 12px 32px rgba(27,29,34,.16);
  --scene-bg:#e9e5de;
  --tag-bg:rgba(255,255,255,.95);
  --tag-ink:#1b1d22;
  --tag-muted:#5f6670;
  --f-display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --f-body:"Figtree","Segoe UI",system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121417; --surface:#1b1e23; --ink:#eef0f3; --muted:#9ba3ad; --line:#2c3138;
    --accent:#f08158; --accent-ring:rgba(240,129,88,.45); --shadow:0 12px 32px rgba(0,0,0,.45); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#121417; --surface:#1b1e23; --ink:#eef0f3; --muted:#9ba3ad; --line:#2c3138;
  --accent:#f08158; --accent-ring:rgba(240,129,88,.45); --shadow:0 12px 32px rgba(0,0,0,.45); color-scheme:dark;
}
[hidden]{display:none!important}
html{height:100%;box-sizing:border-box}
*,*::before,*::after{box-sizing:border-box}
body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);display:flex;flex-direction:column;overflow:hidden}
header{display:flex;flex-wrap:wrap;align-items:center;gap:10px 24px;padding-block:12px;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));
  padding-top:max(12px, env(safe-area-inset-top, 0px));
  background:var(--surface);border-bottom:1px solid var(--line);position:relative;z-index:3}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.mark{flex:none;width:34px;height:34px;border-radius:9px;display:grid;grid-template-columns:1fr 1fr;gap:3px;padding:6px;background:var(--ink)}
.mark i{border-radius:2px}
h1{margin:0;font:800 clamp(18px,2.2vw,22px)/1.1 var(--f-display);letter-spacing:-.015em}
.sub{margin:3px 0 0;font-size:12px;color:var(--muted);letter-spacing:.02em}
.chips{display:flex;gap:6px;margin-left:auto;overflow-x:auto;scrollbar-width:none;min-width:0;max-width:100%;padding:2px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:inline-flex;align-items:center;gap:7px;padding:6px 12px 6px 8px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:600 13px/1 var(--f-body);cursor:pointer;transition:background .15s,border-color .15s,color .15s}
.chip:hover{border-color:var(--muted)}
.chip .d{width:10px;height:10px;border-radius:50%;background:var(--c);box-shadow:inset 0 0 0 1px rgba(0,0,0,.15)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

#stage{position:relative;flex:1;min-height:0;overflow:hidden;background:var(--scene-bg)}
#stage canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
#stage.dragging canvas{cursor:grabbing}
#labels{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:1}
.tag{position:absolute;left:0;top:0;pointer-events:auto;cursor:pointer;border:0;margin:0;display:flex;flex-direction:column;align-items:flex-start;gap:1px;
  padding:3px 8px 4px;border-radius:8px;background:var(--tag-bg);color:var(--tag-ink);font:inherit;text-align:left;white-space:nowrap;
  box-shadow:0 4px 14px rgba(15,20,25,.16);will-change:transform;transition:opacity .2s}
.tag::after{content:"";position:absolute;left:50%;bottom:-5px;width:10px;height:10px;margin-left:-5px;background:var(--tag-bg);transform:rotate(45deg);border-radius:2px}
.tag .n{display:flex;align-items:center;gap:6px;font:700 12px/1.1 var(--f-body)}
.tag .n i{width:8px;height:8px;border-radius:50%;background:var(--c)}
.tag .need{font-size:12px;line-height:1}
.tag .st{display:none;font-size:11px;line-height:1.2;color:var(--tag-muted)}
.tag:hover .st,.tag.on .st{display:block}
.tag.on{box-shadow:0 0 0 2px var(--accent),0 6px 18px rgba(15,20,25,.22)}
.tag.off{opacity:0;pointer-events:none}
.bubble{position:absolute;left:50%;bottom:calc(100% + 10px);width:max-content;max-width:190px;padding:7px 10px;border-radius:12px;
  background:var(--tag-bg);color:var(--tag-ink);font:500 12px/1.3 var(--f-body);white-space:normal;text-align:center;
  box-shadow:0 6px 18px rgba(15,20,25,.18);opacity:0;transform:translate(-50%,6px) scale(.92);transform-origin:50% 100%;transition:opacity .25s,transform .25s;pointer-events:none}
.bubble::after{content:"";position:absolute;left:50%;bottom:-5px;width:10px;height:10px;margin-left:-5px;background:var(--tag-bg);transform:rotate(45deg);border-radius:2px}
.bubble.show{opacity:1;transform:translate(-50%,0) scale(1)}

.ctrl{position:absolute;top:12px;right:max(16px, env(safe-area-inset-right, 0px));display:flex;gap:8px;z-index:2}
.btn{display:inline-flex;align-items:center;gap:8px;padding:9px 14px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:600 13px/1 var(--f-body);cursor:pointer;box-shadow:var(--shadow)}
.btn:hover{border-color:var(--muted)}
.btn svg{width:15px;height:15px}
.vtile{position:absolute;right:max(16px, env(safe-area-inset-right, 0px));top:64px;width:220px;height:270px;border-radius:14px;box-shadow:0 0 0 2px var(--surface),0 12px 30px rgba(0,0,0,.28);pointer-events:none;z-index:2;overflow:hidden}
.vtile .live{position:absolute;left:10px;top:10px;padding:3px 7px;border-radius:6px;background:#d9534f;color:#fff;font:700 10px/1 var(--f-body);letter-spacing:.08em}
.vtile .vt-n{position:absolute;left:0;right:0;bottom:0;padding:16px 10px 8px;color:#fff;font:600 12px/1.2 var(--f-body);background:linear-gradient(to top,rgba(0,0,0,.6),rgba(0,0,0,0))}
.ping{position:absolute;left:0;top:0;font-size:20px;line-height:1;pointer-events:none;filter:drop-shadow(0 3px 6px rgba(0,0,0,.25));will-change:transform}
@media (max-width:640px){ .vtile{width:112px;height:140px;top:auto} .vtile .vt-n{font-size:10px;padding:12px 6px 5px} .vtile .live{left:6px;top:6px} }
.hint{position:absolute;right:max(16px, env(safe-area-inset-right, 0px));bottom:max(14px, env(safe-area-inset-bottom, 0px));margin:0;padding:7px 12px;border-radius:999px;background:rgba(27,29,34,.68);color:#fff;font-size:12px;pointer-events:none;z-index:1}
.vignette{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 45%,rgba(0,0,0,0) 62%,rgba(20,24,30,.14) 100%);z-index:0}

.card{position:absolute;left:max(16px, env(safe-area-inset-left, 0px));bottom:max(16px, env(safe-area-inset-bottom, 0px));width:min(370px, calc(100% - 32px));max-height:calc(100% - 28px);overflow-y:auto;overscroll-behavior:contain;
  background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);
  padding:14px 16px 15px;display:flex;flex-direction:column;gap:10px;z-index:2;animation:pop .25s ease-out}
@keyframes pop{from{transform:translateY(8px);opacity:.4}to{transform:none;opacity:1}}
.card-top{display:flex;align-items:center;gap:12px}
.avatar{flex:none;width:40px;height:40px;border-radius:50%;background:var(--c);display:grid;place-items:center;color:#fff;font:800 17px/1 var(--f-display);box-shadow:inset 0 0 0 2px rgba(255,255,255,.35)}
.card h2{margin:0;font:800 19px/1.1 var(--f-display);letter-spacing:-.01em}
.role{margin:3px 0 0;font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.x{margin-left:auto;align-self:flex-start;width:30px;height:30px;border-radius:8px;border:1px solid var(--line);background:transparent;color:var(--muted);font-size:18px;line-height:1;cursor:pointer}
.status{margin:0;display:flex;align-items:center;gap:8px;font-weight:600;font-size:14px}
.pulse{flex:none;width:9px;height:9px;border-radius:50%;background:var(--accent);animation:ring 1.8s infinite}
@keyframes ring{0%{box-shadow:0 0 0 0 var(--accent-ring)}70%{box-shadow:0 0 0 8px rgba(0,0,0,0)}100%{box-shadow:0 0 0 0 rgba(0,0,0,0)}}
.mood{margin:0;font-size:13.5px;font-weight:600}
.traits{margin:0;display:grid;gap:8px}
.traits div{display:grid;gap:2px}
.traits dt,.sec-h{font-size:10.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin:0}
.traits dd{margin:0;font-size:13.5px;line-height:1.45}
.care{display:grid;gap:8px;border-top:1px solid var(--line);padding-top:10px}
.bars{display:grid;grid-template-columns:auto 1fr 34px;gap:5px 9px;align-items:center;font-size:12px}
.bars span{color:var(--muted);font-weight:600}
.bars b{font-weight:600;font-variant-numeric:tabular-nums;text-align:right;color:var(--muted)}
.bar{height:7px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;width:50%;background:var(--ok);border-radius:inherit;transition:width .5s,background .3s}
.bar.mid i{background:var(--warn)}
.bar.low i{background:var(--low)}
.cacts,.cmenu{display:flex;flex-wrap:wrap;gap:6px}
.cb{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:9px;padding:6px 10px;font:600 12px/1.2 var(--f-body);cursor:pointer}
.cb:hover{border-color:var(--muted)}
.cb[aria-expanded="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.cmenu .cb{font-weight:500;border-radius:999px}
.ask{display:grid;gap:8px;border-top:1px solid var(--line);padding-top:10px}
.log{display:flex;flex-direction:column;gap:6px;max-height:200px;overflow-y:auto;padding-right:2px}
.msg{max-width:85%;padding:7px 10px;border-radius:12px;font-size:13px;line-height:1.4;overflow-wrap:anywhere}
.msg.me{align-self:flex-end;background:var(--ink);color:var(--surface);border-bottom-right-radius:4px}
.msg.them{align-self:flex-start;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-bottom-left-radius:4px}
.msg.typing{display:flex;gap:4px;padding:10px 12px}
.msg.typing i{width:6px;height:6px;border-radius:50%;background:var(--muted);animation:blink 1s infinite}
.msg.typing i:nth-child(2){animation-delay:.15s}.msg.typing i:nth-child(3){animation-delay:.3s}
@keyframes blink{0%,80%,100%{opacity:.25}40%{opacity:1}}
.sugg{display:flex;flex-wrap:wrap;gap:6px}
.q{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:5px 10px;font:500 12px/1.2 var(--f-body);cursor:pointer;text-align:left}
.q:hover{border-color:var(--muted)}
.ask-f{display:flex;gap:6px}
.ask-f input{flex:1;min-width:0;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:10px;padding:8px 10px;font:16px var(--f-body)}
.ask-f input:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.send{border:0;border-radius:10px;padding:8px 14px;background:var(--accent);color:var(--on-accent);font:700 13px var(--f-body);cursor:pointer}
#fallback{position:absolute;inset:0;display:grid;place-items:center;padding:24px;text-align:center;color:var(--muted);font-size:14px;z-index:5;background:var(--scene-bg)}
#loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:10px;font-weight:600;color:#3b434c;background:rgba(233,229,222,.6);z-index:4}
.spin{width:18px;height:18px;border-radius:50%;border:2px solid #b9c1c9;border-top-color:var(--accent);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (max-width:640px){
  header{gap:8px}
  .chips{margin-left:0;width:100%}
  .sub{display:none}
  .bubble{max-width:150px;font-size:11px}
  .card{right:max(12px, env(safe-area-inset-right, 0px));left:max(12px, env(safe-area-inset-left, 0px));width:auto;bottom:max(10px, env(safe-area-inset-bottom, 0px));max-height:64%;padding:12px 13px}
  .card:not([hidden]) ~ .hint{display:none}
  .log{max-height:140px}
  .btn span{display:none}
  .btn{padding:9px}
  .traits{display:none}
}
@media (prefers-reduced-motion: reduce){
  .card,.pulse,.spin,.msg.typing i{animation:none}
  .chip,.tag,.bubble,.bar i{transition:none}
}
</style>
</head>
<body>
<header>
  <div class="brand">
    <div class="mark" aria-hidden="true"><i style="background:#7b5ea7"></i><i style="background:#2a8fb0"></i><i style="background:#b5452f"></i><i style="background:#3c5a78"></i></div>
    <div>
      <h1>Our Workspaces</h1>
      <p class="sub">Four friends, four workplaces, one group chat</p>
    </div>
  </div>
  <nav class="chips" id="chips" aria-label="People"></nav>
</header>
<main id="stage">
  <div id="labels"></div>
  <div class="ctrl">
    <button class="btn" id="reset" type="button" aria-label="Reset view">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>
      <span>Reset view</span>
    </button>
  </div>
  <section class="card" id="card" hidden aria-live="polite">
    <div class="card-top">
      <div class="avatar" id="cAvatar"></div>
      <div>
        <h2 id="cName"></h2>
        <p class="role" id="cRole"></p>
      </div>
      <button class="x" id="cClose" type="button" aria-label="Close card">&times;</button>
    </div>
    <p class="status"><span class="pulse"></span><span id="cStatus"></span></p>
    <p class="mood" id="cMood"></p>
    <dl class="traits">
      <div><dt>Personality</dt><dd id="cPers"></dd></div>
      <div><dt>Ask about</dt><dd id="cTopics"></dd></div>
    </dl>
    <div class="care">
      <p class="sec-h">How they are doing</p>
      <div class="bars" id="bars"></div>
      <div class="cacts" id="cacts">
        <button class="cb" type="button" data-a="food" aria-expanded="false">Give food</button>
        <button class="cb" type="button" data-a="drink" aria-expanded="false">Give a drink</button>
        <button class="cb" type="button" data-a="nap">Break or nap</button>
        <button class="cb" type="button" data-a="cheer">Cheer up</button>
        <button class="cb" type="button" data-a="work">Let them work</button>
      </div>
      <div class="cmenu" id="cmenu" hidden></div>
    </div>
    <div class="ask">
      <p class="sec-h" id="askH">Ask</p>
      <div class="log" id="log" hidden></div>
      <div class="sugg" id="sugg"></div>
      <form class="ask-f" id="askForm" autocomplete="off">
        <input id="askIn" type="text" maxlength="160" placeholder="Ask something" aria-label="Your question">
        <button type="submit" class="send">Ask</button>
      </form>
    </div>
  </section>
  <p class="hint" id="hint">Drag to rotate. Tap anyone to chat or bring them a snack.</p>
  <div class="vignette" aria-hidden="true"></div>
  <div class="vtile" id="vtile" hidden aria-hidden="true"><span class="live">LIVE</span><span class="vt-n" id="vtName"></span></div>
  <div id="loading"><span class="spin"></span>Opening the workspaces&hellip;</div>
  <div id="fallback" hidden>This page needs WebGL. Try a recent version of Chrome, Edge, Safari or Firefox.</div>
</main>

<script type="importmap">

} }
</script>

/* ---------- merge static geometry per material to cut draw calls ---------- */
function mergeStatic(){
  STATIC.updateMatrixWorld(true);
  var groups = new Map(), keep = [];
  var lights = [];
  STATIC.traverse(function(o){
    if (o.isLight) { lights.push(o); return; }
    if (!o.isMesh) return;
    var key = o.material.uuid + (o.castShadow ? "s" : "n") + (o.renderOrder || 0);
    if (!groups.has(key)) groups.set(key, []);
    groups.get(key).push(o);
  });
  var out = new T.Group();
  groups.forEach(function(list){
    var geos = list.map(function(o){
      var g = o.geometry.index ? o.geometry.clone() : o.geometry.clone();
      g.applyMatrix4(o.matrixWorld);
      Object.keys(g.attributes).forEach(function(n){ if (n !== "position" && n !== "normal" && n !== "uv") g.deleteAttribute(n); });
      return g;
    });
    var merged = null;
    try { merged = mergeGeometries(geos, false); } catch (e) { merged = null; }
    if (!merged) { list.forEach(function(o){ keep.push(o); }); return; }
    var m = new T.Mesh(merged, list[0].material);
    m.castShadow = list[0].castShadow; m.receiveShadow = true; m.renderOrder = list[0].renderOrder || 0;
    m.matrixAutoUpdate = false; m.updateMatrix();
    out.add(m);
    geos.forEach(function(g){ g.dispose(); });
  });
  keep.forEach(function(o){ var w = o.matrixWorld.clone(); out.add(o); w.decompose(o.position, o.quaternion, o.scale); });
  lights.forEach(function(l){ var wp = new V3(); l.getWorldPosition(wp); l.parent.remove(l); l.position.copy(wp); scene.add(l); });
  scene.remove(STATIC);
  scene.add(out);
  out.traverse(function(o){ if (o.isMesh) { o.matrixAutoUpdate = false; o.updateMatrix(); } });
}
mergeStatic();

var tmpPos = new V3();
function makePath(pts){
  var clean = [pts[0]];
  for (var i = 1; i < pts.length; i++) if (pts[i].distanceTo(clean[clean.length - 1]) > 0.01) clean.push(pts[i]);
  var cum = [0];
  for (i = 1; i < clean.length; i++) cum.push(cum[i - 1] + clean[i].distanceTo(clean[i - 1]));
  return { pts:clean, cum:cum, L:cum[cum.length - 1] };
}
function along(w, d){
  d = clamp(d, 0, w.L);
  var i = 1;
  while (i < w.cum.length - 1 && w.cum[i] < d) i++;
  var a = w.pts[i - 1], b = w.pts[i], seg = w.cum[i] - w.cum[i - 1];
  tmpPos.lerpVectors(a, b, seg > 0 ? (d - w.cum[i - 1]) / seg : 0);
  return Math.atan2(b.x - a.x, b.z - a.z);
}
/* start, its outgoing waypoints, the room hub, the end's waypoints in reverse, end */
function buildPath(id, start, sVia, end, eVia){
  var pts = [start.clone()].concat(sVia || []);
  pts.push(PLACES[id].hub);
  pts = pts.concat((eVia || []).slice().reverse());
  pts.push(end.clone());
  return makePath(pts);
}
function smoothTurn(p, target, dt, rate){
  var d = target - p.heading;
  d = Math.atan2(Math.sin(d), Math.cos(d));
  p.heading += d * (1 - Math.exp(-dt * (rate || 7)));
}

var _pa = new V3(), _pb = new V3();
function updatePings(t, w, h){

    pg.b.head.getWorldPosition(_pb); _pb.y += 0.45; _pb.project(camera);
    var k = ease(u), x = lerp(_pa.x, _pb.x, k), y = lerp(_pa.y, _pb.y, k) + Math.sin(u * Math.PI) * 0.18;

  }
}

/* ---------- decisions ---------- */
function busyAct(q){ return q.act && (q.act.n === "nap" || q.act.n === "napStand" || q.act.n === "eat"); }
function luisDeepWork(q){ return q.id === "luis" && q.typeOn && q.needs.focus > 0.55; }
function startWork(p, t){
  var wk = choose(WORK[p.id]), dur = rand(wk.d[0], wk.d[1]);
  p.workLabel = wk.s;
  if (wk.n === "type") { p.typeOn = true; p.typeNext = t + dur; p.act = null; }
  else startAct(p, wk.n, t, dur, null, { work:true, label:wk.s });
  p.needs.focus = Math.min(1, p.needs.focus + 0.12);
}
function decide(p, t){
  var n = p.needs, w = p.w, c = p.care, opts = [];
  opts.push({ k:"work", s:0.85 * w.focus * (0.6 + n.energy * 0.6) + n.focus * 0.3 + rand(0, 0.3) });
  opts.push({ k:"micro", s:(1 - n.energy) * 0.8 * w.breaky + (c.energy < LOWLINE ? 0.2 : 0) + rand(0, 0.45) });
  if (ERRANDS[p.id].length) opts.push({ k:"errand", s:w.errand + rand(0, 0.55) });
  opts.push({ k:"drink", s:n.coffee * 1.1 * w.coffee + (c.water < 0.7 ? 0.25 : 0) + rand(0, 0.2) });
  if (c.food < 0.62 && t - p.snackAt > 240) opts.push({ k:"snack", s:0.75 + rand(0, 0.4) });
  if (n.social > 0.55 && !pings.length && t - lastTextAt > 22) opts.push({ k:"text", s:n.social * w.social * 1.4 + rand(0, 0.3) });
  opts.sort(function(a, b){ return b.s - a.s; });
  var o = opts[0];
  if (o.k === "work") startWork(p, t);
  else if (o.k === "micro") {
    var nm = c.energy < LOWLINE && Math.random() < 0.5 ? "yawn" : choose(POOLS[p.id]);
    startAct(p, nm, t, nm === "sip" ? 3.5 : rand(2.2, 4), null, nm === "sip" ? { item:DRINK_OF[p.id] } : null);
    n.energy = Math.min(1, n.energy + 0.12); bumpCare(c, "energy", 0.01);
    if (nm === "sip") bumpCare(c, "water", 0.04);
  }
  else if (o.k === "drink") {
    startAct(p, "sip", t, 4.5, null, { item:DRINK_OF[p.id], label:"Having a " + DRINK_OF[p.id] + " break" });
    n.coffee = 0; n.energy = Math.min(1, n.energy + 0.3); bumpCare(c, "water", 0.12); bumpCare(c, "energy", 0.04);
    p.lastEvent = { kind:"coffee", t:t };
  }
  else if (o.k === "snack") {
    startAct(p, "eat", t, 5, null, { item:SNACK_OF[p.id] });
    p.snackAt = t; bumpCare(c, "food", 0.12); bumpCare(c, "mood", 0.03);
  }
  else if (o.k === "errand") {
    var e = choose(ERRANDS[p.id]);
    goTrip(p, t, "errand", buildPath(p.id, p.seat, p.seatVia, e.spot, e.via || []));
    p.trip.errand = e;
  } else if (o.k === "text") {
    var others = PEOPLE.filter(function(q){ return q !== p; });
    lastTextAt = t;
    sendText(p, choose(others), t);
  }
}
var lastTextAt = -10;
function goTrip(p, t, kind, path){

}
function setState(p, st, t, dur){ p.state = st; p.t0 = t; p.dur = dur; }
function startReturn(p, t){
  var tr = p.trip, from = p.root.position.clone();

/* ---------- per-frame agent update ---------- */
var fwd = new V3(), dv = new V3();
function updateAgent(p, t, dt){
  var n = p.needs, w = p.w, r = p.rig, c = p.care;
  n.energy = clamp(n.energy - dt * 0.004 * (p.typeOn ? 1.3 : 0.6), 0, 1);
  n.coffee = clamp(n.coffee + dt * 0.005 * w.coffee, 0, 1);
  n.social = clamp(n.social + dt * 0.006 * w.social, 0, 1);
  n.focus = clamp(n.focus + dt * (p.typeOn || (p.act && p.act.work) ? 0.01 : -0.006), 0, 1);
  decayCare(c, dt);
  if (p.act && p.act.n !== "carry" && t - p.act.t0 > p.act.dur + 0.5) p.act = null;
  if (p.answering && t > p.answering) p.answering = 0;
  p.mood.v += (MOODS[p.mood.base].v + (c.mood - 0.75) * 0.6 - p.mood.v) * dt * 0.003;
  if (Math.random() < dt * 0.2) recomputeMood(p);
  p.pace = (0.86 + 0.24 * (p.mood.v + 1) / 2 + 0.06 * (n.energy - 0.5)) * (0.9 + 0.1 * c.energy);

  var st = p.state, k = p.dur > 0 ? clamp((t - p.t0) / p.dur, 0, 1) : 1, tr = p.trip;
  r.walkTarget = 0;
  var swivelTarget = 0;
  if (st === "sit") {
    p.root.position.copy(p.seat);
    r.sit = p.stand ? 0 : 1;
    if (p.inbox && t >= p.inbox.at && !busyAct(p) && !p.answering) {
      var ib = p.inbox; p.inbox = null;
      if (!ib.reply) { var rl = choose(REPLIES[p.id]); sendText(p, ib.from, t, rl, true); }
      else startAct(p, "text", t, 2.4, null, { label:"Reading a text from " + ib.from.name, item:"phone" });
      p.decideAt = t + 3.5;
    } else if (p.pendingNap && !p.answering) {
      p.pendingNap = false; startAct(p, p.stand ? "napStand" : "nap", t, 12);
    } else if (t >= p.decideAt && (!p.act || (p.act.work && t - p.act.t0 > p.act.dur - 0.4)) && !p.answering) {
      p.decideAt = t + (p.stand ? rand(1, 2.5) : rand(3, 6));
      if (!p.act || !p.act.work || Math.random() < 0.5) decide(p, t);
    }
    if (p.state === "sit") {
      if (!p.stand && t > p.typeNext) { p.typeOn = !p.typeOn; p.typeNext = t + (p.typeOn ? rand(2, 7) : rand(0.8, 3.5)); }
      p.typeAmp = lerp(p.typeAmp, p.typeOn && !p.act && !p.stand ? 1 : 0, 1 - Math.exp(-dt * 4));
      smoothTurn(p, p.sitHeading, dt);
      if (p.act && p.act.n === "answer" && !p.stand) swivelTarget = clamp((camYaw(p) + p.swivel) * 0.35, -0.6, 0.6) * bump(t - p.act.t0, 0, p.act.dur, 0.6);
      p.swivel = lerp(p.swivel, swivelTarget, 1 - Math.exp(-dt * 5));
      var a = p.act;
      p.statusNow = p.answering ? "Answering your question"
        : a && a.label ? a.label : a && ACT_TEXT[a.n] ? ACT_TEXT[a.n] : p.typeOn ? p.workLabel : p.stand ? "Taking a breather" : (p.workLabel || p.status);
      return;
    }
    st = p.state; k = 0; tr = p.trip;
  }
  p.typeAmp = lerp(p.typeAmp, 0, 1 - Math.exp(-dt * 6));
  p.swivel = lerp(p.swivel, 0, 1 - Math.exp(-dt * 5));
  if (st === "up" || st === "down") {
    p.root.position.copy(p.seat);
    r.sit = p.stand ? 0 : (st === "up" ? 1 - k : k);
    smoothTurn(p, p.sitHeading, dt);
    if (k >= 1) {
      if (st === "up") setState(p, "walk", t, 0);
      else {
        p.trip = null; setState(p, "sit", t, 0); r.sit = p.stand ? 0 : 1; p.decideAt = t + rand(1.5, 4);
        if (p.carrying) { p.carrying = false; p.act = null; startAct(p, "lift", t, 2, null, { label:"Setting the plank on the bench" }); }
      }
    }
  } else if (st === "walk") {
    r.sit = 0;
    var path = tr.path, rem = path.L - tr.d;
    r.walkTarget = rem > 0.04 ? clamp(rem / 0.8, 0.3, 1) : 0;
    tr.d = Math.min(path.L, tr.d + WALK_V * p.pace * r.walkW * dt);
    var hd = along(path, tr.d);
    p.root.position.copy(tmpPos);
    if (rem > 0.05) smoothTurn(p, hd, dt, 6);
    if (rem <= 0.04 && r.walkW < 0.25) {
      if (tr.back) setState(p, "down", t, p.stand ? 0.15 : 0.6);
      else {
        var e = tr.errand;
        setState(p, "errand", t, rand(e.dur[0], e.dur[1]));
        startAct(p, e.act, t + 0.3, p.dur - 0.4, null, { label:e.s, item:e.item, saw:e.saw });
      }
    }
  } else if (st === "errand") {
    r.sit = 0;
    var spot = tr.path.pts[tr.path.pts.length - 1], face = tr.errand.face;
    p.root.position.copy(spot);
    smoothTurn(p, Math.atan2(face.x - spot.x, face.z - spot.z), dt, 5);
    if (k >= 1) {
      if (tr.errand.care) Object.keys(tr.errand.care).forEach(function(kk){ bumpCare(c, kk, tr.errand.care[kk]); });
      if (tr.errand.carry) { p.carrying = true; startAct(p, "carry", t, 999, null, { label:"Carrying a plank to the bench" }); }
      startReturn(p, t);
    }
  }
  if (p.carrying) p.statusNow = "Carrying a plank to the bench";
  else if (p.trip) p.statusNow = p.state === "errand" ? p.trip.errand.s : p.trip.back ? "Heading back" : p.trip.errand.go;
}

var ISO_PH = (90 - 35.264) * Math.PI / 180, ISO_TH = Math.PI / 4;

var focus = null, dragging = false, lastInteract = -10, aspect = 1;
var camDir = new V3(), camRight = new V3(), camUp = new V3(), corner = new V3();
var BOUNDS = { x0:-5.05, x1:5.05, y1:2.8, z0:-5.05, z1:5.05 };
function basis(th, ph){
  camDir.set(Math.sin(ph) * Math.sin(th), Math.cos(ph), Math.sin(ph) * Math.cos(th));
  camRight.set(Math.cos(th), 0, -Math.sin(th));
  camUp.crossVectors(camDir, camRight);
}
function extent(th){
  basis(th, ISO_PH);
  var u0 = 1e9, u1 = -1e9, v0 = 1e9, v1 = -1e9;
  [BOUNDS.x0, BOUNDS.x1].forEach(function(x){ [0, BOUNDS.y1].forEach(function(y){ [BOUNDS.z0, BOUNDS.z1].forEach(function(z){
    corner.set(x, y, z);
    var u = corner.dot(camRight), v = corner.dot(camUp);
    u0 = Math.min(u0, u); u1 = Math.max(u1, u); v0 = Math.min(v0, v); v1 = Math.max(v1, v);
  }); }); });
  return { u0:u0, u1:u1, v0:v0, v1:v1, r:Math.max((v1 - v0) / (2 * 0.9), (u1 - u0) / (2 * aspect * 0.95)) };
}
function defaultGoal(){
  var th = ISO_TH;
  if (aspect < 0.9) { var bs = 1e9; for (var a = 0; a <= 0.79; a += 0.05) { var rr = extent(a).r; if (rr < bs - 0.01) { bs = rr; th = a; } } }
  var ex = extent(th);
  var uc = (ex.u0 + ex.u1) / 2, vc = (ex.v0 + ex.v1) / 2;
  goal.tx = camRight.x * uc + camUp.x * vc;
  goal.ty = camRight.y * uc + camUp.y * vc;
  goal.tz = camRight.z * uc + camUp.z * vc;

function nearAngle(cur, target){ return target + Math.PI * 2 * Math.round((cur - target) / (Math.PI * 2)); }
function resize(){

/* ---------- knowledge bases (generated per person) ---------- */
var KB = {};
KB["doriana"] = {
  topics: [
    { id:"deal-jacket", q:"What is a deal jacket?", k:["deal jacket","deal jackets","deal file","deal folder","jacket","sale file","deal envelope","dealjacket"], a:["A deal jacket is the folder that holds every piece of paper for one car sale. One customer, one car, one jacket.","Think of it as the life story of a sale in a manila envelope. If it is not in the jacket, as far as the office is concerned, it did not happen.","It is the master folder for a single deal: the agreement, the financing papers, the trade-in documents and all the little forms in between."], more:["Most dealerships print a checklist right on the front of the jacket, so anyone can see at a glance what is in and what is missing.","Once the deal is complete, the jacket gets scanned, reviewed and filed so anyone can pull it later without a treasure hunt."], ex:["For example, a jacket for a financed sale with a trade-in might hold the buyer's order, the credit application, the lender approval, the trade title and the odometer statements."], why:["Because when a question comes up months later, one complete folder answers it in two minutes instead of two days."] },
    { id:"deal-jacket-contents", q:"What goes inside a deal jacket?", k:["inside the jacket","jacket contents","deal contents","what goes in","jacket checklist","deal documents"], a:["Usually the buyer's order, any financing paperwork, title and registration forms, trade-in documents, odometer statements and copies of required IDs.","Everything tied to that one sale: the signed agreement, the payment details, the lender papers if it was financed, and the vehicle's paperwork.","The exact list varies by dealership and by state or province, but the backbone is always the agreement, the vehicle documents and the money trail."], more:["I also see things like warranty or service contract forms, insurance proof, and the delivery checklist, depending on the deal.","The checklist on the cover is my best friend. I tick each line as the document lands, so a gap jumps out immediately."], ex:["For example, a cash deal with no trade can be a slim jacket, while a financed deal with a trade can be thick as a sandwich."], why:["Because a complete jacket means the sale can be funded, titled and audited without anyone chasing paper."] },
    { id:"car-sale-paperwork", q:"What paperwork does a car sale need?", k:["sale paperwork","car sale paperwork","sales documents","buying paperwork","purchase paperwork","paperwork for a car"], a:["In general terms: a purchase agreement, title and registration paperwork, odometer disclosure, and financing documents if the buyer finances.","The core is the agreement that spells out the deal, plus the documents that transfer ownership and register the car. Details vary by state or province.","More than most people expect! Even a simple sale has several signatures across several forms, and each one has a job."], more:["Add trade-in paperwork if there is a trade, and any optional product forms the customer chose.","I always say the paperwork follows the car and the money: who owns it, who paid for it, and how."], ex:["For example, a buyer paying cash with no trade might sign a handful of forms, while a financed deal with a trade can easily double that."], why:["Because ownership has to transfer cleanly, and every party (buyer, dealer, lender) needs proof of what was agreed."] },
    { id:"buyers-order", q:"What is a buyer's order?", k:["buyers order","buyer's order","purchase agreement","sales agreement","bill of sale","purchase order","sales contract"], a:["It is the document that lays out the deal: the vehicle, the price, fees, the trade-in if any, and the totals.","The buyer's order is the summary of what was agreed. I read it first because everything else in the jacket has to match it.","It is basically the deal on one page (well, sometimes two). Vehicle details, numbers, signatures."], more:["I compare the vehicle identification number on the order against the other documents. One wrong character can cause a headache later.","If the numbers on the order do not match the financing or the title paperwork, I flag it before it goes any further."], ex:["For example, if the order says one trim level but the window sticker copy says another, I send it back for a check."], why:["Because it is the reference point. Every other document in the deal should agree with it."] },
    { id:"financing-paperwork", q:"What financing paperwork do you see?", k:["financing paperwork","finance documents","loan paperwork","auto loan","financing forms","finance packet"], a:["In general terms: the credit application, the lender's approval, the signed financing contract and any documents the lender asks for.","I see the paper side of it: applications, approvals, stipulations and the funding package that goes back to the lender.","Lots of it! I do not give financial advice, I just make sure every page the lender needs is there and signed."], more:["The finance office handles the conversations with customers and lenders. My part is making sure the paper trail is complete and tidy.","Every lender has its own checklist, so I keep a cheat sheet of who wants what."], ex:["For example, one lender might want a proof of income copy while another only needs the signed contract and the approval."], why:["Because a deal is not truly done until the lender funds it, and lenders do not fund incomplete packages."] },
    { id:"credit-application", q:"What is a credit application?", k:["credit application","credit app","loan application","finance application","credit form","credit apps"], a:["It is the form a customer fills out when they want to finance the car, so lenders can review it. The finance office handles it.","It collects the information lenders need to make a decision. I treat it as one of the most confidential pages in the building.","It is the starting point of a financed deal. Once it is submitted, the finance office waits to hear back from lenders."], more:["Because it holds sensitive personal details, it is stored securely and only the people who need it can see it.","I check that it is complete and signed where required, but I never discuss its contents outside the deal."], ex:["For example, I make sure a signed application copy is in the jacket before the funding package goes out."], why:["Because lenders need it to decide, and privacy rules expect it to be handled carefully."] },
    { id:"lender-approval", q:"What is a lender approval?", k:["lender approval","loan approval","bank approval","approved financing","approval letter","credit approval"], a:["It is the lender's response saying they will finance the deal, usually with conditions attached.","Think of it as the lender's yes, often with a little list of 'but first, please send us...'.","It confirms the terms the lender agreed to. I keep a copy in the jacket so the paperwork matches what was approved."], more:["The approval terms have to match the final contract. If something changed, the finance office sorts it out with the lender.","Approvals can come with an expiry, so timing matters."], ex:["For example, an approval might say yes as long as the dealership sends proof of residence and proof of insurance."], why:["Because the contract should reflect exactly what the lender approved, or funding can stall."] },
    { id:"stipulations", q:"What are stipulations?", k:["stipulations","stips","lender conditions","stip list","conditions of approval","missing stips"], a:["Stipulations, or 'stips', are the extra documents a lender asks for before funding a deal.","They are the lender's conditions: proof of this, copy of that. Collecting them is a big part of my week.","Stips are the reason I have a whole tray labeled 'waiting on'. Once they are in, the deal can fund."], more:["Common ones in general terms are proof of income, proof of residence or references, but it depends on the lender.","I track stips on a list with the deal name and what is missing, and I update it the moment something arrives."], ex:["For example, a lender may approve a deal but ask for a recent document showing the buyer's address before funding."], why:["Because missing stips are one of the most common reasons a deal waits to get funded."] },
    { id:"funding-package", q:"What is a funding package?", k:["funding package","funding packet","deal funding","lender package","funded deal","contracts in transit"], a:["It is the bundle of signed documents sent to the lender so they can pay the dealership for the financed deal.","The funding package is the finish line paperwork. Contract, approval, stips, all signed and in order.","It is everything the lender needs to release the money. If one page is missing, it bounces back."], more:["I check it against the lender's checklist before it leaves. A returned package costs days.","Some packages go out digitally now, some still on paper. Either way, the checklist rules."], ex:["For example, before sending, I flip through every page looking for a missing initial or a blank date."], why:["Because the faster a clean package goes out, the faster the deal is funded and closed."] },
    { id:"title-registration", q:"How does title and registration work?", k:["title and registration","car title","registration","vehicle title","title work","titling","registering a car"], a:["In general terms, the title shows who owns the vehicle and registration lets it be driven legally. The process varies by state or province.","The dealership usually handles the paperwork to transfer ownership and register the car for the buyer, following local rules.","It is the paperwork that makes the car officially the buyer's. Every jurisdiction has its own forms and timelines."], more:["There is often a title clerk or a specific person who handles this. I make sure their documents are complete in the jacket.","When a lender is involved, they are usually recorded on the title too, depending on local rules."], ex:["For example, on a trade-in, we need the trade's title (or the payoff details) before we can process everything."], why:["Because without clean title work, the buyer cannot fully own or register the car on time."] },
    { id:"temporary-tags", q:"What are temporary tags?", k:["temporary tags","temp tags","temporary plates","temp plates","paper plates","temporary registration","temp tag"], a:["They are the temporary plates or permits that let a new owner drive while the permanent registration is processed. Rules vary by state or province.","Temp tags bridge the gap between driving off the lot and the permanent plates arriving.","They are issued following local rules and logged carefully. I keep a record of which tag went with which deal."], more:["They usually have an expiry date, so the title and registration work needs to happen in time.","A tidy temp tag log saves a lot of panic if anyone asks about one later."], ex:["For example, a customer picks up their car on Saturday and drives home on a temporary tag while the registration goes through."], why:["Because buyers want to drive their car right away, and the paperwork takes a little longer than that."] },
    { id:"trade-in-paperwork", q:"What paperwork does a trade-in need?", k:["trade-in paperwork","trade in","trade-in","trade documents","trading in","trade title","trade-ins"], a:["In general terms: the title or payoff information, an odometer statement, signatures transferring ownership, and the appraisal details.","A trade-in is a mini deal inside the deal. It needs its own set of documents.","Title, odometer, signatures, and if there is a loan on it, the payoff info. Rules vary by location."], more:["If the trade still has a loan, there is extra paperwork to get the payoff handled and the lender's interest released.","I keep the trade documents clipped together inside the jacket so they do not get mixed with the new car's papers."], ex:["For example, if a customer forgets their trade's title at home, I note it as a missing item and follow up."], why:["Because the dealership needs clear ownership of the trade before it can resell it."] },
    { id:"odometer-statement", q:"What is an odometer statement?", k:["odometer statement","odometer disclosure","mileage statement","odometer reading","mileage form","odometer"], a:["It is a form recording the vehicle's mileage at the time of transfer, signed by the parties. It is required in many places.","It documents the mileage when ownership changes hands. I check the number matches the other paperwork.","A small form with a big job: confirming the mileage on the car being sold or traded."], more:["I compare the reading on the statement with the buyer's order and the trade appraisal. They should line up.","Corrections on this form can be a problem, so I prefer it filled in right the first time."], ex:["For example, if the appraisal says one mileage and the statement says another, I flag it right away."], why:["Because accurate mileage protects the buyer, the seller and the dealership."] },
    { id:"signatures-initials", q:"Why are signatures and initials so important?", k:["signatures","initials","signature lines","sign here","missing signature","signing","initialing"], a:["They show that each person saw and agreed to what is on the page. A missing one can stop a deal in its tracks.","Because a document without the right signature is just paper. I hunt for blank signature lines like it is a sport.","They prove agreement. That is why I check every line, every page, every time."], more:["I use little colored flags to mark signature spots before the paperwork goes to the customer. Fewer misses that way.","Dates matter too. A signature without a date can come back from a lender."], ex:["For example, one missed initial on page three of a contract can send a whole funding package back."], why:["Because lenders and agencies reject incomplete signatures, and fixing it later means calling the customer back in."] },
    { id:"checking-missing-items", q:"How do you check documents for missing items?", k:["missing items","missing documents","missing paperwork","document check","checking paperwork","incomplete deal","audit a jacket"], a:["I go page by page against the checklist: present, signed, dated, numbers match. Then I go through it once more.","Slowly and in the same order every time. Routine is what catches the missing page.","I compare the jacket to the checklist and the deal type. A financed deal with a trade needs more than a cash deal."], more:["I keep a 'missing items' sheet clipped to the front of any incomplete jacket so nobody has to guess.","Once a week I review all the incomplete jackets and chase what is still outstanding."], ex:["For example, I might note 'trade payoff letter missing, initials page 2' on a bright slip on the jacket cover."], why:["Because catching it in the office is much cheaper than catching it after the lender or agency rejects it."] },
    { id:"scanning-digital-copies", q:"Do you scan the paperwork?", k:["scanning","scanner","digital copies","scan documents","scanned files","digitize","scans"], a:["Yes, lots. Completed jackets get scanned so there is a digital copy that is easy to search and share with the right people.","Scanning is a daily habit. Paper goes in, a clean labeled file comes out.","Absolutely. A good scan with a good file name is worth its weight in gold."], more:["I scan in a consistent order and name files the same way every time, usually deal number and customer last name.","I check the scan before filing the paper. A crooked or missing page is easier to redo right away."], ex:["For example, I scan a finished jacket as one file, then verify the page count matches the paper copy."], why:["Because digital copies are faster to find, easier to back up and easier to share securely."] },
    { id:"file-naming", q:"How do you name digital files?", k:["file naming","file names","naming convention","naming files","digital filing","folder names"], a:["The same way every time: deal number first, then customer last name, then document type.","Consistency is everything. If everyone names files differently, search becomes a guessing game.","Short, predictable and sortable. Dates written year, month, day so they sort in order."], more:["I keep the naming rule on a sticky note on my monitor and share it with anyone who scans.","Avoiding vague names like 'scan1' or 'final final' is half the battle."], ex:["For example, a file might be named with the deal number, the last name and 'contract', so it sorts next to its siblings."], why:["Because a file you cannot find is a file you do not have."] },
    { id:"filing-system", q:"How does your filing system work?", k:["filing system","filing","file cabinet","files","organizing files","filing method","file drawers"], a:["Current deals live on my desk in trays by status. Completed deals go into the cabinet by month and deal number.","Simple rules, followed every time. Pending, waiting on items, complete, archived.","Everything has a home. If I put it down 'just for a minute', I give it a home first."], more:["Each drawer is labeled with its date range so anyone can find a file without asking me.","I keep an out-card system: if someone borrows a file, a card in its place says who has it."], ex:["For example, if the manager pulls a deal from last spring, an out-card shows exactly where it went."], why:["Because a filing system only works if someone other than me can use it too."] },
    { id:"color-coding", q:"Do you use color coding?", k:["color coding","colour coding","color code","colored folders","colored tabs","colored flags"], a:["I do, and I am a little proud of it. Each color means a status, so I can read my desk from across the room.","Yes! Red for urgent missing items, yellow for waiting on lenders, green for ready to file.","Colors save time. My brain sees red before it reads a single word."], more:["The key is keeping the meaning fixed. If red means urgent today, it means urgent every day.","I keep a little legend taped to the side of the cabinet for new people."], ex:["For example, a blue tab on a jacket might mean there is a trade-in inside that still needs its title."], why:["Because a quick glance beats reading every label when the day gets busy."] },
    { id:"label-maker", q:"Do you have a label maker?", k:["label maker","labels","labeling","label printer","printed labels","labelling"], a:["Of course. A label maker is the small luxury of the organized person.","Yes, and I use it more than I would like to admit. Drawers, trays, shelves, cables.","I do. Handwritten labels fade and smudge; printed ones stay crisp."], more:["I label trays by status, not by person, so the system still works when people change desks.","I even label the printer trays so nobody loads paper in the wrong one."], ex:["For example, my trays read 'In', 'Waiting on', 'Ready to scan' and 'File'."], why:["Because clear labels answer questions before anyone has to ask me."] },
    { id:"archiving", q:"How do you archive old deals?", k:["archiving","archive","archived files","old deals","storage boxes","off-site storage","record storage"], a:["Completed deals move from the active cabinet to archive boxes, labeled by month and deal number range.","At set intervals I box up older jackets, label them clearly and log what is in each box.","Archiving is the quiet part of the job: box, label, log, store."], more:["I keep an archive log so anyone can find which box holds a specific deal.","The digital copy is usually what people use day to day, so the archive is the backup."], ex:["For example, a box label might show the month and the first and last deal numbers inside."], why:["Because active space is precious, and old files still need to be findable."] },
    { id:"retention", q:"How long do you keep records?", k:["retention","record retention","keeping records","how long to keep","retention schedule","document retention"], a:["It depends on the type of record and the rules where the dealership operates. We follow a set retention schedule.","There is a schedule for that, and it varies by state or province and by document type. I just follow it carefully.","Long enough to satisfy the rules, and no longer than needed. The dealership's policy tells me exactly."], more:["When records reach the end of their retention period, they are destroyed securely, usually by shredding.","I never decide retention on my own; I go by the written policy."], ex:["For example, an archive box gets a 'destroy after' date on its label based on the schedule."], why:["Because keeping too little breaks the rules, and keeping too much is a privacy and space problem."] },
    { id:"privacy-confidential", q:"How do you handle confidential documents?", k:["confidential documents","privacy","personal information","sensitive documents","customer privacy","confidential","private data"], a:["Carefully. Sensitive papers never sit face up on my desk, and they live in locked drawers or secure folders.","Customer information is only for people who need it for the deal. That is my rule and the dealership's.","Locked cabinet, clean desk, screen locked when I step away. Privacy is a habit, not a one-time thing."], more:["I turn papers face down when someone walks by and never leave a jacket open at the front counter.","Digital copies follow the same idea: restricted folders and only the access people need."], ex:["For example, if I go grab the printer pages, my screen locks and the jacket goes in the drawer."], why:["Because customers trust the dealership with personal details, and protecting them is part of the job."] },
    { id:"license-copies", q:"Do you handle copies of driver's licenses?", k:["drivers license","driver's license","license copy","id copy","identification","copies of id","license copies"], a:["Sometimes, as part of a deal or a test drive, and I treat them as confidential. They are stored securely and only where required.","Yes, and they get the same care as any sensitive document: secure storage, limited access, proper disposal.","When a copy is needed, it goes straight into the right file, never left on the copier."], more:["I check the copier glass after making a copy. Forgetting an ID on the glass is a classic mistake.","Whether and how long a copy is kept depends on the dealership's policy and local rules."], ex:["For example, after copying a license for a deal, it goes into the jacket and the original goes right back to the customer."], why:["Because ID documents are highly sensitive and should never be left lying around."] },
    { id:"shredding", q:"How do you get rid of old papers?", k:["shredding","shredder","shred bin","destroy documents","secure disposal","shred","paper disposal"], a:["Anything with personal information goes in the locked shred bin, never the regular trash.","Shredding! We have a locked bin that gets emptied by a secure shredding service.","Sensitive paper gets shredded. Regular scrap paper gets recycled. I keep the two very separate."], more:["When in doubt, I shred it. Recycling a page with a customer's details on it is not a risk worth taking.","Misprints of contracts count too. If it has a name or numbers on it, it goes in the bin."], ex:["For example, a misprinted contract page goes straight into the shred bin, not the recycling box."], why:["Because the trash is not private, and customer information must stay protected."] },
    { id:"printer-jams", q:"How do you fix printer jams?", k:["printer jam","paper jam","jammed printer","printer stuck","jams","printer problems","paper jams"], a:["Open the doors gently, pull the paper in the direction it travels, and check for tiny torn bits. Patience beats force.","With a calm face and gentle hands. Yanking paper out the wrong way is how a small jam becomes a service call.","First, turn off the panic. Then follow the little arrows on the printer doors. They know the way."], more:["Most jams in my office come from overfilled trays or slightly damp paper. Fan the stack before loading.","If the same jam keeps happening, I log it and call for service instead of fighting it every hour."], ex:["For example, at month end the printer jammed mid-contract, and the culprit was a tiny corner of paper hiding behind a roller."], why:["Because contracts print at the worst possible moment, and the printer seems to know it."] },
    { id:"toner", q:"How do you keep the printer running?", k:["toner","toner cartridge","printer ink","low toner","printer supplies","replacing toner"], a:["I always keep one spare toner on the shelf. The day you do not have one is the day it runs out.","Spare toner, spare paper, and a quick check every Monday. The printer is a teammate, so I look after it.","I order toner when the warning appears, not when the prints go faint."], more:["Faded lines on contracts can be a problem, so I swap toner before it gets too light.","I keep a small supply list taped inside the cabinet with what to reorder."], ex:["For example, if the warning light comes on Friday, the new toner is ordered before the weekend rush."], why:["Because a dead printer during a delivery means a customer waiting, and nobody wants that."] },
    { id:"office-supplies", q:"What office supplies can you not live without?", k:["office supplies","supplies","stationery","pens","paper clips","binder clips","folders"], a:["Good pens, binder clips, colored flags, folders and a stapler that does not jam. That is my survival kit.","Flags and clips. If I had to choose two, those would be it.","A blue pen that actually works, a stack of folders and my label maker. Oh, and highlighters."], more:["I keep a little reserve drawer so nobody has to run to the supply closet mid-deal.","Pens wander off constantly, so I buy them in bulk and accept my fate."], ex:["For example, a customer once needed a pen at signing and I handed over three, just in case."], why:["Because a deal should never wait on a missing pen."] },
    { id:"sticky-notes", q:"Do you use a lot of sticky notes?", k:["sticky notes","sticky note","sticky reminders","notes on monitor","reminder notes","little notes"], a:["More than I should. They are perfect for quick reminders, as long as they do not become wallpaper.","Yes, but with rules: one task per note, and it gets thrown out when it is done.","They are my short-term memory. The long-term stuff lives in my to-do list."], more:["I never put sensitive information on a sticky note. Names and numbers stay in the file.","At the end of each day I move any leftover sticky notes onto the next day's list."], ex:["For example, a sticky note on a jacket might just say 'call lender re: stip'."], why:["Because a reminder you can see is a reminder you remember."] },
    { id:"to-do-lists", q:"How do you keep your to-do list?", k:["to-do list","to do list","todo list","task list","checklist","daily list","list of tasks"], a:["One list for today, one for the week. Today's list is short on purpose.","I write it at the end of the day for tomorrow, so I start the morning already knowing my first move.","Simple: what must be done today, what should be done, and what can wait."], more:["Crossing things off is satisfying, but I also add things I did that were not on the list. It keeps me honest about my time.","Anything that has a deadline gets the date written next to it."], ex:["For example, today's top three might be: funding package for one deal, manager's meeting prep and the weekly stip check."], why:["Because a written list frees my head for the work itself."] },
    { id:"prioritising", q:"How do you prioritise your work?", k:["prioritising","prioritizing","priorities","what comes first","urgent tasks","most important"], a:["Anything holding up money or a customer goes first. Funding packages and deliveries beat filing every time.","Urgent and important first, then important but not urgent. Filing can wait an hour; a waiting customer cannot.","I ask: who is waiting on this? The answer usually tells me the order."], more:["I check priorities with the manager each morning, since their day changes mine.","When everything feels urgent, I write it all down and pick the one that blocks the most people."], ex:["For example, a missing signature on a deal ready to fund jumps ahead of scanning yesterday's jackets."], why:["Because some tasks unblock other people, and those pay off the most."] },
    { id:"interruptions", q:"How do you handle interruptions?", k:["interruptions","interrupted","distractions","people stopping by","constant interruptions","drop-ins"], a:["I mark my place before I look up. A sticky flag on the page means I can pick up right where I left off.","Interruptions are part of the job, so I plan for them instead of fighting them.","I answer quick things right away and write down the rest. Not everything needs to happen this second."], more:["For detailed work like checking a contract, I find a quieter half hour and close my door if I can.","A simple 'give me five minutes and I am yours' works wonders."], ex:["For example, a salesperson pops in mid-audit, I flag the page, help them, then go right back."], why:["Because losing my place in a contract is how mistakes sneak in."] },
    { id:"multitasking", q:"Are you good at multitasking?", k:["multitasking","multi-tasking","many tasks","juggling tasks","doing many things","several things"], a:["I am good at switching quickly, but I do one thing at a time. Real multitasking is how pages get missed.","I juggle a lot, but each ball gets my full attention while it is in my hand.","Honestly, I am better at fast single-tasking. Phone, then file, then email, each done properly."], more:["When I am on the phone, I am on the phone. The paperwork waits thirty seconds.","Short notes between tasks help me remember where everything stands."], ex:["For example, while a scan runs, I answer an email. That is the safe kind of multitasking."], why:["Because paperwork punishes divided attention."] },
    { id:"staying-organized", q:"How do you stay organized?", k:["staying organized","organized","organization","keep organized","organisation","tidy desk","stay organised"], a:["A home for everything, a routine for every day, and a clean desk before I leave.","I touch each paper as few times as possible: act on it, file it, or put it in the right tray.","Routines. The less I have to remember, the more I can focus."], more:["My end-of-day tidy takes ten minutes and saves me thirty the next morning.","I review my trays every afternoon so nothing grows roots."], ex:["For example, every jacket on my desk is in a labeled tray, not a pile. Piles are where paper goes to hide."], why:["Because a tidy system means I find things in seconds, even on the busiest day."] },
    { id:"typical-day", q:"What is a typical day like for you?", k:["typical day","a day in","daily routine","normal day","usual day","workday","what you do all day"], a:["Check the manager's calendar, review new deals, chase missing items, answer calls, scan and file. Repeat with coffee.","Mornings are planning and paperwork, afternoons are phone calls and whatever the showroom throws at me.","A mix of quiet paperwork and sudden rushes. No two days are exactly the same."], more:["Around midday the deals from the day before are usually ready for review, so that is my deep-focus block.","Late afternoon is wrap-up: update the stip list, prep tomorrow's calendar, tidy the desk."], ex:["For example, a normal Tuesday might include three funding packages, two meetings to prep and one printer drama."], why:["Because a steady rhythm keeps the paperwork from piling up."] },
    { id:"morning-routine", q:"What is your morning routine at the desk?", k:["morning routine","start of the day","first thing","mornings","opening the office","morning checklist"], a:["Coffee, calendar, inbox, trays. In that order.","I look at the manager's schedule first, then any deals that came in after I left yesterday.","I check what is urgent, update my list, and make sure the printer has paper before the day starts."], more:["I also scan the voicemail for anything time-sensitive, like a lender asking for a document.","Ten quiet minutes in the morning are the most productive of my day."], ex:["For example, if the manager has a meeting at nine, I print the reports for it before eight thirty."], why:["Because a calm start makes the busy hours easier to handle."] },
    { id:"busiest-days", q:"What are your busiest days?", k:["busiest days","busy days","weekends","saturdays","rush days","busy times","peak days"], a:["Weekends and the end of the month. The showroom gets busy and the paperwork follows Monday morning.","Monday after a big weekend, and the last few days of the month. You can feel it in the air.","Sale events and month end. That is when my trays fill up the fastest."], more:["Holiday weekends with promotions can bring a wave of deliveries too.","I prepare for busy days the day before: extra forms printed, trays emptied, supplies stocked."], ex:["For example, a Monday after a busy weekend can bring a stack of jackets taller than my coffee cup."], why:["Because that is when customers have time to shop, and when monthly goals are on the line."] },
    { id:"end-of-month", q:"What is the end of month rush like?", k:["end of month","month end","month-end rush","end of the month","closing the month","month close"], a:["Busy! Everyone wants their deals counted for the month, so the paperwork moves fast and has to be right.","It is the dealership's version of a sprint. Lots of deliveries, lots of signatures, lots of coffee.","Exciting and a little chaotic. My job is to keep the chaos on the showroom side, not in the files."], more:["I keep extra blank forms ready and clear my desk in advance so I have space for the wave.","After the rush comes the cleanup: chasing every missing item from those fast deals."], ex:["For example, on the last day of the month I might check jackets until closing time so they are complete for the count."], why:["Because monthly results matter a lot in a dealership, and every deal counts."] },
    { id:"daily-monthly-paperwork", q:"What paperwork do you do daily and monthly?", k:["daily paperwork","monthly paperwork","daily reports","monthly reports","recurring tasks","routine paperwork"], a:["Daily: new deals, missing items, scanning and the manager's schedule. Monthly: summaries, archiving and closing out loose ends.","Each day has its stack, and each month has its bigger clean-up.","Daily is about keeping deals moving; monthly is about making sure nothing got left behind."], more:["I keep a recurring checklist for monthly tasks so I do not rely on memory.","At month start, I review last month's incomplete jackets before the new month buries them."], ex:["For example, the first week of the month I box up the previous month's completed jackets for archiving."], why:["Because small daily habits prevent big monthly messes."] },
    { id:"sales-reports", q:"Do you prepare sales reports?", k:["sales reports","sales report","reports","daily sales","sales numbers","sales summary"], a:["I help pull them together for the manager: units sold, deals pending, what is waiting on paperwork.","Yes, mostly summaries the manager reviews each morning or before meetings.","I prepare the paper side of the report and make sure the numbers match the deals I have in hand."], more:["I double check totals against the actual jackets. A report is only as good as the files behind it.","The manager likes them short, so I put the key numbers at the top."], ex:["For example, a morning report might show deals delivered yesterday, deals pending funding and deals missing items."], why:["Because the manager makes decisions from those numbers, so they need to be right."] },
    { id:"double-checking-numbers", q:"How do you double check numbers?", k:["double checking","double check numbers","checking numbers","verify numbers","math check","number check","totals"], a:["I check the same number in two places: the order and the contract, the report and the jacket.","Twice, and the second time I read it backwards. It is surprising what that catches.","I compare, I recalculate, and if it still looks odd, I ask before I assume."], more:["Transposed digits are the classic mistake. A 69 that should be a 96 looks fine until it does not.","For VINs I read them out loud in chunks of four. Silly, but it works."], ex:["For example, I once caught a mileage typo because the trade appraisal and the odometer form disagreed by one digit."], why:["Because a small number mistake can delay a deal or a title for weeks."] },
    { id:"vin-checks", q:"Why do you check the VIN so carefully?", k:["vin","vin number","vehicle identification number","vin check","serial number","vins"], a:["The vehicle identification number ties every document to the exact car. One wrong character and the paperwork is about a different vehicle.","Because it is the car's fingerprint. Every form in the jacket should show the same one.","I check it on the order, the contract, the title work and the odometer statement. They must all match."], more:["I compare the last six or eight characters first, then the whole thing. It is where typos love to hide.","If a VIN is wrong, I flag it before anything is signed or sent."], ex:["For example, a swapped letter and number in a VIN can send title paperwork back from the agency."], why:["Because a mismatched VIN can hold up registration and funding."] },
    { id:"reading-contracts", q:"How do you read a contract carefully?", k:["reading contracts","read a contract","contract review","reviewing contracts","fine print","contract check","contracts"], a:["Slowly, in the same order every time: names, vehicle, numbers, dates, signatures. I am checking completeness, not giving legal opinions.","With a ruler under each line and a fresh coffee. No skimming allowed.","I look for consistency: does every page agree with the others? If not, it goes back to the right person."], more:["I am not a lawyer and I do not interpret terms. If something looks off, I ask the finance office or the manager.","Blank spaces matter. A field that should be filled but is empty is a flag."], ex:["For example, I make sure the names are spelled the same on the agreement, the contract and the title paperwork."], why:["Because a careful read in the office avoids a frustrating call to the customer later."] },
    { id:"deadlines", q:"How do you handle deadlines?", k:["deadlines","deadline","due dates","time limits","on time","late paperwork"], a:["Every deadline goes on the calendar with a reminder a few days early, not on the day itself.","I work backward from the due date and set my own deadline sooner.","Deadlines are not suggestions. If one is at risk, I say so early."], more:["Title and registration work, temporary tags and funding all have timelines, so I track them on one list.","The earlier I raise a problem, the more ways there are to fix it."], ex:["For example, if a temp tag is close to expiring and title work is not done, it goes straight to the top of my list."], why:["Because missed deadlines cause headaches for customers and the dealership."] },
    { id:"calendar-management", q:"How do you manage the manager's calendar?", k:["manager's calendar","managers calendar","calendar","schedule","calendar management","booking time","manager schedule"], a:["I protect their time like it is the last cookie in the break room. Meetings get buffers, and focus blocks stay blocked.","Every request goes through me, and I fit it where it makes sense for the day.","I keep their calendar realistic: no back-to-back marathons and room for the surprises that always happen."], more:["I add short notes to each meeting so they know what it is about without asking.","I leave open slots for the showroom, because managers are always needed out there."], ex:["For example, I keep the first hour of the day clear so they can review reports before anyone grabs them."], why:["Because a manager with a sane schedule makes better decisions."] },
    { id:"scheduling-appointments", q:"How do you schedule appointments?", k:["scheduling appointments","appointments","book an appointment","booking meetings","set up meeting","appointment scheduling"], a:["I check the calendar, offer two or three options and confirm in writing.","Clear time, clear place, clear purpose. Then a reminder the day before.","I try not to schedule anything right before a big event like month end."], more:["Rescheduling is part of life here, so I keep notes on who is flexible and who is not.","I always add the phone number or contact details right in the appointment."], ex:["For example, a vendor asks for time, I offer Tuesday at ten or Thursday at two, and confirm the one they pick."], why:["Because a clear booking prevents double bookings and no-shows."] },
    { id:"phone-email", q:"Do you handle the manager's phone and email?", k:["phone calls","email","manager's email","answering phones","inbox","voicemail","phone and email"], a:["I screen and sort: what needs the manager, what I can handle, and what can go to someone else.","Yes, I keep the inbox under control and take clear messages from calls.","I am the first filter. The manager sees what matters, and the rest gets handled."], more:["A good message has the name, the reason, a callback number and the best time to call.","I flag urgent emails and summarize long threads into one or two lines."], ex:["For example, a lender calls asking for a document; I send it myself instead of interrupting the manager's meeting."], why:["Because the manager's attention is limited, and I help spend it wisely."] },
    { id:"taking-messages", q:"How do you take a good phone message?", k:["phone message","taking messages","message slip","call back","phone notes","messages"], a:["Who called, why, how to reach them, and how urgent it is. Written clearly, not in my secret shorthand.","Name, number, reason, time. I repeat the number back to the caller every time.","A message is only useful if the person can act on it without calling me first."], more:["I also note what I already told the caller, so the manager does not repeat or contradict it.","Urgent messages get delivered in person, not left on the desk."], ex:["For example: 'Lender rep called at 2:15 about a missing stip on a deal, needs it by tomorrow, callback number below.'"], why:["Because a vague message just creates another phone call."] },
    { id:"meeting-prep", q:"How do you prepare the manager for meetings?", k:["meeting prep","preparing for meetings","prepare meetings","meeting materials","briefing notes","agenda"], a:["A short summary, the latest numbers and the key documents, all on their desk before the meeting starts.","I gather what they need, print what they like on paper and put the rest in one email.","I make sure they walk in knowing who will be there, why, and what decision is expected."], more:["I keep the briefing to one page. If they want more, the full details are in the folder.","After the meeting, I note any follow-ups and put them on the calendar."], ex:["For example, before a monthly review I print the sales summary, the pending deals list and last month's notes."], why:["Because a prepared manager runs shorter meetings, and everyone loves a shorter meeting."] },
    { id:"what-manager-does", q:"What does a dealership manager do?", k:["dealership manager","sales manager","general manager","manager's job","manager role","the manager"], a:["In general terms, they oversee the team, approve deals, watch the numbers and solve the problems nobody else can.","They balance customers, staff, inventory and results, often all before lunch.","They make the big calls and keep the dealership moving. I keep the paperwork moving so they can."], more:["They also spend a lot of time on the showroom floor, which is why their calendar needs breathing room.","Every deal eventually crosses their desk in some form."], ex:["For example, a manager might review a deal, then step out to meet a customer, then jump into a planning meeting."], why:["Because a dealership has many moving parts, and someone has to steer."] },
    { id:"working-with-boss", q:"How do you work well with a boss?", k:["working with a boss","work with manager","good boss relationship","supporting a manager","boss","manager support"], a:["Learn how they like information, anticipate what they will need, and never surprise them with bad news late.","I figure out their rhythm and work around it. Some bosses want details, some want the headline.","Be reliable, be clear and be early. Those three cover most of it."], more:["I ask once how they want something done, then I do it that way every time.","Bringing a problem with a suggested fix is always better than bringing just the problem."], ex:["For example, if my manager prefers a printed summary, I print it, even in a mostly digital office."], why:["Because trust grows when the boss knows things are handled without checking."] },
    { id:"saying-no", q:"How do you say no politely?", k:["saying no","say no","decline politely","pushing back","turning down","politely refuse"], a:["I say what I can do instead: 'Not right now, but I can have it done by three.'","Kindly and with a reason. A clear no is more helpful than a maybe that never happens.","I offer an alternative. People rarely mind a no when it comes with a plan."], more:["For the manager's time, I am the polite gatekeeper. 'They are booked, but I can get you ten minutes tomorrow.'","Tone matters more than words. A smile helps, even on the phone."], ex:["For example: 'I cannot pull that file during month end, but I will have it on your desk first thing Monday.'"], why:["Because protecting time and priorities is part of doing the job well."] },
    { id:"keeping-calm", q:"How do you keep calm on busy days?", k:["keeping calm","stay calm","stress","busy day calm","calm under pressure","stressful days","chaos"], a:["I write everything down. A list on paper is much less scary than a list in my head.","One task at a time, deep breath, and a fresh coffee if the situation calls for it.","I remind myself that panic does not file anything. Calm hands, steady checklist."], more:["Preparing the day before helps the most. Busy days are easier when the supplies and forms are ready.","If something is truly on fire, I fix that first and let the small stuff wait."], ex:["For example, during a month-end rush I keep a running list on a notepad and cross things off as they move."], why:["Because a calm desk helps the whole office stay calm."] },
    { id:"coffee-paperwork", q:"Do you drink coffee while doing paperwork?", k:["coffee","coffee and paperwork","coffee mug","caffeine","coffee break","coffee spill"], a:["Yes, but always with a lid and always on the far side of the desk from the contracts.","Coffee is my partner in paperwork. Just never too close to the paperwork.","Absolutely. One rule: the mug lives to the right, the jackets live to the left."], more:["I learned early that a coffee ring on a contract is not a good look.","The coffee machine in the break room is also where I hear about deals before they reach my desk."], ex:["For example, my mug sits on a coaster well away from the signing pile. Nonnegotiable."], why:["Because a spilled coffee can ruin a signed page, and reprinting means calling the customer back."] },
    { id:"working-with-sales", q:"How do you work with the sales staff?", k:["sales staff","salespeople","sales team","salesperson","sales consultants","working with sales"], a:["We are on the same team. They bring in the deals, I make sure the paperwork holds up.","I give them clear lists of what is missing, and they help me get it from customers.","Friendly and direct. They know a flag from me means 'please fix this soon.'"], more:["I try to catch problems before the customer leaves, so nobody has to call them back.","A quick checklist for the sales team cut down missing signatures a lot."], ex:["For example, I might stop by a desk and say, 'Your deal from yesterday just needs one initial on page two.'"], why:["Because good teamwork means deals close faster and customers are happier."] },
    { id:"finance-office", q:"What does the finance office do?", k:["finance office","finance manager","business office","f and i","finance department","finance desk"], a:["In general terms, they handle the financing side of deals: working with lenders and preparing the financing documents.","They take the customer through the financing and optional products paperwork. I help keep it all complete afterwards.","They are the bridge between the customer, the deal and the lender."], more:["I work closely with them on stips and funding packages. We share a lot of checklists.","They are busy people, so I bring them clear lists rather than lots of interruptions."], ex:["For example, if a lender sends back a package, the finance office and I go through it together to fix what is missing."], why:["Because financed deals need careful paperwork, and they are the experts on that part."] },
    { id:"service-department", q:"Do you work with the service department?", k:["service department","service","service advisors","repair shop","service team","service writer"], a:["Sometimes, especially when a car needs work before delivery or when a document involves a repair.","Yes, they are down the hall. We trade paperwork now and then, like repair orders tied to a deal.","They keep the cars running; I keep the paper running. We get along nicely."], more:["If a new car needs an accessory installed or a check before delivery, I make sure the timing fits the delivery appointment.","Service paperwork has its own system, but I know who to ask when a deal needs something from them."], ex:["For example, if a customer's car needs a final check before pickup, I confirm with service before booking the delivery."], why:["Because a delivery depends on the car being ready, not just the paperwork."] },
    { id:"parts-department", q:"Do you work with the parts department?", k:["parts department","parts","parts counter","accessories","parts team","ordering parts"], a:["Now and then, usually when a deal includes accessories that need to be ordered or installed.","Not daily, but when a customer adds something to their car, the parts team is involved.","They are the masters of tiny numbers and part codes. I respect that."], more:["I make sure any accessory on the buyer's order is noted so the parts team can order it in time.","A missed accessory note can delay a delivery, so I double check it."], ex:["For example, if a buyer orders floor mats or a roof rack, I confirm parts has it before the delivery date."], why:["Because what was promised on paper should be on the car at delivery."] },
    { id:"receptionist", q:"How do you work with the receptionist?", k:["receptionist","front desk","reception","front counter","greeting customers","switchboard"], a:["Closely! The receptionist sends calls and visitors my way and keeps me posted on who is waiting.","They are the air traffic control of the dealership. I am very nice to them.","We share information all day: who is here, who is calling, who is on the way."], more:["I give them a quick daily note of the manager's availability so they can route calls correctly.","When the receptionist is busy, I help cover the phones for a few minutes."], ex:["For example, the receptionist lets me know a customer is early for a delivery so I can get the paperwork ready."], why:["Because the first impression starts at the front desk, and it helps when we are in sync."] },
