      more:["Every web person has said it works on my machine at least once.","Final_final_v3 is not a file name, it is a cry for help."],
      ex:["For example, the client asking to make the logo bigger. Classic."],
      why:["Because a bit of dry humor makes the broken days easier."] },

    { id:"common-mistakes", q:"What are common website mistakes?", k:["common mistakes","website mistakes","web mistakes","bad practices","errors to avoid"],
      a:["Huge images, vague titles, broken links, and forms nobody tested.","Changing URLs without redirects. It throws away traffic overnight.","Writing for the company instead of the visitor.","Launching on Friday afternoon. Enough said."],
      more:["Hiding important info in PDFs or images instead of real text.","Letting domains or certificates expire because nobody owned the renewal."],
      ex:["For example, deleting old product pages without redirects and losing all their search traffic."],
      why:["Because most problems are avoidable with simple habits."] },

    { id:"fonts-web", q:"Do fonts affect website speed?", k:["fonts","web fonts","typography","font loading","custom fonts","font files"],
      a:["Yes. Every font file is a download. Two or three styles are plenty.","Readable first, stylish second. And always load them efficiently.","Too many font weights slow pages down and add nothing.","System fonts are the fastest of all, and they look fine."],
      more:["Fonts should show fallback text while loading, so the page is readable right away.","Line length and spacing matter as much as the font itself."],
      ex:["For example, cutting a site from eight font files to three with no visible change."],
      why:["Because text is the content, so it should appear instantly."] },

    { id:"video-on-web", q:"How do you handle video on a website?", k:["video","videos","embedded video","background video","video hosting","video size"],
      a:["Compressed, captioned, and not autoplaying with sound. Ever.","Big videos are best hosted on a video platform and embedded, not uploaded to the site.","Background videos should be short, silent, light and pausable.","A clear thumbnail and a short video beat a long one nobody finishes."],
      more:["Videos should load only when needed, so they do not slow the whole page.","On mobile, a static image can replace a background video to save data."],
      ex:["For example, a 20 second loop of a flame effect as a muted background, with a pause button."],
      why:["Because video is powerful but heavy."] },

    { id:"where-to-buy", q:"What if a site does not sell online?", k:["where to buy","find a retailer","no online store","dealer locator","retailers","buy button"],
      a:["Then the job is to inform and guide people to retailers, not to push a cart.","Clear Where to Buy links on every product page. That is the call to action.","Wording matters. Browse, Find and Explore instead of words that suggest buying here.","The site's job becomes great information plus a clear path to a retailer."],
      more:["A dealer locator should be easy to find and work well on phones.","Product pages still need everything: specs, images, manuals, so people buy confidently elsewhere."],
      ex:["For example, a Find a Retailer button below the specs on each product page."],
      why:["Because sending people the wrong signal creates frustration."] },

    { id:"ux-basics", q:"What is user experience?", k:["user experience","ux","usability","user friendly","easy to use","usability testing"],
      a:["How it feels to use a site: easy, clear and quick, or confusing and slow.","Good UX means people find what they need without thinking about it.","Watch someone use your site for five minutes. You will learn more than in a week of meetings.","UX is mostly removing obstacles."],
      more:["Small things count: button labels, loading speed, clear errors.","Testing with real people beats internal opinions every time."],
      ex:["For example, moving the manual download link higher after seeing people scroll looking for it."],
      why:["Because a site that is hard to use does not get a second chance."] },

    { id:"calls-to-action", q:"What is a call to action?", k:["call to action","cta","buttons","button text","next step","action button"],
      a:["The button or link that tells people what to do next.","Clear and specific: Download Manual beats Click Here.","One main action per section, so people are not confused.","It should look clickable, be easy to tap and say what happens."],
      more:["Too many equal buttons means none of them stand out.","Button text should start with a verb."],
      ex:["For example, a product page with Find a Retailer as the main button and Compare as a secondary link."],
      why:["Because every page should lead somewhere."] },

    { id:"breadcrumbs", q:"What are breadcrumbs on a website?", k:["breadcrumbs","breadcrumb","breadcrumb trail","navigation trail","you are here"],
      a:["The small trail at the top showing where you are: Home, Category, Product.","They help people go back up a level without hitting the back button.","Small, quiet and very useful on big catalogs.","Search engines like them too, since they show the site structure."],
      more:["They should match the real structure of the site.","On mobile, a shortened version saves space."],
      ex:["For example, Home, Heaters, Wall Heaters, then the product name."],
      why:["Because knowing where you are makes it easier to explore."] },

    { id:"broken-data-imports", q:"What happens when product data imports go wrong?", k:["import errors","failed import","data sync","sync failed","bad data","import problems"],
      a:["Products can show old info, lose categories or disappear. So I check after big imports.","One bad row can block a whole import. Finding it is detective work.","The fix is usually upstream in the data, not on the page.","I keep a short checklist for the morning after an import."],
      more:["Checking a few known products quickly tells me if the import worked.","Products that come back after being removed may need their settings and categories set again."],
      ex:["For example, a new product imported but hidden by default, waiting to be enabled."],
      why:["Because the site is only as good as the data feeding it."] },

    { id:"duplicate-content", q:"What is duplicate content?", k:["duplicate content","duplicate pages","copied content","canonical","same content","duplicate text"],
      a:["The same content on several URLs, which confuses search engines about which to show.","It happens with variants, filters and copied descriptions.","One main version per page, and point the others to it.","Unique descriptions for similar products help a lot."],
      more:["A canonical setting tells search engines which version is the main one.","Old copies of pages should be redirected, not left lying around."],
      ex:["For example, a product reachable from two category URLs, with one marked as the main version."],
      why:["Because splitting attention between copies weakens all of them."] },

    { id:"structured-data", q:"What is structured data?", k:["structured data","schema","rich results","rich snippets","schema markup","product schema"],
      a:["Extra code that describes a page to search engines: this is a product, here is its name and image.","It can make search results richer, with images or ratings.","Invisible to visitors, very readable for search engines.","It works best when the page data is already clean and consistent."],
      more:["Product, breadcrumb and organization info are common types.","Testing tools check if it is set up correctly."],
      ex:["For example, a product page telling search engines the product name, model and image in a structured way."],
      why:["Because clear signals help search engines show your pages well."] },

    { id:"web-standards", q:"Why do web standards matter?", k:["web standards","standards","valid code","best practices","semantic html","clean code"],
      a:["They make sure sites work across browsers and devices, now and later.","Following standards means fewer weird bugs and better accessibility.","Clean, standard code ages well. Hacks age badly.","It is like grammar for the web."],
      more:["Semantic code, using the right element for the job, helps screen readers and search engines.","Validators can check for errors in code."],
      ex:["For example, using a real list element for a list of features instead of lines with dashes."],
      why:["Because standards are what make the web work for everyone."] },

    { id:"ownership", q:"Why does every page need an owner?", k:["page owner","content owner","ownership","who owns","responsibility","content governance"],
      a:["Pages without owners go out of date and nobody notices.","Every section should have someone who knows when it needs updating.","Ownership answers the question who approves this, before it becomes a debate.","I own the site, but the facts on it come from the teams who know them."],
      more:["A simple list of sections and owners avoids a lot of confusion.","Review dates help: every page gets a check at least once a year."],
      ex:["For example, the support team owning the FAQ and reviewing it every quarter."],
      why:["Because shared responsibility often means no responsibility."] },

    { id:"saying-no", q:"How do you say no to a request?", k:["saying no","say no","declining requests","pushback","not now","reject request"],
      a:["I usually say not yet, with a reason and a suggestion.","I explain the trade off: if we do this now, that other thing slips.","Sometimes the answer is yes, but differently. A simpler version that solves the real need.","Politely, clearly and with options. Nobody likes a plain no."],
      more:["Asking what problem the request solves often reveals an easier fix.","Pointing to the priority list makes it less personal."],
      ex:["For example, instead of a new page, adding a section to an existing one that already gets traffic."],
      why:["Because protecting the site sometimes means protecting it from good intentions."] },

    { id:"documentation", q:"Do you document your work?", k:["documentation","document","notes","how to guides","runbook","process docs"],
      a:["Yes. Short notes on how things work and why decisions were made.","If I do something twice, I write it down. The third time, it is a checklist.","Good docs mean someone else can cover for me, and I can remember what past me did.","Short and practical. Nobody reads a 40 page manual."],
      more:["Screenshots help a lot for CMS steps.","Docs should be updated when the process changes, or they become traps."],
      ex:["For example, a one page guide for adding a new product to the site."],
      why:["Because memory is not a system."] },

    { id:"automation", q:"Do you automate repetitive tasks?", k:["automation","automate","repetitive tasks","automation scripts","bulk updates","save time"],
      a:["Whenever I can. If I click the same thing a hundred times, there is probably a better way.","Small scripts and bulk imports save hours on catalog work.","Automate the boring, keep the judgement for humans.","Automation is great, but I always check a sample of the results."],
      more:["A bulk change done wrong is a bulk mistake, so I test on a few items first.","Automatic checks, like broken link scans, run on a schedule."],
      ex:["For example, updating image alt text for 200 products from a spreadsheet instead of one by one."],
      why:["Because time spent clicking is time not spent improving."] },

    { id:"calm-under-pressure", q:"How do you stay calm when things break?", k:["stay calm","pressure","stress","calm","things break","keeping cool"],
      a:["Things break, it is part of the web. I focus on the next step, not the panic.","Checklists help. When your brain is rushed, a list thinks for you.","I remind myself that almost everything on a website can be fixed.","Calm is contagious. So is panic. I choose calm."],
      more:["Backups and revisions make most problems recoverable.","After a fix, a short review of what happened helps prevent it next time."],
      ex:["For example, a wrong image published on a big page, swapped back within two minutes."],
      why:["Because rushed fixes create new problems."] },

    { id:"future-of-web", q:"How is the web changing?", k:["future of the web","web trends","trends","changing web","next big thing","web evolution"],
      a:["More mobile, more speed expectations, more focus on accessibility and privacy.","Visitors expect instant answers. Sites need clear content and fast pages more than ever.","Trends come and go, but fast, clear and accessible never goes out of style.","Structured, clean content matters more as it gets reused in more places."],
      more:["Privacy rules keep shaping how sites track visitors.","Good product data feeds many channels now, not just the website."],
      ex:["For example, one clean product description reused on the site, in search results and in retailer listings."],
      why:["Because the basics stay the same even when the tools change."] }
  ],

function normText(s){

}
function lev(a, b, max){

  var m = a.length, n = b.length, prev = [], cur, i, j;
  for (j = 0; j <= n; j++) prev[j] = j;
  for (i = 1; i <= m; i++) {
    cur = [i];
    var lo = i;
    for (j = 1; j <= n; j++) { cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1)); if (cur[j] < lo) lo = cur[j]; }

}
function tokEq(a, b){

/* compiled phrases: arrays of stemmed tokens */
function compile(ph){ return normText(ph).map(stem); }
/* match a phrase in order, allowing one extra word between its tokens; returns matched token indexes or null */
function matchPhrase(inp, ph){

  }

}
function tokW(tok, idf){ return STOP[tok] ? 0.25 : (1 + Math.min(tok.length, 10) / 10) * (idf ? (idf[tok] || 1) : 1); }
function phraseScore(inp, ph, idf){

}
/* knowledge index per person */
var KBI = {};
function indexKB(id){
  var kb = KB[id]; if (!kb) return null;
  var df = {}, idx = { topics:[], idf:{} };
  kb.topics.forEach(function(tp){
    var seen = {};
    var phs = (tp.k || []).map(compile).filter(function(p){ return p.length; });
    var qt = compile(tp.q).filter(function(w){ return !STOP[w]; });
    phs.forEach(function(p){ p.forEach(function(w){ seen[w] = 1; }); });
    qt.forEach(function(w){ seen[w] = 1; });
    Object.keys(seen).forEach(function(w){ df[w] = (df[w] || 0) + 1; });
    idx.topics.push({ tp:tp, phs:phs, qt:qt, qn:normText(tp.q).join(" ") });
  });
  Object.keys(df).forEach(function(w){ idx.idf[w] = 1 / Math.sqrt(df[w]); });
  return idx;
}
function topicScore(I, inp){
  var best = null, bs = 0, joined = inp.raw.join(" ");
  I.topics.forEach(function(T0){
    if (T0.qn === joined) { if (100 > bs) { bs = 100; best = T0.tp; } return; }
    var top = 0, sum = 0;
    T0.phs.forEach(function(ph){
      var s = phraseScore(inp, ph, I.idf);
      if (!s && ph.length > 1) { for (var a = 0; a < ph.length; a++) { if (STOP[ph[a]]) continue; for (var b = 0; b < inp.st.length; b++) if (tokEq(inp.st[b], ph[a])) { s += tokW(ph[a], I.idf) * 0.5; break; } } }
      if (s > top) { sum += top; top = s; } else sum += s;
    });

}

  if (stage.clientWidth <= 640) vtile.style.bottom = (card.offsetHeight + 22) + "px"; else vtile.style.bottom = "";
  var sr = stage.getBoundingClientRect(), tr = vtile.getBoundingClientRect();
  vRect.x = tr.left - sr.left; vRect.y = sr.bottom - tr.bottom; vRect.w = tr.width; vRect.h = tr.height;
  var nm = focus.name + " · " + MOODS[focus.mood.kind].e + " " + MOODS[focus.mood.kind].label;
  if (vtName.textContent !== nm) vtName.textContent = nm;
}
function renderTile(){
  if (!focus || vtile.hidden || vRect.w < 10) return;
  var p = focus, hd = p.heading + p.swivel;
  p.head.getWorldPosition(_vh);
  _vf.set(Math.sin(hd), 0, Math.cos(hd));
  vcam.position.set(_vh.x + _vf.x * 1.15, _vh.y + 0.1, _vh.z + _vf.z * 1.15);
  vcam.lookAt(_vh.x, _vh.y - 0.02, _vh.z);
  vcam.near = 0.62; vcam.far = 12;
  vcam.aspect = vRect.w / vRect.h; vcam.updateProjectionMatrix();
  var sau = renderer.shadowMap.autoUpdate; renderer.shadowMap.autoUpdate = false;
  renderer.getClearColor(_cc); var ca = renderer.getClearAlpha();
  renderer.setScissorTest(true);
  renderer.setScissor(vRect.x, vRect.y, vRect.w, vRect.h);
  renderer.setViewport(vRect.x, vRect.y, vRect.w, vRect.h);
  renderer.setClearColor(vClear, 1); renderer.clear(true, true, false);
  var bg = scene.background; scene.background = vClear;
  renderer.render(scene, vcam);
  renderer.shadowMap.autoUpdate = sau;
  scene.background = bg;
  renderer.setScissorTest(false);
  renderer.setViewport(0, 0, stage.clientWidth, stage.clientHeight);
  renderer.setClearColor(_cc, ca);
}

/* ---------- loop ---------- */
var headPos = new V3(), tv = new V3(), lastSlow = 0, lastSave = 0, workSayAt = 8, rects = [];
for (var ri = 0; ri < PEOPLE.length; ri++) rects.push({ l:0, r:0, t:0, b:0 });
var order = PEOPLE.slice();
function frame(){
  if (!running) return;
  requestAnimationFrame(frame);
  var f0 = performance.now();
  var dt = Math.min(clock.getDelta(), 0.05), t = clock.elapsedTime;
  for (var i = 0; i < PEOPLE.length; i++) updateAgent(PEOPLE[i], t, dt);
  updateChats(t);
  for (i = 0; i < PEOPLE.length; i++) { updateRig(PEOPLE[i], t, dt); updateFace(PEOPLE[i], t); }
  updateToolFx(t);

  /* room ambience */
  var calling = BY.angeles.act && BY.angeles.act.n === "call";
  phoneLamp.color.setHex(calling ? 0x3fa36b : (Math.sin(t * 9) > 0 ? 0xff3b30 : 0x5a1612));
  for (i = 0; i < queueLamps.length; i++) queueLamps[i].color.setHex(Math.sin(t * 2.2 + i * 1.3) > 0.2 ? 0x3fa36b : (i === 2 && Math.sin(t * 6) > 0 ? 0xe0a030 : 0x1e5136));
  ledMat.color.setHSL(0.68 + 0.05 * Math.sin(t * 0.4), 0.8, 0.62);
  deskLampLight.intensity = 0.65 + 0.03 * Math.sin(t * 0.7);

  /* slow tick (about 10 Hz): bubbles, need icons, card bars, save, work chatter */
  var slow = t - lastSlow > 0.1;
  if (slow) {
    lastSlow = t;
    if (t > workSayAt) {
      workSayAt = t + rand(14, 26);
      var cand = PEOPLE.filter(function(q){ return q.state === "sit" && !q.chatWith && !q.say && !busyAct(q); });
      if (cand.length) { var wq = choose(cand); say(wq, choose(WORKSAY[wq.id]), 2.6); }
    }
    for (i = 0; i < PEOPLE.length; i++) {
      var p = PEOPLE[i];
      if (p.say && t > p.say.until) p.say = null;
      if (p.say && p.act && (p.act.n === "nap" || p.act.n === "napStand") === false && p.say.text === "Zzz...") p.say = null;
      showBubble(p, p.chatLine || (p.say ? p.say.text : null));
      var low = lowest(p), icon = low && low.v < LOWLINE ? NEED_ICON[low.k] : "";
      if (p.act && (p.act.n === "nap" || p.act.n === "napStand")) icon = "\u{1F4A4}";
      if (icon !== p.needText) { p.needText = icon; p.tagNeed.textContent = icon; }
    }
    if (focus) renderCare(focus);
    layoutTile();
    if (t - lastSave > 20) { lastSave = t; saveCare(); }
  }

  if (focus) {
    focus.head.getWorldPosition(headPos);
    goal.tx = headPos.x; goal.ty = headPos.y - 0.35; goal.tz = headPos.z;
    var sw = stage.clientWidth, sh = stage.clientHeight, upp = 2 * view.r / Math.max(1, sh);
    if (sw > 640) { var off = (Math.min(card.offsetWidth + 16, sw * 0.45) - (!vtile || vtile.hidden ? 0 : 236)) / 2 * upp; goal.tx -= camRight.x * off; goal.tz -= camRight.z * off; }
    else { var offv = Math.min(card.offsetHeight, sh * 0.64) / 2 * upp; goal.tx -= camUp.x * offv; goal.ty -= camUp.y * offv; goal.tz -= camUp.z * offv; }
  }
  var kk = snapCam > 0 ? 1 : 1 - Math.exp(-dt * (dragging ? 14 : reduceMotion ? 9 : 3.2));
  if (snapCam > 0) snapCam--;
  view.tx = lerp(view.tx, goal.tx, kk); view.ty = lerp(view.ty, goal.ty, kk); view.tz = lerp(view.tz, goal.tz, kk);
  view.r = lerp(view.r, goal.r, kk); view.th = lerp(view.th, goal.th, kk); view.ph = lerp(view.ph, goal.ph, kk);
  var idle = reduceMotion ? 0 : clamp(t - lastInteract - 4, 0, 3) / 3;
  if (lastInteract < 0) idle = reduceMotion ? 0 : 1;
  basis(view.th + idle * 0.04 * Math.sin(t * 0.17), view.ph + idle * 0.012 * Math.sin(t * 0.23));
  camera.position.set(view.tx + camDir.x * 70, view.ty + camDir.y * 70, view.tz + camDir.z * 70);
  camera.lookAt(view.tx, view.ty, view.tz);
  camera.left = -view.r * aspect; camera.right = view.r * aspect; camera.top = view.r; camera.bottom = -view.r;
  camera.updateProjectionMatrix();

  if (focus) {
    focusRing.visible = true;
    var mk = MOODS[focus.mood.kind].e + " " + MOODS[focus.mood.kind].label;
    if (cMood.textContent !== mk) cMood.textContent = mk;
    focusRing.position.set(focus.root.position.x, 0.014, focus.root.position.z);
    ringMat.opacity = 0.6 + 0.3 * Math.sin(t * 4);
    if (cStatus.textContent !== focus.statusNow) cStatus.textContent = focus.statusNow;
  } else focusRing.visible = false;

  if (composer) { try { composer.render(dt); } catch (e) { composer = null; renderer.render(scene, camera); } }
  else renderer.render(scene, camera);
  renderTile();

  /* labels follow every frame; overlap culling is cheap with four people */
  var w = stage.clientWidth, h = stage.clientHeight, np = 0;
  order.sort(function(a, b){ return (a === focus ? -1 : 0) - (b === focus ? -1 : 0) || (a.root.position.x + a.root.position.z) - (b.root.position.x + b.root.position.z); });
  for (i = 0; i < order.length; i++) {
    var q = order[i], tag = q.tag;
    q.head.getWorldPosition(tv); tv.y += 0.3; tv.project(camera);
    if (tv.z > 1 || tv.x < -1.2 || tv.x > 1.2 || tv.y < -1.2 || tv.y > 1.2) { tag.classList.add("off"); continue; }
    var x = (tv.x + 1) / 2 * w, y = (1 - tv.y) / 2 * h;
    if (!q.tagW) { q.tagW = tag.offsetWidth || 70; q.tagH = tag.offsetHeight || 22; }
    var R = rects[np];
    R.l = x - q.tagW / 2; R.r = x + q.tagW / 2; R.t = y - q.tagH - 6; R.b = y - 6;
    var hit = false;
    for (var j = 0; j < np; j++) { var Q = rects[j]; if (R.l < Q.r + 4 && R.r > Q.l - 4 && R.t < Q.b + 2 && R.b > Q.t - 2) { hit = true; break; } }
    if (hit && q !== focus && !q.bubbleOn) { tag.classList.add("off"); continue; }
    np++;
    tag.classList.remove("off");
    tag.style.transform = "translate(" + x.toFixed(1) + "px," + y.toFixed(1) + "px) translate(-50%,-100%) translateY(-6px)";
    tag.style.zIndex = q === focus ? 2000 : String(Math.round((1 - tv.z) * 900));
    if (q.tagText !== q.statusNow) { q.tagText = q.statusNow; q.tagSt.textContent = q.statusNow; }
  }

  updatePings(t, w, h);

  /* adaptive quality: average frame rate over two seconds, step down when it stays under 45 */
  quality.frames++; quality.acc += Math.min(0.5, (f0 - (quality.last || f0)) / 1000); quality.last = f0; quality.ms = lerp(quality.ms, performance.now() - f0, 0.05);
  if (quality.acc >= 2) {
    quality.fps = quality.frames / quality.acc; quality.frames = 0; quality.acc = 0;
    if (quality.fps < 45 && t > 4) { quality.slow++; if (quality.slow >= 2 && quality.level < 4) { degrade(); quality.slow = 0; } }
    else quality.slow = 0;
  }
}
requestAnimationFrame(frame);
})();
</script>
