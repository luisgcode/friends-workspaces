    { id:"customers-waiting", q:"What do you do when customers are waiting?", k:["customers waiting","waiting customers","waiting room","customer wait","long waits","waiting area"], a:["I move their paperwork to the front of the line. Waiting customers come first.","I make sure someone checks on them and that their documents are ready the moment they are needed.","I try to keep the paper side quick, so the wait is for the car, not for us."], more:["If something is missing, I tell the salesperson right away so they can explain to the customer honestly.","A quick update to a waiting customer goes a long way."], ex:["For example, if a customer is in the lounge for a signing, I print and flag the forms before they are called in."], why:["Because a customer's time matters, and a good wait experience is part of a good sale."] },
    { id:"deliveries", q:"What happens when a new car is delivered?", k:["car delivery","deliveries","new car delivery","delivery day","picking up a car","handover"], a:["The customer signs the final paperwork, gets a walkaround of the car, and drives home happy. My part is the paperwork being ready.","Delivery is the fun part. Everyone smiles, and I make sure the jacket is complete before the keys go out.","Final signatures, temp tag if needed, keys and a little celebration. I see it from my window."], more:["I prepare a delivery checklist so nothing is forgotten: documents, copies, manuals, keys.","After delivery, the jacket comes back to me for a final review."], ex:["For example, before a Saturday delivery, I lay out the forms in signing order with flags on each signature line."], why:["Because a smooth delivery is the moment customers remember."] },
    { id:"delivery-checklist", q:"What is on a delivery checklist?", k:["delivery checklist","delivery list","pre-delivery","handover checklist","delivery form","delivery steps"], a:["Signed documents, copies for the customer, temp tag if needed, keys, manuals and a quick walkthrough of features.","It is a list that makes sure the customer leaves with everything, and we keep everything we need.","Paperwork, keys, car ready, customer happy. Checked, checked, checked, checked."], more:["The checklist gets signed or initialed and goes into the jacket.","It also reminds the salesperson to explain basics like how to pair a phone or where the spare key is."], ex:["For example, checking that both keys are handed over saves a confused phone call a week later."], why:["Because forgetting one small item can turn a great delivery into an awkward follow-up."] },
    { id:"test-drive-forms", q:"What is a test drive form?", k:["test drive form","test drive","test drives","demo drive","test drive agreement","drive form"], a:["It is a short form completed before a customer takes a car out, usually with their details and a copy of their license. Policies vary.","It records who drove which car and when. Simple, but important.","A quick piece of paper that keeps things organized and safe before the keys leave the building."], more:["The license copy attached to it is handled as confidential, like any other ID.","I keep test drive forms in a separate file from deal jackets unless the customer ends up buying."], ex:["For example, a salesperson fills it out, makes the ID copy, and the form goes into the test drive file at the end of the day."], why:["Because the dealership needs to know who has each car on the road."] },
    { id:"showroom-view", q:"What can you see from your window?", k:["showroom view","window","showroom","the window","view from office","showroom floor"], a:["The showroom floor! Shiny cars, salespeople, customers sitting in the driver's seat pretending they already own it.","I can see deals happening before they reach my desk. A handshake out there means a jacket heading my way.","A little bit of everything: cars, people, balloons on sale days."], more:["I can usually tell how busy my afternoon will be by counting people at the sales desks.","When a delivery happens right outside, I sometimes wave. The paperwork is done, so I am allowed."], ex:["For example, when I see a car being washed and parked near the door, I know a delivery is coming and get the forms ready."], why:["Because the showroom is where my work begins, even if I handle it from the back office."] },
    { id:"back-office", q:"What is your office like?", k:["back office","your office","office setup","your desk","workspace","office room"], a:["A back office with a big desk, trays of folders, a filing cabinet, a printer and a window onto the showroom.","Organized chaos, but mostly organized. Everything has a labeled home.","Paper everywhere, but every stack has a purpose. The manager's door is just a few steps away."], more:["My desk faces the door so I can see who is coming before they ask for something.","The printer is close enough to reach but far enough that its noise does not drive me crazy."], ex:["For example, my left side holds incoming jackets, my right side holds ready-to-file, and the middle is where the work happens."], why:["Because a well-arranged room makes the paperwork flow in one direction."] },
    { id:"tools-she-uses", q:"What tools do you use every day?", k:["tools","tools you use","everyday tools","office tools","equipment","work tools"], a:["A computer, the dealership's software, a scanner, a printer, a label maker and a calendar. Plus a very loyal stapler.","Mostly the computer and the dealership system, but paper tools still matter: folders, flags, clips.","Digital and paper side by side. The scanner is the bridge between them."], more:["The dealership software tracks deals and inventory, and I keep my notes in it so others can see the status.","My most underrated tool is a simple notepad for the day's running list."], ex:["For example, a typical deal touches the computer, the printer, the scanner and three colors of flags."], why:["Because the right tool for each step keeps the work fast and accurate."] },
    { id:"dealership-software", q:"What does the dealership software do?", k:["dealership software","dealer software","management system","dealer system","computer system","deal software"], a:["In general terms, it tracks deals, customers, inventory and accounting, all in one place.","It is the central system for the dealership. I use it to check deal status and record what is done.","It holds the digital side of every deal. The jacket is the paper side."], more:["I keep notes in the system so anyone can see why a deal is waiting.","Each department uses different parts of it, so knowing who updates what saves time."], ex:["For example, when a funding package goes out, I update the deal status so the manager can see it right away."], why:["Because everyone in the dealership needs the same information at the same time."] },
    { id:"paper-vs-digital", q:"Do you prefer paper or digital?", k:["paper vs digital","paper or digital","paperless","digital office","going paperless","paper versus digital"], a:["Both, honestly. Digital is faster to search; paper is easier to review page by page.","I love a good digital file, but I still catch more mistakes on paper with a pen in my hand.","Digital for storage, paper for checking. That is my compromise."], more:["More and more deals are going digital, which means fewer printer jams. I am not complaining.","The skills are the same either way: completeness, accuracy and good naming."], ex:["For example, I review a contract on paper, then scan it so it is searchable forever."], why:["Because each format has strengths, and a good office uses both well."] },
    { id:"favorite-part", q:"What is your favorite part of the job?", k:["favorite part","favourite part","best part","what you love","enjoy most","love about job"], a:["Closing a complete, perfect deal jacket. Every page signed, every number matching. Pure joy.","Seeing a customer drive off from my window, knowing their paperwork is spotless.","Turning a messy pile into a tidy file. It is very satisfying."], more:["I also enjoy solving puzzles, like figuring out why a package came back from a lender.","And honestly, a fresh box of colored flags makes my week."], ex:["For example, the moment I put a finished jacket in the 'file' tray, I feel a little proud."], why:["Because order out of chaos is my favorite magic trick."] },
    { id:"hardest-part", q:"What is the hardest part of the job?", k:["hardest part","hard part","most difficult","challenges","toughest part","challenging"], a:["Chasing missing items. A signature you need from someone who already drove away is a special kind of puzzle.","Month end. Lots of deals, little time, and every page still has to be right.","Staying focused with constant interruptions. The work needs attention and the office is never quiet."], more:["I handle it with lists and patience. Every missing item has an owner and a follow-up date.","The hard parts are also where I learn the most."], ex:["For example, getting a customer back in just for one missing initial takes tact and good timing."], why:["Because paperwork depends on many people, and not all of them are in the building."] },
    { id:"tips-new-assistants", q:"What tips do you have for new assistants?", k:["tips for new assistants","new assistant","beginner tips","advice for beginners","starting out","first job tips","new hires"], a:["Learn the checklist by heart, ask questions early and never guess on paperwork.","Build a system on day one and stick to it. Habits beat memory.","Get to know every department. Half the job is knowing who to ask."], more:["Keep a notebook of 'how we do it here'. Every dealership has its own little rules.","Do not be afraid to say 'let me check'. Checking is the job."], ex:["For example, my first week I wrote down every lender's favorite stips, and I still use that list."], why:["Because good habits early save you from big mistakes later."] },
    { id:"skills-needed", q:"What skills does this job need?", k:["skills needed","skills","qualities","what it takes","job skills","needed skills"], a:["Attention to detail, organization, clear communication and a calm head.","Being careful, being friendly and being able to switch tasks without losing track.","You need to love details and also like people. This job has a lot of both."], more:["Basic computer skills and comfort with numbers help a lot.","Discretion is big too. You see confidential information every day."], ex:["For example, noticing that two forms show slightly different names is a skill that saves real time."], why:["Because the job sits between people and paperwork, and both need care."] },
    { id:"learning-the-job", q:"How do you learn dealership paperwork?", k:["learning paperwork","learn the job","training","learning curve","new to dealership","getting trained"], a:["By doing it next to someone who knows it, and by asking about every form you do not recognize.","Little by little. Start with simple cash deals, then financed deals, then trades.","Shadowing, checklists and plenty of questions. Nobody learns it all in a week."], more:["Keeping a sample completed jacket as a reference helps a lot.","Rules vary by state or province, so learning the local forms is part of it."], ex:["For example, I used to keep a cheat sheet listing every form in a typical financed deal with a short note on what it is for."], why:["Because the forms make sense once you know the job each one does."] },
    { id:"follow-ups", q:"How do you follow up on missing paperwork?", k:["follow up","follow-ups","following up","chasing paperwork","reminders","chase documents"], a:["I keep a list with what is missing, who is responsible and when I last asked.","Polite reminders, on a schedule. Not too often, not too rarely.","I follow up through the person who has the customer relationship, usually the salesperson."], more:["After a few days, I raise it with the manager so it does not get stuck.","Being specific helps: 'page two initial' gets fixed faster than 'paperwork issue'."], ex:["For example, every Wednesday I send the sales team a short list of what is still missing from their deals."], why:["Because missing items do not fix themselves, and they tend to hide."] },
    { id:"stip-tracking", q:"How do you track pending deals?", k:["pending deals","deal tracking","tracking deals","deal status","open deals","waiting on list"], a:["One tracking list: deal, what is pending, who owns it, and the date. I update it daily.","My 'waiting on' tray and my tracking sheet always agree. If they do not, something moved without me.","Status by color, details in the list, and a weekly review with the manager."], more:["I sort the list by age so the oldest items get attention first.","When a deal is fully complete, it comes off the list with a satisfying strike."], ex:["For example, the list might show a deal waiting on a lender stip, another waiting on a trade title and a third ready to file."], why:["Because a clear list keeps deals from falling through the cracks."] },
    { id:"lender-returns", q:"What happens when a lender returns a package?", k:["lender returns","returned package","package returned","kicked back","rejected package","returned deal"], a:["We find out what was missing or wrong, fix it, and send it back quickly.","It stings a little, but it is usually a small thing, like a missing date or an extra signature needed.","I log the reason so we can avoid the same mistake next time."], more:["Keeping a list of common return reasons is a great training tool for everyone.","Speed matters: the sooner it goes back, the sooner the deal funds."], ex:["For example, a package might come back because one page was missing a co-buyer's initials."], why:["Because learning from returns makes the next package cleaner."] },
    { id:"co-buyers", q:"What changes when there is a co-buyer?", k:["co-buyer","co buyer","cobuyer","two buyers","joint purchase","co-signer"], a:["More signatures! Every place the buyer signs, the co-buyer often has to as well.","The paperwork doubles in places, so my signature check gets extra careful.","Names must match exactly on every form for both people."], more:["I flag both signature spots in different colors so neither person misses one.","Rules and forms vary, so I follow the lender's and local requirements."], ex:["For example, a contract with a co-buyer might need two signatures and two sets of initials on several pages."], why:["Because missing a co-buyer signature is one of the most common reasons paperwork gets returned."] },
    { id:"name-spelling", q:"Why do names need to match on every form?", k:["name spelling","matching names","customer name","name mismatch","spelling names","names match"], a:["Because every document is about the same person. Different spellings make agencies and lenders nervous.","A missing middle initial on one form and not another can cause a return. I check names carefully.","Consistency. The name should look the same on the order, the contract and the title paperwork."], more:["I compare the name to the ID copy when one is required for the deal.","If there is a mismatch, I flag it before anything is sent out."], ex:["For example, a name with a hyphen on one form and without it on another can trigger a question."], why:["Because matching names keep the deal moving without questions."] },
    { id:"dates-on-documents", q:"Why are dates on documents important?", k:["dates on documents","document dates","dating forms","missing dates","sale date","date fields"], a:["Dates show when things happened, and they need to agree across the deal.","A missing or wrong date can send paperwork back. I check them all.","They are easy to overlook and important to get right."], more:["The sale date, signing dates and delivery date should tell one consistent story.","I use a simple trick: check every date on one pass, then everything else on a second pass."], ex:["For example, an odometer statement dated after the sale date would get flagged right away."], why:["Because timelines matter to lenders and agencies."] },
    { id:"copies-for-customer", q:"Do customers get copies of their paperwork?", k:["customer copies","copies for customer","customer packet","copy of contract","paperwork copies","buyer copies"], a:["Yes, customers usually leave with copies of the important documents they signed.","I prepare a customer copy packet so they get everything neatly in one folder.","Absolutely. The original stays in the jacket, and the customer gets their copies."], more:["Some copies are digital now, sent securely or through a customer portal.","I double check that the customer packet does not accidentally include internal documents."], ex:["For example, a customer packet might include their copy of the agreement, the contract and any warranty forms."], why:["Because customers need their own records of what they signed."] },
    { id:"warranty-forms", q:"Do you handle warranty or service contract forms?", k:["warranty forms","service contract","extended warranty","warranty paperwork","protection products","optional products"], a:["I check that any optional product forms the customer chose are complete and in the jacket.","Yes, the paper side of it. The finance office explains them to customers; I make sure the forms are filed.","When a customer adds a product, there is a form for it, and it needs signatures like everything else."], more:["Some of these forms have to be sent to a provider, so I track that too.","I never explain terms myself. That is for the finance office and the documents."], ex:["For example, if a buyer adds a service contract, I make sure it is signed and a copy is sent where it needs to go."], why:["Because customers rely on those forms if they ever need to use the product."] },
    { id:"insurance-proof", q:"Why do you need proof of insurance?", k:["proof of insurance","insurance","insurance card","insurance proof","coverage proof","insurance document"], a:["In many places, a car needs insurance before it can be driven off, and lenders often require proof too. Rules vary.","It is a common item on the deal checklist, and a frequent lender request.","I make sure a copy is in the jacket when it is required for the deal."], more:["Customers can usually get it quickly from their insurer, often by phone or online.","I remind the salesperson early so it does not hold up delivery day."], ex:["For example, a delivery might wait while a customer calls their insurer to add the new car."], why:["Because the dealership and the lender need to know the car is covered."] },
    { id:"payoff-letters", q:"What is a payoff on a trade-in?", k:["payoff","payoff letter","trade payoff","loan payoff","payoff amount","lien payoff"], a:["When a trade-in still has a loan, the payoff is the amount needed to close that loan. The dealership usually handles it.","It is the paper that tells us how much is left on the trade's loan, so it can be paid off.","A payoff confirmation is a common item in trade-in paperwork. I make sure it is there."], more:["Payoff amounts can change over time, so the document date matters.","Once paid, the lender releases its interest in the trade, which affects title work."], ex:["For example, a jacket might include a payoff statement from the customer's lender for their old car."], why:["Because the dealership needs a clear path to the trade's title."] },
    { id:"vehicle-inventory-docs", q:"What paperwork comes with a new car?", k:["new car paperwork","inventory paperwork","vehicle documents","window sticker","manufacturer documents","incoming vehicles"], a:["In general terms, origin documents for the vehicle, the window sticker information and inventory records.","Each car arrives with paperwork that proves where it came from, and that eventually becomes part of the sale.","Inventory documents go to the right place when the car arrives, and come out when it sells."], more:["Those documents are stored securely because they are needed for the title process.","Keeping inventory paperwork organized by stock number makes life much easier."], ex:["For example, when a car sells, I pull its documents by stock number and add them to the deal."], why:["Because ownership paperwork starts the day the car arrives, not the day it sells."] },
    { id:"stock-numbers", q:"What is a stock number?", k:["stock number","stock numbers","stock no","inventory number","stock id","stock tag"], a:["It is the dealership's internal number for each vehicle in inventory.","A short code that lets everyone talk about the same car without reading the full VIN.","It is how we keep track of cars on the lot and paperwork in the office."], more:["I write the stock number on every jacket so it is easy to find the car and its documents.","Stock numbers usually follow a pattern the dealership chooses, like new versus used."], ex:["For example, a salesperson says 'the blue one in stock number something' and I know exactly which file."], why:["Because a short number is faster than a seventeen-character VIN."] },
    { id:"used-car-paperwork", q:"Is used car paperwork different?", k:["used car paperwork","used cars","pre-owned","used vehicle","second-hand car","used car sale"], a:["The basics are similar, but used cars come with their own history documents, title and inspection paperwork. Rules vary.","A bit. The title comes from a previous owner, so I make sure that part is clean.","Similar deal paperwork, different vehicle documents."], more:["Many places require specific disclosures or buyer guides on used cars, so I check they are completed.","Reconditioning records from service may also be part of the file."], ex:["For example, a used car's jacket includes the title work from when we acquired it."], why:["Because a used car has a past, and the paperwork has to show it properly."] },
    { id:"fun-facts", q:"Any fun facts about dealership offices?", k:["fun facts","fun fact","dealership office facts","interesting facts","trivia","office trivia"], a:["A single car sale can involve dozens of signatures. Customers are often surprised by how many.","The back office is where the excitement of the showroom becomes neat, quiet paper.","Month end has its own energy. You can actually hear it in the printer."], more:["Some dealerships ring a bell or cheer when a car is delivered. The office cheers when it is funded.","The busiest printer in the building is usually in the finance office."], ex:["For example, a fully loaded deal jacket can weigh more than you would think. I have done the bicep curls."], why:["Because every car that drives off the lot leaves a paper trail behind."] },
    { id:"office-humor", q:"What is the funniest thing about your job?", k:["funny","funniest","office humor","jokes","funny stories","office humour"], a:["The printer always jams when the most important document is printing. It has a sense of drama.","Pens. I buy a box and by Friday they have all moved to the showroom.","Salespeople saying 'it is just one signature'. It is never just one signature."], more:["I have a drawer labeled 'pens that came back'. It is mostly empty.","The stapler is the most borrowed object in the building. I put a label on it. It still wanders."], ex:["For example, I once found my stapler in a car on the showroom floor. It was enjoying the view."], why:["Because a little humor makes long paperwork days much lighter."] },
    { id:"pride-tidy-file", q:"Why do you love a tidy file?", k:["tidy file","neat file","clean file","perfect file","organized file","tidy folder"], a:["Because a tidy file answers every question before it is asked.","It is my signature, in a way. When someone opens a jacket I prepared, they can tell.","Order is calming. A perfect file is a small finished masterpiece."], more:["Tidy means in order, complete and labeled, not just neat looking.","I order pages the same way in every jacket, so anyone can flip to what they need."], ex:["For example, the manager once pulled an old file and found the answer in ten seconds. Best compliment ever."], why:["Because tidy files save time for everyone, not just me."] },
    { id:"page-order", q:"In what order do you put the pages?", k:["page order","document order","stacking order","order of pages","jacket order","sorting pages"], a:["The same order every time, following the jacket checklist. Agreement up top, then financing, then vehicle and trade documents.","Whatever the dealership's standard is, I follow it exactly. Consistency beats creativity here.","The order people look things up most: the deal summary first, supporting pages after."], more:["A consistent order also makes scanning easier, since digital files end up organized too.","New team members learn faster when every jacket looks the same inside."], ex:["For example, if the manager wants the trade info, they know it is always toward the back."], why:["Because predictable order means fast answers."] },
    { id:"clean-desk", q:"Do you keep a clean desk?", k:["clean desk","tidy desk policy","desk cleanup","desk organization","messy desk","clear desk"], a:["By the end of the day, yes. During the day it is a controlled storm.","I clear my desk every evening. Sensitive papers go in locked drawers, and the trays get sorted.","A clean desk at night means a calm start in the morning."], more:["A clean desk is also a privacy habit: nothing confidential left out overnight.","I keep only today's work on the surface. Everything else has a drawer."], ex:["For example, my last ten minutes each day are for putting everything in its place."], why:["Because clutter hides mistakes and confidential papers."] },
    { id:"computer-security", q:"How do you keep the computer secure?", k:["computer security","locking screen","passwords","password","screen lock","data security"], a:["I lock my screen every time I step away and never share my login.","Strong passwords, locked screen and careful with emails asking for information.","The digital side needs the same care as the locked cabinet."], more:["I am suspicious of unexpected emails asking for customer details. When in doubt, I check with the person by phone.","Only the people who need access to deal files should have it."], ex:["For example, if an email looks like it is from a lender but asks for something unusual, I call the lender's known number to confirm."], why:["Because customer information deserves protection on screen as much as on paper."] },
    { id:"email-organization", q:"How do you keep email organized?", k:["email organization","email folders","organizing email","inbox zero","email management","sorting email"], a:["Folders by topic, flags for follow-ups and a quick daily clean-out.","I handle each email once if I can: reply, file, or put it on my list.","I keep the manager's inbox and mine sorted the same way so nothing gets lost."], more:["Clear subject lines help everyone. I add the deal number to subjects about deals.","Emails with attachments for a deal get saved to the deal's digital folder right away."], ex:["For example, a lender's email with an approval is saved to the deal folder and then filed in the email archive."], why:["Because a messy inbox hides important messages."] },
    { id:"communication-style", q:"How do you communicate with the team?", k:["communication","team communication","communicating","clear messages","talking to team","internal messages"], a:["Short and specific. 'Deal number, what is missing, by when.'","Friendly and clear. People respond better to a smile and a precise request.","I pick the right channel: in person for urgent, email for details, notes for small reminders."], more:["I try never to make someone guess what I need from them.","Saying thank you when something comes back fixed goes a long way."], ex:["For example: 'Hi, your deal from Friday needs the trade title. Can you ask the customer to bring it by Thursday?'"], why:["Because clear requests get done faster."] },
    { id:"manager-office-door", q:"Is the manager's office close to yours?", k:["manager's office","office door","manager office","next door","boss office","managers door"], a:["Just a few steps away. Close enough to hand over papers, far enough for quiet.","Yes, their door is right there. When it is closed, I am the friendly gatekeeper.","Very close, which is handy when something needs a quick signature."], more:["A closed door means a meeting or a call, so I hold visitors and messages until it opens.","I keep a small tray outside their door for papers that need review."], ex:["For example, deals that need the manager's approval go in the review tray by their door."], why:["Because being nearby makes quick decisions quicker."] },
    { id:"approvals-from-manager", q:"How do you get the manager's approval on things?", k:["manager approval","approvals","sign off","manager sign-off","review tray","getting approval"], a:["I batch them. One review session is better than twenty interruptions.","Papers that need a signature go in the review tray, with a flag on each spot.","I put urgent ones on top with a note saying why."], more:["I add a one-line summary so the manager does not have to read every page to understand.","I pick up the tray at set times, so things do not sit there all day."], ex:["For example, three deal approvals and a supply order go in the tray before lunch, ready after their meeting."], why:["Because grouping approvals saves the manager time and keeps work moving."] },
    { id:"weekly-routine", q:"What does your week look like?", k:["weekly routine","week schedule","each week","weekly tasks","monday tasks","week plan"], a:["Mondays are busy from the weekend, midweek is for catching up and following up, Fridays are for prepping the weekend.","A rhythm: weekend deals arrive Monday, missing items get chased midweek, and Friday I set up for Saturday.","Every day has a theme, more or less. It helps me stay ahead."], more:["Wednesday is my follow-up day for missing items with the sales team.","Friday afternoon I make sure the manager's next week is set and supplies are full."], ex:["For example, Friday I print extra forms so the weekend team does not run out."], why:["Because a weekly rhythm keeps surprises small."] },
    { id:"preparing-forms", q:"Do you prepare forms in advance?", k:["preparing forms","blank forms","forms ready","pre-printed forms","form supply","printing forms"], a:["Yes, I keep stacks of the common forms ready so nobody waits on the printer.","Before busy days, I print extra sets and organize them in labeled slots.","Prepared forms mean faster deals. It is one of my simplest tricks."], more:["I make sure the forms are the current versions. Old versions get shredded or recycled.","Many forms are now generated by the software, but backups on paper still help on busy days."], ex:["For example, I keep test drive forms and delivery checklists stocked by the sales desks."], why:["Because the paperwork should never slow down a happy customer."] },
    { id:"form-versions", q:"Why do you check form versions?", k:["form versions","current forms","outdated forms","form updates","old forms","new forms"], a:["Forms get updated, and using an old version can cause problems. I make sure we use the current one.","Because an outdated form can be rejected. I clear out old stock when a new version arrives.","Version control is not just for computers. Paper forms have versions too."], more:["I mark the form date on the slot label so it is easy to spot old stock.","When a new version arrives, I tell the team and swap out every pile."], ex:["For example, when a form changes, I collect all the old copies from the sales desks the same day."], why:["Because the wrong version can mean redoing paperwork with the customer."] },
    { id:"audits", q:"What happens during a paperwork audit?", k:["audit","audits","paperwork audit","file review","internal audit","compliance review"], a:["In general terms, someone reviews a sample of files to check they are complete and correct.","It is a check of our files. A tidy system makes audits much less stressful.","Reviewers look at whether the files have what they should. My goal is that they find nothing to fix."], more:["I do my own mini audits each month, pulling a few jackets at random to check them.","Rules and requirements vary, so the dealership's policy guides what is checked."], ex:["For example, I might pull five jackets from last month and recheck every signature and date."], why:["Because finding issues yourself first is always better."] },
    { id:"handling-mistakes", q:"What do you do when you find a mistake?", k:["finding mistakes","mistakes","errors","fixing errors","paperwork errors","found an error"], a:["Flag it, tell the right person, and help fix it quickly. No drama, just a fix.","I never quietly change anything on a signed document. I raise it so it gets corrected properly.","I note what happened so we can avoid it next time."], more:["The finance office or the manager decides how a correction is handled. My job is to catch it.","Most mistakes are small and easy to fix if caught early."], ex:["For example, if I see a wrong mileage, I tell the salesperson and the finance office before the package goes out."], why:["Because catching a mistake early is the best thing that can happen to it."] },
    { id:"working-under-pressure", q:"How do you work under pressure?", k:["under pressure","pressure","time pressure","tight deadlines","rush jobs","urgent requests"], a:["I slow down a little. Rushing under pressure is how pages get skipped.","I focus on the next single task, then the next one. Pressure gets smaller in pieces.","With my checklist. It does not care how busy it is; it keeps me honest."], more:["I communicate early when something might be late, which takes the pressure off everyone.","A short break, even two minutes, can reset my focus."], ex:["For example, with a customer waiting and three calls on hold, I handle the customer's paperwork first, then return the calls."], why:["Because accuracy matters most exactly when time is short."] },
    { id:"customer-service", q:"Do you deal with customers directly?", k:["customer service","dealing with customers","talking to customers","customer calls","customer questions","helping customers"], a:["Sometimes, mostly by phone about paperwork, like a missing signature or a document they need to bring.","Yes, a little. I am friendly, clear and I never leave them guessing.","Usually through the salesperson, but I do talk to customers when the paperwork needs it."], more:["I explain what is needed in simple words, not dealership jargon.","For questions about financing or terms, I connect them with the finance office."], ex:["For example, I might call a customer to ask them to stop by and initial one page at their convenience."], why:["Because a friendly paperwork call keeps the customer's experience positive."] },
    { id:"dealership-jargon", q:"What dealership jargon should I know?", k:["dealership jargon","jargon","dealer terms","car dealer slang","industry terms","dealer lingo"], a:["Deal jacket, stips, funding, temp tag, payoff, stock number. You will hear those every day.","A few classics: 'the desk' for the sales managers, 'stips' for lender conditions, 'jacket' for the deal file.","Lots of shortcuts. When I started, I kept a little glossary in my notebook."], more:["Every dealership has its own nicknames too, so new people should not be shy about asking.","I avoid jargon with customers. It confuses people."], ex:["For example, 'the deal is waiting on stips' means the lender needs more documents before funding."], why:["Because knowing the language makes conversations much faster."] },
    { id:"new-vs-experienced", q:"What separates a great assistant from a good one?", k:["great assistant","good assistant","excellent assistant","best assistants","stand out","top assistant"], a:["Anticipation. A good assistant does what is asked; a great one has it ready before it is asked.","Consistency. Doing the boring things right every single day.","Knowing the whole process, not just their piece of it."], more:["Great assistants also make other people's jobs easier, which builds a lot of goodwill.","They raise problems early and with a suggestion."], ex:["For example, printing the monthly summary before the manager remembers to ask for it."], why:["Because the best support is the kind people barely notice, until it is missing."] },
    { id:"time-blocking", q:"Do you block time for focused work?", k:["time blocking","focus time","focused work","deep work","quiet time","blocking time"], a:["Yes, I keep a block each day for checking deals without interruptions.","I try to. An hour of focus does more than three hours of distraction.","Late morning is my focus block. The phone goes to voicemail for a little while if it can."], more:["I tell the receptionist when I am in a focus block so urgent things still reach me.","The manager's calendar gets focus blocks too."], ex:["For example, from ten to eleven I review new deal jackets with the door half closed."], why:["Because careful paperwork needs a quiet mind."] },
    { id:"keeping-supplies-stocked", q:"How do you keep supplies stocked?", k:["supply closet","stocking supplies","ordering supplies","reorder supplies","supply list","running out"], a:["A simple reorder list. When something gets low, it goes on the list right away.","I check the supply closet every Monday and order before we run out.","Spare toner, spare paper, spare folders. Spares are my love language."], more:["I track what runs out fastest, like folders at month end, and order more before busy periods.","Anyone can add to the supply list, which helps a lot."], ex:["For example, before month end I make sure there are extra deal jackets and a box of paper ready."], why:["Because running out of folders on a busy day is a small disaster."] },
    { id:"handling-urgent-requests", q:"What happens when the manager needs something right now?", k:["urgent request","right now","asap","rush request","emergency request","immediate request"], a:["I drop what I can safely drop, mark my place and get it done.","I ask one quick question: what exactly is needed and by when. Then I go.","It happens daily. A good filing system is what makes 'right now' possible."], more:["If I truly cannot get it right away, I say when I can.","After the rush, I go right back to what I was doing, using my sticky flag as a bookmark."], ex:["For example, the manager needs a deal file in five minutes for a call, and thanks to the out-card system I find it in one."], why:["Because sometimes a decision cannot wait, and I help it happen."] },
    { id:"team-meetings", q:"Do you join team meetings?", k:["team meetings","staff meetings","sales meetings","morning meeting","office meetings","meeting notes"], a:["Sometimes, mainly to take notes or share an update on paperwork status.","When paperwork is on the agenda, I am there with my list.","I often take notes and turn them into a short list of follow-ups."], more:["I send the notes the same day while everything is still fresh.","Each follow-up gets an owner and a date, or it tends to vanish."], ex:["For example, after a sales meeting I might email a list of who is handling which missing items."], why:["Because a meeting without follow-up is just a conversation."] },
    { id:"weekend-handoff", q:"How do you prepare for the weekend?", k:["weekend prep","weekend handoff","friday prep","before weekend","weekend team","weekend coverage"], a:["I leave the weekend team stocked forms, clear instructions and an empty 'in' tray.","Friday afternoon is for handoff notes: what is pending and who to call if something comes up.","I make sure the manager's weekend schedule is clear and the printer is fully supplied."], more:["A short handoff note saves everyone from guessing on Saturday.","On Monday, I read the notes back and pick up where they left off."], ex:["For example, my Friday note might say which deals are waiting on documents the customers promised to bring."], why:["Because the weekend is busy, and smooth handoffs keep deals moving."] },
    { id:"why-paperwork-matters", q:"Why does all this paperwork matter?", k:["why paperwork matters","importance of paperwork","paperwork importance","so much paperwork","paperwork purpose","need paperwork"], a:["It protects everyone: the buyer, the dealership and the lender. It shows what was agreed and who owns what.","Without it, ownership does not transfer, deals do not fund and questions have no answers.","Paperwork is the memory of the dealership. People forget; files do not."], more:["It also helps customers later, for example when they need a copy of their agreement.","Good paperwork prevents most misunderstandings before they start."], ex:["For example, months after a sale, a customer asks for a copy of their agreement and I can send it the same day."], why:["Because a sale is a promise, and paperwork is how the promise is kept on record."] },
    { id:"opinion-craft", q:"What do you think makes good paperwork?", k:["good paperwork","quality paperwork","paperwork quality","perfect paperwork","paperwork standards","craft"], a:["Complete, consistent and readable. If a stranger can understand it, it is good paperwork.","No blanks where there should be answers, no surprises, and everything in its place.","Good paperwork tells the whole story without needing me to explain it."], more:["Neat handwriting where handwriting is used helps more than people think.","And a clear label on the outside. The best file in the world is useless if nobody can find it."], ex:["For example, a jacket where every page matches the checklist and every number agrees is good paperwork."], why:["Because paperwork is read later by people who were not there."] }

KB["angeles"] = {
  topics: [
    { id:"angry-caller", q:"How do you handle an angry caller?", k:["angry caller","angry customer","upset customer","yelling","rude caller","mad customer","furious caller","irate"], a:["I let them finish without interrupting, then I calmly repeat back what went wrong. Most anger cools down once people feel heard.","I stay calm and focus on the problem, not the tone. Angry usually means frustrated, and frustration I can work with.","First I listen, then I acknowledge, then I fix what I can. Rushing to the solution before they feel heard usually backfires."], more:["I lower my voice slightly and slow down. People tend to mirror your pace, so a calm voice often brings theirs down too.","If someone crosses into personal insults, I give one polite warning and offer to continue once we can talk it through calmly."], ex:["For example, someone called furious about a delayed order. I let them vent, said I'd be frustrated too, then gave a clear next step and a time I'd call back."], why:["Because a person who feels heard is ready to hear the solution. Before that, nothing I say lands."] },
    { id:"greeting", q:"How do you greet a caller?", k:["greeting","greet a caller","answering the phone","phone greeting","first words","opening line","pick up the phone"], a:["Warm and simple: a thank you, my name, and an offer to help. Short greetings get people to the point faster.","I smile before I pick up, then say thanks for calling, I'm Angeles, how can I help you today? Easy and friendly.","My greeting is the first impression, so I keep it clear, unhurried and warm. No mumbling, no rushing."], more:["I avoid long scripted openers. If the greeting takes ten seconds, the caller has already lost patience.","I always ask for their name early and use it a couple of times. It makes the call feel personal right away."], ex:["For example: Thanks for calling, this is Angeles. Who do I have the pleasure of speaking with?"], why:["Because the first five seconds set the tone for the whole call."] },
    { id:"active-listening", q:"What is active listening?", k:["active listening","listening skills","listen carefully","good listener","listening","paraphrasing","listen actively"], a:["It means listening to understand, not to reply. I take notes, ask questions and repeat back what I heard.","Active listening is giving someone your full attention and proving it, with small cues like I see, got it, and summarising their issue.","It's the biggest skill in my job. If I really listen, I usually solve it faster because I catch the real problem."], more:["I paraphrase in my own words: so the bill shows two charges for the same month, is that right? That confirms I got it.","I also listen for what isn't said, like hesitation or a sigh. That tells me if they're confused or worried."], ex:["For example, a caller says the device is broken, but by listening I hear it only fails after a power cut. That detail changes the whole fix."], why:["Because most repeat calls happen when the agent solved the wrong problem."] },
    { id:"empathy-statements", q:"What are good empathy statements?", k:["empathy statements","empathy","empathetic phrases","show empathy","understanding phrases","sympathize","empathy phrases"], a:["Simple ones work best: I understand how frustrating that is, or I'd feel the same way in your shoes.","I like I can see why that's upsetting, let's sort it out together. It acknowledges the feeling and moves forward.","My favourite is: thanks for your patience, I know this isn't how you wanted to spend your afternoon."], more:["Empathy only works if it's specific. Referencing their actual situation sounds real, a generic line sounds scripted.","I never overdo it. One sincere empathy statement beats five robotic ones."], ex:["For example: I understand, you've already called twice about this and you just want it fixed. Let's make this the last call."], why:["Because people want to feel understood before they want a solution."] },
    { id:"de-escalation", q:"What are your de-escalation steps?", k:["de-escalation","de-escalate","deescalate","calm someone down","defuse","calming a caller","escalating situation"], a:["Listen fully, acknowledge the feeling, apologise for the experience, then offer a clear next step. That order matters.","My steps are: let them vent, stay calm, show I understand, and turn the talk toward what I can actually do.","I lower my tone, slow down, use their name and focus on solutions. Arguing about details only adds fuel."], more:["I offer choices when I can. Giving someone two options returns a bit of control, and that alone calms things.","If nothing works, I offer a supervisor or a callback. Sometimes a fresh voice or a pause is the best tool."], ex:["For example: I hear you, and I'm sorry this happened. I can either send a replacement today or issue a credit. Which works better for you?"], why:["Because angry people need to feel in control again, and options give them that."] },
    { id:"staying-calm", q:"How do you stay calm on tough calls?", k:["stay calm","staying calm","keep calm","keep your cool","composure","calm under pressure","not lose temper"], a:["I breathe slowly, keep my shoulders down and remind myself the problem is the target, not me.","I focus on my next step. When I'm busy solving, there's no room for panic.","I take a sip of water while they talk. It gives me a second to reset, and my voice stays steady."], more:["I have a tiny ritual after a hard call: stand up, stretch, deep breath, then I'm ready for the next one.","Experience helps too. After hundreds of calls, very little surprises me anymore."], ex:["For example, when a caller raises their voice, I count a slow breath before answering. It stops me from matching their energy."], why:["Because calm is contagious, and so is stress."] },
    { id:"not-personal", q:"How do you not take it personally?", k:["take it personally","personally","thick skin","not personal","hurtful comments","criticism","emotional resilience"], a:["I remind myself they're upset with the situation, not with me. I'm just the person who picked up.","People call us on their worst day with that product. If I keep that in mind, the harsh words don't stick.","I separate the message from the delivery. There's usually a real problem under the shouting, and that's what I solve."], more:["Talking it out with the team in a huddle helps a lot. Everyone has had that call, and we laugh it off together.","I also remember all the thank yous. One rough call doesn't cancel twenty nice ones."], ex:["For example, a caller once said I was useless, then thanked me warmly ten minutes later when it was fixed."], why:["Because if I carried every harsh word home, I'd be done in a week."] },
    { id:"saying-no", q:"How do you say no nicely?", k:["saying no","say no","decline a request","turn down","refuse politely","cant do that","bad news"], a:["I lead with what I can do instead of what I can't. The no is still there, but it comes with a path forward.","I explain the reason briefly and honestly, then offer an alternative. A no without a why feels like a wall.","I say it kindly and clearly. Being vague just makes people ask again and get more frustrated."], more:["I avoid 'that's our policy' as the whole answer. I explain what the policy protects, then help within it.","If there's truly nothing, I make sure they know who or where to go next."], ex:["For example: I can't refund after 90 days, but I can arrange a repair at no cost. Would that help?"], why:["Because people accept a no much better when they leave with something."] },
    { id:"apologizing", q:"How do you apologize well?", k:["apologize","apologise","apology","saying sorry","sorry","make amends","owning mistakes"], a:["A good apology is short, sincere and specific: I'm sorry your order arrived damaged. Then straight into the fix.","I apologise for the experience, take ownership and avoid blaming another department. The caller doesn't care whose fault it was.","One real apology is enough. Repeating sorry ten times starts to sound like I'm not doing anything."], more:["The best apology includes action. Sorry plus a solution plus a follow-up is the full package.","I never say sorry if you feel that way. It sounds like I'm blaming them for their feelings."], ex:["For example: I'm really sorry you were charged twice. I've reversed the second charge, and you'll see it within a few days."], why:["Because an apology without action feels empty."] },
    { id:"scripts", q:"Do you follow scripts?", k:["scripts","call script","script","scripted","following a script","sound human","robotic"], a:["I follow them for the important bits, like verification and legal wording. The rest I say in my own voice.","Scripts are a map, not a cage. I use them as a guide and adjust to the person I'm talking to.","When the script fits, great. When the caller is upset or confused, I go human and keep the key points."], more:["New agents should lean on scripts more. Once you know the flow, you earn the freedom to improvise.","I always keep required disclosures word for word. Those aren't optional, and that's fine."], ex:["For example, the script says 'Is there anything else?', but after a long call I'll say 'Before I let you go, anything else I can sort out?'"], why:["Because people can hear when you're reading, and it makes them feel like a number."] },
    { id:"script-opinion", q:"What's your opinion on scripts?", k:["opinion on scripts","script opinion","hate scripts","love scripts","script pros","script cons","word for word"], a:["Honestly? I like them more than people think. They save me on a busy Monday when my brain is full.","Good scripts are helpful, bad scripts are painful. The best ones are written by people who actually take calls.","I think scripts should give the key points and leave the wording to us. Trust the agent's voice."], more:["I often suggest script edits after quality reviews. If ten callers are confused by a line, the line is the problem.","The worst script is one that ignores what the caller just said. Listening beats reading every time."], ex:["For example, we had a closing line that sounded like a sales pitch. We shortened it and satisfaction went up."], why:["Because consistency matters, but so does sounding like a real person."] },
    { id:"putting-on-hold", q:"How do you put someone on hold politely?", k:["put on hold","placing on hold","hold politely","hold etiquette","may i put you on hold","holding","hold time"], a:["I ask permission, explain why and give a time estimate: may I put you on hold for two minutes while I check that?","I never just vanish. I tell them why, how long, and I come back on time, even just to say I need one more minute.","Ask, explain, estimate, return, thank. That's my hold recipe."], more:["If it's going longer than expected, I check back every minute or two. Silence makes a minute feel like ten.","When I return, I thank them: thanks for holding, here's what I found. Gratitude goes a long way."], ex:["For example: Do you mind holding for about two minutes while I review your account? I'll be right back."], why:["Because unexplained hold time is the fastest way to turn a calm caller into an angry one."] },
    { id:"hold-music", q:"What do you think of hold music?", k:["hold music","on hold music","waiting music","elevator music","hold song","music on hold","hold tune"], a:["Hold music is my nemesis. I've heard our loop so many times I could perform it live with full orchestra.","I always apologise for the hold music before I put someone on hold. It's the least I can do.","Fun fact: some callers hum along. I've come back to a caller humming and we both laughed."], more:["I have a theory that hold music is secretly designed to make my return sound like a choir of angels.","I keep holds short partly out of kindness and partly because I know exactly what they're listening to."], ex:["For example, a caller once asked if they could stay on hold a little longer because the song was almost finished. Best compliment our music ever got."], why:["Because a little humour about the wait makes the wait feel shorter."] },
    { id:"hold-music-jokes", q:"Got any hold music jokes?", k:["hold music jokes","hold music joke","funny hold music","joke","jokes","make me laugh","call centre humor"], a:["Our hold music has been playing so long it qualifies for a long service award.","Why did the hold music break up with the caller? It felt they were just waiting for someone better.","I told a caller the hold music was a live recording. They asked for an encore. I said please don't."], more:["My dream is a hold music playlist voted by callers. It would either be amazing or total chaos.","I sometimes say: you'll be on hold for two minutes, which is roughly one and a half loops of the world's most famous saxophone solo."], ex:["For example, I once said 'brace yourself, the flute section is coming' before putting someone on hold. They were laughing when I came back."], why:["Because a smile is the best hold experience upgrade I can give."] },
    { id:"transfers", q:"How do you transfer calls well?", k:["transfer","transferring calls","warm transfer","cold transfer","transfer a call","pass along","another department"], a:["I do warm transfers whenever possible: I explain the case to the next person first, so the caller doesn't repeat everything.","I tell the caller who they're going to, why, and what to expect. No mystery transfers.","Before transferring, I make sure it's the right team. A wrong transfer is worse than no transfer."], more:["I leave notes in the ticket too, so even if the line drops, the next agent has the full story.","I give the caller a direct number in case the transfer fails. Just a little safety net."], ex:["For example: I'm connecting you with our billing team. I've already told them about the double charge, so you won't need to start over."], why:["Because nothing frustrates people like telling their story three times."] },
    { id:"escalation", q:"When do you escalate to a supervisor?", k:["escalate","escalation","supervisor","speak to a manager","manager request","escalate a call","team lead"], a:["When the solution needs approval beyond my level, or when the caller asks and I've genuinely tried everything I can.","I escalate when it's about authority, not because a call is hard. I try to own the issue first.","If someone asks for a supervisor, I first ask what they'd like them to do. Often I can do it myself."], more:["When I do escalate, I brief the supervisor fully so the caller doesn't repeat themselves.","Escalation isn't failure. Knowing when to hand off is part of the skill."], ex:["For example, a refund above my limit goes to a supervisor. I summarise the case, then stay on the line for the introduction."], why:["Because the caller needs the right person, not just another person."] },
    { id:"callbacks", q:"How do callbacks work?", k:["callback","callbacks","call back","call them back","return call","scheduled callback","calling back"], a:["If I can't solve it on the spot, I set a callback with a specific time and I keep it. Promises matter.","I note the best number and time window, then add a reminder in the system. No callback gets forgotten.","A callback is a commitment. Even if I don't have news yet, I call to say so."], more:["I give a realistic time, not an optimistic one. Calling early feels great, calling late feels like a broken promise.","I always write in the ticket what I'm checking, so if I'm away, a teammate can make the call."], ex:["For example: I'll call you back tomorrow between 10 and 12 with an update, even if it's just to say we're still working on it."], why:["Because a missed callback undoes all the trust from the first call."] },
    { id:"opening-tickets", q:"How do you open a ticket?", k:["open a ticket","opening tickets","create a ticket","new ticket","log a ticket","raise a ticket","case creation"], a:["I open one for every contact: who called, what's wrong, what I did and what's next. Even a quick question gets logged.","A good ticket has a clear title, the customer details, the issue in plain words and the steps already tried.","I write tickets as if a stranger will read them tomorrow, because often someone will."], more:["I write the title like a headline: 'Device not powering on after reset'. Searchable and clear.","I attach any reference numbers or emails right away, so nobody has to hunt for them later."], ex:["For example: Title 'Second charge on monthly invoice'. Notes: caller confirmed one order, two charges, reversal requested, callback Thursday."], why:["Because if it isn't in the ticket, it didn't happen."] },
    { id:"ticket-categories", q:"How do you categorize tickets?", k:["categorize tickets","ticket category","categorise","ticket categories","tagging tickets","ticket tags","classify tickets"], a:["I pick the category that matches the root cause, not the first symptom. Billing, technical, delivery, returns and so on.","Good tags help us spot trends. If everyone tags carefully, we can see a problem growing before it explodes.","I use one main category and a few tags. Too many tags and the reports become a mess."], more:["When I'm unsure, I check the category guide or ask in the team chat. Consistency matters more than speed here.","Wrong categories send tickets to the wrong team, which costs a day or more."], ex:["For example, 'can't log in' could be technical, but if it's because the account was closed, it's actually an account issue."], why:["Because categories turn hundreds of tickets into useful data."] },
    { id:"ticket-priority", q:"How do you set ticket priority?", k:["ticket priority","priority","urgent ticket","prioritize","prioritise","high priority","low priority","severity"], a:["I look at impact and urgency: how many people are affected and how soon it hurts them.","Something blocking a customer completely is high. A question that can wait a day is low. Most land in the middle.","I don't mark everything urgent. If everything is urgent, nothing is."], more:["Safety issues and anything affecting lots of customers jump to the top immediately.","I re-check priority when new info comes in. A low ticket can become urgent fast."], ex:["For example, a product not working in winter for someone who relies on it gets high priority. A colour question gets normal."], why:["Because priority decides who gets help first, so it has to be fair."] },
    { id:"updating-tickets", q:"How do you update tickets?", k:["update a ticket","updating tickets","ticket notes","ticket update","add notes","case notes","ticket comments"], a:["Every time something happens, I add a short note: what I did, what I learned and what's next.","I write updates with dates and next steps, so anyone can pick it up without calling me.","Short, factual and clear. No novels, no inside jokes, no guessing."], more:["I always update the status too, not just the notes. A ticket marked 'new' that's half solved confuses everyone.","If I promised something to the customer, it goes in the ticket word for word."], ex:["For example: 'Called back, replacement shipped, tracking sent by email. Follow up if not delivered by Friday.'"], why:["Because the next person reading it might be me on a busy Monday with no memory of the call."] },
    { id:"closing-tickets", q:"When do you close a ticket?", k:["close a ticket","closing tickets","resolve ticket","resolved","ticket closed","mark as solved","ticket resolution"], a:["Only when the customer's problem is actually fixed, not when I've done my part.","I confirm with the customer first when possible. If they agree it's solved, I close with a clear resolution note.","A closed ticket should tell a full story: problem, fix and confirmation."], more:["If a customer doesn't reply, I follow our rule: a couple of reminders, then close with a note saying how to reopen.","I never close tickets just to make my numbers look good. They come back, and they come back angry."], ex:["For example: 'Replacement received, customer confirmed it works. Closing.'"], why:["Because reopened tickets cost more trust than slow ones."] },
    { id:"ticket-board", q:"What's on your ticket board?", k:["ticket board","wall board","kanban","board on the wall","status board","sticky notes","queue board"], a:["The board on my wall shows open tickets by status: new, in progress, waiting on customer and done. Moving one to done is so satisfying.","It's my visual to-do list. Glancing at it tells me exactly where my day stands.","Colour codes for priority, columns for status. Simple, but it keeps me honest."], more:["Waiting tickets get a date on them, so I know when to chase. Nothing sits forgotten.","The team board shows trends too. If one column fills up, we know where to help."], ex:["For example, red cards are urgent, yellow are follow-ups and green are ready to close."], why:["Because seeing the work makes it easier to manage than a list hidden in a screen."] },
    { id:"queues", q:"How do call queues work?", k:["queue","queues","call queue","waiting queue","line of callers","calls waiting","queue length"], a:["Calls wait in a queue until the next agent is free. We see how many are waiting and how long the oldest has been there.","Different queues route to different skills: billing, technical, general. You land where you'll get the best help.","When the queue grows, we tighten our focus: shorter wrap-ups, fewer side tasks, everyone on the phones."], more:["Some queues offer a callback option instead of waiting, which keeps people from staying on hold forever.","Watching the queue counter go from 15 to 0 after a rush is weirdly rewarding."], ex:["For example, if the queue display turns red, the team pauses email work and jumps on calls."], why:["Because a queue is real people waiting, not just a number."] },
    { id:"sla", q:"What is an SLA?", k:["sla","slas","service level","service level agreement","response time","response times","target time"], a:["An SLA is a promise about speed, like answering most calls within a set number of seconds or replying to emails within a day.","It's our service target. It keeps us honest about how long people wait.","SLAs are the clock on the wall. Every ticket has one, and we try to beat it."], more:["Different channels have different SLAs. Phone is seconds, chat is minutes, email is hours.","Hitting SLAs depends on good planning. Staffing for peak hours matters as much as working fast."], ex:["For example, a target might be to answer most calls within about 30 seconds and reply to emails within one business day."], why:["Because waiting is the first thing customers notice."] },
    { id:"crm", q:"What software do you use?", k:["crm","software","tools","customer system","crm system","helpdesk software","agent desktop"], a:["A CRM that holds customer history, tickets and notes, plus a phone system and a knowledge base. That's my toolkit.","Mostly a customer system that shows everything about past contacts. One screen, all the context.","My phone system, the CRM and a big library of help articles. Plus a notepad, always."], more:["The CRM shows previous tickets as soon as the call connects, so I often know the history before they say hello.","Learning keyboard shortcuts in the CRM saves me minutes every hour."], ex:["For example, when a call comes in, the caller's last three tickets pop up, and I can see they called yesterday about the same issue."], why:["Because good tools let me focus on the person instead of the paperwork."] },
    { id:"customer-history", q:"Why do you check customer history?", k:["customer history","past contacts","account history","previous tickets","contact history","history notes","customer notes"], a:["So people don't have to repeat themselves. If they called yesterday, I should already know.","History tells me what's been tried and what was promised. It saves time and avoids contradicting a teammate.","I read it in the first seconds of the call. It changes how I greet someone who's on their third call."], more:["If I see repeat contacts, I treat that call with extra care. That person is losing patience, and fairly so.","I also add my own notes so the next agent benefits."], ex:["For example: I can see you spoke with us on Tuesday about the delivery. Let me pick up right where that left off."], why:["Because 'I already told someone this' is one of the most frustrating phrases in support."] },
    { id:"documentation", q:"Why is documentation important?", k:["documentation","document everything","writing notes","record keeping","note taking","paper trail","logging calls"], a:["Because memory fails, but notes don't. Good documentation lets anyone continue the work.","It protects the customer and us. When there's a question later, the notes have the answer.","Documentation is a gift to the next agent, who might be me next week."], more:["I write notes during the call, not after. Details fade fast when the next call comes in.","I keep notes neutral and factual. No opinions, just what happened and what's next."], ex:["For example, a caller said a teammate promised a credit. The note was there, so I applied it in seconds."], why:["Because good notes turn a team into one shared memory."] },
    { id:"verification", q:"How do you verify a caller's identity?", k:["verify identity","verification","identity check","security questions","authenticate","verify caller","id check"], a:["I ask a few security questions before discussing any account details. It's quick, and it protects them.","I explain why I'm asking. Most people appreciate it once they know it keeps their account safe.","No verification, no account details. I'm friendly about it, but I don't bend that rule."], more:["If someone can't pass verification, I give general info only and explain how they can confirm their identity.","I never read out sensitive details for someone to confirm. They tell me, I check."], ex:["For example: Before I look at the account, can you confirm a couple of details for security?"], why:["Because protecting someone's account is part of helping them."] },
    { id:"confidentiality", q:"How do you handle confidentiality?", k:["confidentiality","privacy","private information","data protection","personal data","keep it private","sensitive info"], a:["What's said on a call stays in the system, used only to help that customer. I never share it elsewhere.","I lock my screen when I step away and never write sensitive details on paper.","Privacy is non-negotiable. I only access what I need for the call in front of me."], more:["If someone calls on behalf of another person, I check they're authorised before sharing anything.","I avoid repeating sensitive details out loud in an open office."], ex:["For example, a caller asked for a family member's order details. Without authorisation on file, I politely explained I couldn't share them."], why:["Because trust is the whole job, and privacy is where trust starts."] },
    { id:"first-call-resolution", q:"What is first call resolution?", k:["first call resolution","fcr","solve first time","resolved first call","one call resolution","no repeat calls","first contact resolution"], a:["It means solving the issue in the first contact, so the customer never has to call back. It's my favourite metric.","FCR is about doing it right the first time: understand fully, fix fully, confirm fully.","High FCR means happy callers and fewer calls in the queue. Everybody wins."], more:["The secret is asking good questions upfront and checking the fix before ending the call.","Sometimes a slightly longer call is worth it if it means no second call."], ex:["For example, instead of telling someone to try a reset and call back, I stay on while they do it and confirm it worked."], why:["Because every repeat call is a sign we left something unfinished."] },
    { id:"average-handle-time", q:"What is average handle time?", k:["average handle time","aht","handle time","call length","call duration","talk time","long calls"], a:["It's talk time plus hold time plus wrap-up, averaged across calls. It shows how long each contact really takes.","AHT helps plan staffing, but it shouldn't rush anyone. A short call that doesn't solve the issue is a waste.","I aim for efficient, not rushed. Clear questions and good notes keep my handle time healthy."], more:["The best way to lower AHT is knowing your tools and knowledge base well, not talking faster.","Some calls need to be long. Complex problems and upset callers deserve the time."], ex:["For example, using a saved note template cut my wrap-up time by almost a minute per call."], why:["Because time matters, but solving the problem matters more."] },
    { id:"quality-reviews", q:"How do quality reviews work?", k:["quality review","quality reviews","qa","quality assurance","call scoring","scorecard","call evaluation"], a:["A reviewer listens to some of my calls and scores them on greeting, listening, accuracy, tone and closing.","Quality reviews are coaching, not punishment. I always learn something from hearing myself.","They check if I solved the problem correctly and treated the caller well. Both count."], more:["Listening to my own recordings was awkward at first. Now it's the fastest way I improve.","I like to self-score before seeing the reviewer's score. It sharpens my ear."], ex:["For example, a review showed I said 'no problem' far too often. I swapped it for 'happy to help' and it sounded much warmer."], why:["Because you can't fix habits you don't know you have."] },
    { id:"call-monitoring", q:"Are your calls monitored?", k:["call monitoring","monitored","recorded calls","call recording","listening in","silent monitoring","this call may be recorded"], a:["Yes, calls can be recorded for quality and training. Callers hear that at the start.","Monitoring keeps everyone on the same standard. I treat every call as if it's being reviewed.","Sometimes a coach listens live to give tips afterwards. It's helpful once you get over the nerves."], more:["Recordings also help settle questions later about what was promised.","Great calls get shared with the team as examples, which is a nice boost."], ex:["For example, one of my recordings was used in training to show how to handle a confused caller calmly."], why:["Because recordings help us learn and protect both sides."] },
    { id:"surveys", q:"Do customers fill out surveys?", k:["survey","surveys","post call survey","feedback survey","customer feedback","rate the call","survey results"], a:["Yes, after many calls they get a short survey. I read every comment about me, good or bad.","Surveys tell us how the call felt, not just whether it was solved. Both matter.","I treat survey feedback as free coaching from the people who matter most."], more:["Low scores often point to policy or product issues, not the agent. We pass those along.","Comments are more useful than numbers. A single sentence can change how I handle a whole type of call."], ex:["For example, a survey said I explained a reset 'too technically'. Now I use plainer words."], why:["Because the caller's opinion is the real scoreboard."] },
    { id:"satisfaction-scores", q:"What are satisfaction scores?", k:["satisfaction score","csat","customer satisfaction","satisfaction scores","nps","net promoter","happiness score"], a:["They measure how happy people are after contacting us, usually with a simple rating question.","CSAT is the quick 'how satisfied were you' score. Some teams also ask if they'd recommend us.","I care about them, but I care more about the comments behind them."], more:["Satisfaction goes up with fast answers, first call fixes and friendly tone. Not complicated, just hard to do every time.","One bad experience can drag a score down, so consistency is everything."], ex:["For example, after we added callbacks during peak hours, satisfaction went up noticeably."], why:["Because they show whether our work actually feels good to customers."] },
    { id:"follow-up-emails", q:"Do you send follow-up emails?", k:["follow-up email","follow up email","followup","email summary","recap email","send an email","written confirmation"], a:["Yes, after anything complex I send a short summary: what we discussed, what I did and what happens next.","A follow-up email turns a phone promise into something they can keep and check.","I keep them short, friendly and scannable, with any reference numbers at the top."], more:["I send it right after the call while details are fresh. Waiting a day makes it vague.","It also helps people who prefer reading instructions to remembering them."], ex:["For example: 'Hi, thanks for your call today. Your replacement is on the way, reference number at the top. Reply here if anything changes.'"], why:["Because people forget phone calls, but they keep emails."] },
    { id:"channels", q:"Phone, chat or email: which is best?", k:["chat vs phone","phone vs email","support channels","live chat","email support","phone support","omnichannel"], a:["Phone is best for complex or emotional issues. Chat is great for quick questions. Email suits anything that needs detail or attachments.","Each channel has its strength. The best support lets people pick what suits them.","I love the phone because tone carries so much. But chat lets you help a few people at once."], more:["On chat I keep messages short and check in often, because silence feels longer in text.","Email needs the clearest writing, since you can't hear confusion in their voice."], ex:["For example, a billing question works great on chat, but a frustrated caller with a broken product usually needs a voice."], why:["Because the right channel can halve the time to solve a problem."] },
    { id:"chat-support", q:"What's different about chat support?", k:["chat support","live chat support","chatting","web chat","multiple chats","typing chat","chat window"], a:["You can handle a couple of chats at once, but you have to keep each one feeling personal.","Tone is harder in text, so I use friendly phrasing and clear steps.","Quick replies matter. Even a 'checking that now' message keeps people from feeling ignored."], more:["I use saved replies for common answers, but always tweak them to fit the person.","I avoid walls of text. Short messages, one step at a time."], ex:["For example: 'Great question, give me one moment to check your order.' then the answer in a separate short message."], why:["Because in chat, silence looks like nobody's there."] },
    { id:"email-support", q:"How do you write support emails?", k:["writing emails","support emails","email replies","email tone","answering emails","email template","inbox"], a:["Clear subject, friendly opening, the answer near the top, steps in a numbered list and a warm close.","I write like I talk on the phone, just a little tidier.","I answer every question they asked, in the order they asked. Missing one means another email."], more:["I reread before sending to check tone. Text can sound colder than you mean.","Templates help, but I always personalise the first line."], ex:["For example, I start with 'Thanks for reaching out about your delivery' rather than a generic greeting."], why:["Because a clear email prevents three more emails."] },
    { id:"knowledge-base", q:"Do you use a knowledge base?", k:["knowledge base","help articles","kb articles","internal wiki","help center","help centre","reference articles"], a:["All day. It's where the official answers and troubleshooting steps live.","A good knowledge base means I don't have to memorise everything, just know where to look.","I also suggest edits when an article is out of date. Keeping it fresh helps everyone."], more:["I bookmark the top articles I use most, so I can find them in seconds during a call.","When I solve something new, I flag it so it can become an article."], ex:["For example, a new product model came out and the reset steps were different. I flagged it and the article was updated that week."], why:["Because consistent answers come from one shared source."] },
    { id:"faqs", q:"What are the most common questions?", k:["faq","faqs","frequently asked","common questions","top questions","same question","most asked"], a:["Order status, billing questions, password resets, returns and how-to questions. Those are the regulars.","Where's my order is the champion. It wins every week.","The same ten questions make up most calls. Knowing those cold makes the day much smoother."], more:["We share the top questions with the web team so they can improve the FAQ page and save people a call.","Seasonal spikes change the list. Certain times of year bring a wave of specific questions."], ex:["For example, after a product launch, how to set it up jumps straight to the top."], why:["Because knowing the common questions lets us prepare great answers."] },
    { id:"troubleshooting", q:"How do you troubleshoot over the phone?", k:["troubleshooting","troubleshoot","fix a problem","technical support","tech support","diagnose","not working"], a:["Step by step, simplest first. Is it plugged in, is it on, has it been restarted. It's amazing how often that works.","I ask what changed recently. That question solves more problems than anything else.","I guide them slowly and confirm each step before moving on. Rushing gets people lost."], more:["I describe things in plain words, like 'the small round button on the back', not technical names.","I note every step tried in the ticket, so nobody repeats them later."], ex:["For example, a caller's device wouldn't start. We checked the outlet, tried a reset and it turned out the breaker had tripped."], why:["Because simple causes are the most common ones."] },
